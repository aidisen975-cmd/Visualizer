<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>Visualizer</title>
  <style>
    :root {
      --paper: #fbfbfa;
      --surface: #ffffff;
      --surface-2: #f5f6f5;
      --ink: #1d2024;
      --muted: #5d646b;
      --faint: #8b9299;
      --line: #d7dcde;
      --grid: #e4e7e8;
      --focus: #1e6eaa;
      --shadow: 0 12px 30px rgba(27, 34, 38, .08);
      --danger: #aa3f34;
      --ok: #35694b;
      --radius: 5px;
      --side: 268px;
      --props: 300px;
    }
    [data-theme="dark"] {
      --paper: #15191b;
      --surface: #1b2023;
      --surface-2: #242a2e;
      --ink: #f1f3f1;
      --muted: #bcc3c4;
      --faint: #889395;
      --line: #354045;
      --grid: #2b3438;
      --focus: #75b8e7;
      --shadow: 0 12px 32px rgba(0, 0, 0, .22);
      --danger: #e08b82;
      --ok: #8fbf9e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Aptos", "Helvetica Neue", "Noto Sans SC", "PingFang SC", sans-serif;
      font-size: 13px;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { color: inherit; }
    .tv-app {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      height: 100%;
    }
    .tv-header, .tv-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .tv-header { justify-content: space-between; min-height: 56px; }
    .tv-brand { min-width: 0; }
    .tv-kicker {
      margin: 0 0 2px;
      color: var(--focus);
      font: 600 10px/1.2 "SFMono-Regular", "Cascadia Mono", "Noto Sans Mono", monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .tv-header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -.03em;
      font-weight: 720;
      text-wrap: pretty;
    }
    .tv-header-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .tv-dirty, .tv-status {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .tv-dirty {
      display: none;
      padding: 6px 8px;
      color: #8a5a16;
      border-color: #e0c089;
    }
    .tv-dirty.is-on { display: block; }
    .tv-status {
      min-width: min(42vw, 420px);
      max-width: 520px;
      min-height: 34px;
      padding: 7px 10px;
    }
    .tv-status[data-tone="error"] { border-color: #c66d61; color: var(--danger); }
    .tv-status[data-tone="ok"] { border-color: #7ba88d; color: var(--ok); }
    .tv-toolbar { flex-wrap: wrap; gap: 8px; }
    .tv-file-button, .tv-button, .tv-select, .tv-field {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
    }
    .tv-file-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      cursor: pointer;
      border-style: dashed;
    }
    .tv-file-button:hover, .tv-file-button:focus-within,
    .tv-button:hover { border-color: var(--focus); background: var(--surface-2); }
    .tv-file-button input { display: none; }
    .tv-file-stamp {
      display: grid;
      place-items: center;
      width: 28px;
      height: 22px;
      border: 1px solid currentColor;
      border-radius: 3px;
      color: var(--focus);
      font: 700 9px/1 "SFMono-Regular", "Cascadia Mono", monospace;
    }
    .tv-button {
      padding: 0 11px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }
    .tv-button:active { transform: translateY(1px); }
    .tv-button:focus-visible, .tv-select:focus-visible, .tv-field:focus-visible, .tv-file-button:focus-within {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .tv-button--primary { border-color: var(--focus); background: var(--focus); color: #fff; }
    .tv-button--primary:hover { background: #155d91; color: #fff; }
    .tv-button--danger { color: var(--danger); }
    .tv-toolbar .tv-select { min-width: 92px; padding: 0 8px; }
    .tv-control { display: grid; gap: 3px; }
    .tv-control span, .tv-side h2, .tv-prop-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .02em;
    }
    .tv-workspace {
      display: grid;
      grid-template-columns: var(--side) minmax(0, 1fr) var(--props);
      min-height: 0;
    }
    .tv-side {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }
    .tv-side--props { border-right: 0; border-left: 1px solid var(--line); }
    .tv-side h2 {
      margin: 0;
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--line);
      font: 700 11px/1 "SFMono-Regular", "Cascadia Mono", monospace;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .tv-side-body { padding: 10px 12px 16px; }
    .tv-dataset {
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }
    .tv-dataset-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      padding: 7px 8px;
      border-bottom: 1px solid var(--line);
    }
    .tv-dataset-head input {
      width: 100%;
      min-height: 28px;
      padding: 0 6px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      font-weight: 650;
    }
    .tv-dataset-head input:hover, .tv-dataset-head input:focus { border-color: var(--line); background: var(--surface); }
    .tv-series-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      padding: 5px 8px;
      font-size: 12px;
    }
    .tv-series-row small { color: var(--faint); font-size: 10px; }
    .tv-add-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      margin-top: 10px;
    }
    .tv-select, .tv-field, textarea.tv-field {
      width: 100%;
      padding: 0 8px;
      background: var(--surface);
    }
    textarea.tv-field { min-height: 64px; padding: 7px 8px; resize: vertical; }
    .tv-canvas-scroll {
      min-width: 0;
      overflow: auto;
      background:
        linear-gradient(var(--paper), var(--paper)),
        repeating-linear-gradient(0deg, transparent, transparent 15px, var(--grid) 16px),
        repeating-linear-gradient(90deg, transparent, transparent 15px, var(--grid) 16px);
      background-color: #e7eaeb;
      padding: 20px;
    }
    [data-theme="dark"] .tv-canvas-scroll { background-color: #101416; }
    .tv-canvas-paper {
      position: relative;
      margin: 0 auto;
      background: var(--surface);
      box-shadow: var(--shadow);
      outline: 1px solid var(--line);
    }
    .tv-canvas-empty {
      display: grid;
      place-items: center;
      height: 100%;
      color: var(--muted);
      text-align: center;
      padding: 32px;
      line-height: 1.6;
      text-wrap: pretty;
    }
    .tv-plot {
      position: absolute;
      background: var(--surface);
    }
    .tv-plot.is-selected { outline: 2px solid var(--focus); z-index: 4; }
    .tv-plot svg { display: block; width: 100%; height: 100%; }
    .tv-plot-resize {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 14px;
      height: 14px;
      padding: 0;
      border: 0;
      background:
        linear-gradient(135deg, transparent 0 55%, var(--focus) 56% 64%, transparent 65% 75%, var(--focus) 76% 84%, transparent 85%);
      cursor: nwse-resize;
    }
    .tv-prop-block { display: grid; gap: 8px; margin-bottom: 14px; }
    .tv-prop-label { display: block; margin-bottom: 4px; }
    .tv-inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .tv-ref-row {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }
    .tv-ref-row input[type="color"] {
      width: 28px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .tv-hint { margin: 8px 0 0; color: var(--faint); font-size: 11px; line-height: 1.45; text-wrap: pretty; }
    .tv-preview {
      border: 0;
      padding: 0;
      width: min(96vw, 1280px);
      max-height: 92vh;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .tv-preview::backdrop { background: rgba(18, 22, 24, .45); }
    .tv-preview-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .tv-preview-stage {
      overflow: auto;
      max-height: calc(92vh - 52px);
      padding: 16px;
      background: #e7eaeb;
    }
    .tv-preview-stage svg {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .tv-icon-button {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .tv-icon-button:hover { border-color: var(--line); color: var(--ink); background: var(--surface); }
    @media (max-width: 1100px) {
      .tv-workspace { grid-template-columns: 230px minmax(0, 1fr) 250px; }
      .tv-status { min-width: 0; width: min(48vw, 280px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <div class="tv-app" id="tvApp" data-theme="light">
    <header class="tv-header">
      <div class="tv-brand">
        <p class="tv-kicker">Visualizer v0.1.0</p>
        <h1>实验数据可视化工作台</h1>
      </div>
      <div class="tv-header-meta">
        <div class="tv-dirty" id="tvDirty">未保存</div>
        <div class="tv-status" id="tvStatus" role="status">导入 CSV 开始，或打开已有工程。</div>
      </div>
    </header>
    <section class="tv-toolbar" aria-label="工程操作">
      <label class="tv-file-button">
        <span class="tv-file-stamp">CSV</span>
        <span>导入 CSV</span>
        <input id="tvCsvInput" type="file" accept=".csv,text/csv" multiple>
      </label>
      <button type="button" class="tv-button" id="tvNewProject">新建工程</button>
      <button type="button" class="tv-button" id="tvOpenProject">打开</button>
      <button type="button" class="tv-button" id="tvSaveProject">保存</button>
      <button type="button" class="tv-button tv-button--primary" id="tvNewPlot">新建图</button>
      <button type="button" class="tv-button" id="tvPreview">预览</button>
      <button type="button" class="tv-button" id="tvExportPng">导出 PNG</button>
      <button type="button" class="tv-button" id="tvExportSvg">导出 SVG</button>
      <label class="tv-control">
        <span>导入时间</span>
        <select id="tvSourceUnit" class="tv-select">
          <option value="s">秒</option>
          <option value="min">分钟</option>
          <option value="h">小时</option>
        </select>
      </label>
      <label class="tv-control">
        <span>显示时间</span>
        <select id="tvDisplayUnit" class="tv-select">
          <option value="s" selected>秒</option>
          <option value="min">分钟</option>
          <option value="h">小时</option>
        </select>
      </label>
      <input id="tvProjectInput" type="file" accept=".tvproj.json,.tvproj,.json,application/json" hidden>
    </section>
    <div class="tv-workspace">
      <aside class="tv-side" aria-label="数据">
        <h2>Data</h2>
        <div class="tv-side-body" id="tvDataPanel"></div>
      </aside>
      <section class="tv-canvas-scroll" id="tvCanvasScroll" aria-label="画布">
        <div class="tv-canvas-paper" id="tvCanvasPaper"></div>
      </section>
      <aside class="tv-side tv-side--props" aria-label="属性">
        <h2>Property</h2>
        <div class="tv-side-body" id="tvPropsPanel"></div>
      </aside>
    </div>
  </div>
  <dialog class="tv-preview" id="tvPreviewDialog" aria-label="画布预览">
    <div class="tv-preview-bar">
      <strong>画布预览</strong>
      <button type="button" class="tv-button" id="tvPreviewClose">关闭</button>
    </div>
    <div class="tv-preview-stage" id="tvPreviewStage"></div>
  </dialog>
  <script src="visualizer-core.js"></script>
  <script>
  (function () {
    "use strict";

    var core = window.VisualizerCore;
    var svgNamespace = "http://www.w3.org/2000/svg";
    var app = document.getElementById("tvApp");
    var paper = document.getElementById("tvCanvasPaper");
    var dataPanel = document.getElementById("tvDataPanel");
    var propsPanel = document.getElementById("tvPropsPanel");
    var statusEl = document.getElementById("tvStatus");
    var dirtyEl = document.getElementById("tvDirty");
    var previewDialog = document.getElementById("tvPreviewDialog");
    var previewStage = document.getElementById("tvPreviewStage");
    var lastCanvasSvg = "";
    var project = core.createProject();
    var selectedPlotId = null;
    var checkedSeries = new Set();
    var dirty = false;
    var drag = null;

    function cssValue(property) {
      return getComputedStyle(app).getPropertyValue(property).trim();
    }

    function theme() {
      return {
        surface: cssValue("--surface"),
        ink: cssValue("--ink"),
        muted: cssValue("--muted"),
        faint: cssValue("--faint"),
        line: cssValue("--line"),
        grid: cssValue("--grid")
      };
    }

    function setStatus(text, tone) {
      statusEl.textContent = text;
      statusEl.setAttribute("data-tone", tone || "");
    }

    function setDirty(value) {
      dirty = value;
      dirtyEl.classList.toggle("is-on", dirty);
      document.title = (dirty ? "• " : "") + project.projectName + " · Visualizer";
    }

    function selectedPlot() {
      return project.plots.find(function (plot) { return plot.id === selectedPlotId; }) || null;
    }

    function confirmDiscard() {
      return !dirty || window.confirm("有未保存的修改，确定放弃当前工程？");
    }

    function createSvg(name, attributes) {
      var element = document.createElementNS(svgNamespace, name);
      Object.keys(attributes || {}).forEach(function (key) { element.setAttribute(key, String(attributes[key])); });
      return element;
    }

    function appendSvg(parent, name, attributes, content) {
      var element = createSvg(name, attributes);
      if (content !== undefined) element.textContent = content;
      parent.appendChild(element);
      return element;
    }

    function measureText(text, font) {
      if (!measureText.ctx) measureText.ctx = document.createElement("canvas").getContext("2d");
      measureText.ctx.font = font;
      return measureText.ctx.measureText(text).width;
    }

    function niceStep(rawStep) {
      var power = Math.pow(10, Math.floor(Math.log10(Math.max(rawStep, 1e-9))));
      var fraction = rawStep / power;
      var nice = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10;
      return nice * power;
    }

    function ticks(low, high, count) {
      var step = niceStep((high - low) / Math.max(1, count - 1));
      var first = Math.ceil(low / step) * step;
      var results = [];
      for (var value = first; value <= high + step * 0.2; value += step) results.push(Number(value.toPrecision(8)));
      return results.length ? results : [low, high];
    }

    function compactNumber(value) {
      var abs = Math.abs(value);
      if (abs >= 100 || abs === 0) return value.toFixed(0);
      if (abs >= 10) return value.toFixed(1);
      return value.toFixed(2);
    }

    function downsampleIndexes(length, maximum) {
      if (length <= maximum) return null;
      var indexes = [0];
      var step = (length - 1) / (maximum - 1);
      for (var index = 1; index < maximum - 1; index += 1) indexes.push(Math.round(index * step));
      indexes.push(length - 1);
      return Array.from(new Set(indexes));
    }

    function linePath(xs, ys, xScale, yScale, maximum) {
      var indexes = downsampleIndexes(xs.length, maximum) || xs.map(function (_, index) { return index; });
      var path = "";
      var previous = -1;
      indexes.forEach(function (index) {
        if (index === previous) return;
        previous = index;
        path += (path ? "L" : "M") + xScale(xs[index]).toFixed(2) + "," + yScale(ys[index]).toFixed(2);
      });
      return path;
    }

    function legendLayout(items, maxWidth) {
      var font = "11px Aptos, Helvetica Neue, Noto Sans SC, sans-serif";
      var x = 0;
      var y = 0;
      var rowH = 16;
      var placed = [];
      items.forEach(function (item) {
        var width = 16 + measureText(item.label, font) + 4;
        if (x > 0 && x + width > maxWidth) {
          x = 0;
          y += rowH;
        }
        placed.push({ x: x, y: y, item: item });
        x += width + 12;
      });
      return { placed: placed, height: items.length ? y + rowH : 0 };
    }

    function buildPlotSvg(plot, width, height, interactive) {
      var colors = theme();
      var displayUnit = project.options.displayTimeUnit || "s";
      var resolved = core.resolvePlotSeries(project, plot);
      var visible = resolved.filter(function (item) { return item.visible; });
      var extents = core.plotExtents(project, plot);
      var xTicks = ticks(extents.x[0], extents.x[1], 5);
      var yTicks = ticks(extents.y[0], extents.y[1], 5);
      var font = "10px Aptos, Helvetica Neue, Noto Sans SC, sans-serif";
      var yLabelWidth = yTicks.reduce(function (max, tick) {
        return Math.max(max, measureText(compactNumber(tick), font));
      }, 24);
      var header = 16 + 18 + (plot.subtitle ? 16 : 0) + (plot.note ? 15 : 0);
      var legendItems = plot.legendVisible ? resolved.map(function (item) {
        var dataset = core.findDataset(project, item.series.datasetId);
        return {
          seriesId: item.series.id,
          label: (dataset ? dataset.name + " / " : "") + item.series.label,
          color: item.color,
          visible: item.visible
        };
      }) : [];
      var legend = legendLayout(legendItems, Math.max(120, width - 36));
      var margin = {
        top: header,
        right: 16,
        bottom: 36 + legend.height,
        left: Math.max(44, 14 + yLabelWidth)
      };
      var plotWidth = Math.max(40, width - margin.left - margin.right);
      var plotHeight = Math.max(40, height - margin.top - margin.bottom);
      var xScale = function (value) {
        return margin.left + (value - extents.x[0]) / (extents.x[1] - extents.x[0] || 1) * plotWidth;
      };
      var yScale = function (value) {
        return margin.top + (extents.y[1] - value) / (extents.y[1] - extents.y[0] || 1) * plotHeight;
      };
      var svg = createSvg("svg", {
        viewBox: "0 0 " + width + " " + height,
        width: width,
        height: height,
        role: "img",
        "aria-label": plot.title,
        xmlns: svgNamespace
      });
      appendSvg(svg, "rect", { x: 0, y: 0, width: width, height: height, fill: colors.surface });
      appendSvg(svg, "text", {
        x: 14, y: 22, fill: colors.ink, "font-size": 14, "font-weight": 700,
        "font-family": "Aptos, Helvetica Neue, Noto Sans SC, sans-serif"
      }, plot.title || "未命名图");
      if (plot.subtitle) {
        appendSvg(svg, "text", {
          x: 14, y: 40, fill: colors.muted, "font-size": 11,
          "font-family": "Aptos, Helvetica Neue, Noto Sans SC, sans-serif"
        }, plot.subtitle);
      }
      if (plot.note) {
        appendSvg(svg, "text", {
          x: 14, y: plot.subtitle ? 55 : 40, fill: colors.faint, "font-size": 10,
          "font-family": "Aptos, Helvetica Neue, Noto Sans SC, sans-serif"
        }, plot.note);
      }
      yTicks.forEach(function (tick) {
        var y = yScale(tick);
        appendSvg(svg, "line", { x1: margin.left, y1: y, x2: width - margin.right, y2: y, stroke: colors.grid, "stroke-width": 1 });
        appendSvg(svg, "text", {
          x: margin.left - 8, y: y + 3.5, fill: colors.muted, "font-size": 10,
          "text-anchor": "end", "font-family": "Aptos, Helvetica Neue, Noto Sans SC, sans-serif"
        }, compactNumber(tick));
      });
      xTicks.forEach(function (tick) {
        var x = xScale(tick);
        appendSvg(svg, "line", { x1: x, y1: height - margin.bottom, x2: x, y2: height - margin.bottom + 4, stroke: colors.line, "stroke-width": 1 });
        appendSvg(svg, "text", {
          x: x, y: height - margin.bottom + 16, fill: colors.muted, "font-size": 10,
          "text-anchor": "middle", "font-family": "Aptos, Helvetica Neue, Noto Sans SC, sans-serif"
        }, compactNumber(tick));
      });
      appendSvg(svg, "line", { x1: margin.left, y1: margin.top, x2: margin.left, y2: height - margin.bottom, stroke: colors.ink, "stroke-width": 1.1 });
      appendSvg(svg, "line", { x1: margin.left, y1: height - margin.bottom, x2: width - margin.right, y2: height - margin.bottom, stroke: colors.ink, "stroke-width": 1.1 });
      appendSvg(svg, "text", {
        x: margin.left + plotWidth / 2, y: height - margin.bottom + 30, fill: colors.ink, "font-size": 10,
        "text-anchor": "middle", "font-family": "Aptos, Helvetica Neue, Noto Sans SC, sans-serif"
      }, "Time (" + (core.TIME_LABELS[displayUnit] || displayUnit) + ")");
      var yTitle = appendSvg(svg, "text", {
        x: 12, y: margin.top + plotHeight / 2, fill: colors.ink, "font-size": 10,
        "text-anchor": "middle",
        transform: "rotate(-90 12 " + (margin.top + plotHeight / 2) + ")",
        "font-family": "Aptos, Helvetica Neue, Noto Sans SC, sans-serif"
      }, "Value");
      yTitle.setAttribute("letter-spacing", ".01em");
      visible.forEach(function (item) {
        var dataset = core.findDataset(project, item.series.datasetId);
        var xs = core.convertSeriesX(item.series, dataset ? dataset.timeUnit : "s", displayUnit);
        appendSvg(svg, "path", {
          d: linePath(xs, item.series.y, xScale, yScale, 1400),
          fill: "none",
          stroke: item.color,
          "stroke-width": 1.5,
          "stroke-linecap": "round",
          "stroke-linejoin": "round"
        });
      });
      if (!visible.length) {
        appendSvg(svg, "text", {
          x: margin.left + plotWidth / 2, y: margin.top + plotHeight / 2, fill: colors.muted, "font-size": 12,
          "text-anchor": "middle", "font-family": "Aptos, Helvetica Neue, Noto Sans SC, sans-serif"
        }, "从左侧勾选曲线并加入此图");
      }
      legend.placed.forEach(function (entry) {
        var x = 14 + entry.x;
        var y = height - legend.height + entry.y - 2;
        var swatch = appendSvg(svg, "rect", {
          x: x, y: y, width: 12, height: 2, fill: entry.item.visible ? entry.item.color : colors.faint
        });
        var label = appendSvg(svg, "text", {
          x: x + 16, y: y + 4, fill: entry.item.visible ? colors.ink : colors.faint, "font-size": 11,
          "font-family": "Aptos, Helvetica Neue, Noto Sans SC, sans-serif",
          "text-decoration": entry.item.visible ? "none" : "line-through"
        }, entry.item.label);
        if (interactive) {
          var hit = appendSvg(svg, "rect", {
            x: x, y: y - 8, width: Math.max(48, measureText(entry.item.label, "11px Aptos, Helvetica Neue, sans-serif") + 20),
            height: 16, fill: "transparent", cursor: "pointer"
          });
          hit.addEventListener("click", function (event) {
            event.stopPropagation();
            var ref = plot.seriesRefs.find(function (item) { return item.seriesId === entry.item.seriesId; });
            if (!ref) return;
            ref.visible = !ref.visible;
            setDirty(true);
            renderCanvas();
            renderProps();
          });
          swatch.style.pointerEvents = "none";
          label.style.pointerEvents = "none";
        }
      });
      return svg;
    }

    function buildCanvasSvg() {
      var colors = theme();
      var width = project.canvas.width;
      var height = project.canvas.height;
      var svg = createSvg("svg", {
        xmlns: svgNamespace,
        width: width,
        height: height,
        viewBox: "0 0 " + width + " " + height,
        "aria-label": project.projectName + " 画布"
      });
      appendSvg(svg, "rect", { width: width, height: height, fill: colors.surface });
      project.plots.forEach(function (plot) {
        var nested = buildPlotSvg(plot, plot.layout.width, plot.layout.height, false);
        nested.setAttribute("x", plot.layout.x);
        nested.setAttribute("y", plot.layout.y);
        svg.appendChild(nested);
      });
      lastCanvasSvg = new XMLSerializer().serializeToString(svg);
      return svg;
    }

    function svgFileText(svg) {
      if (!svg.getAttribute("xmlns")) svg.setAttribute("xmlns", svgNamespace);
      return '<?xml version="1.0" encoding="UTF-8"?>' + new XMLSerializer().serializeToString(svg);
    }

    function sanitizeFilename(value) {
      return String(value || "visualizer").replace(/[\\/:*?"<>|]/g, "_");
    }

    function downloadBlob(blob, filename) {
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    function bindPlotPointer(box, plot, handle) {
      box.addEventListener("pointerdown", function (event) {
        if (event.target === handle) return;
        selectedPlotId = plot.id;
        box.parentElement.appendChild(box);
        renderProps();
        document.querySelectorAll(".tv-plot").forEach(function (node) {
          node.classList.toggle("is-selected", node === box);
        });
        drag = {
          mode: "move",
          plot: plot,
          box: box,
          startX: event.clientX,
          startY: event.clientY,
          origX: plot.layout.x,
          origY: plot.layout.y
        };
        box.setPointerCapture(event.pointerId);
      });
      handle.addEventListener("pointerdown", function (event) {
        event.stopPropagation();
        selectedPlotId = plot.id;
        drag = {
          mode: "resize",
          plot: plot,
          box: box,
          startX: event.clientX,
          startY: event.clientY,
          origW: plot.layout.width,
          origH: plot.layout.height
        };
        box.setPointerCapture(event.pointerId);
      });
      box.addEventListener("pointermove", function (event) {
        if (!drag || drag.box !== box) return;
        var dx = event.clientX - drag.startX;
        var dy = event.clientY - drag.startY;
        if (drag.mode === "move") {
          plot.layout.x = Math.round(Math.max(0, drag.origX + dx));
          plot.layout.y = Math.round(Math.max(0, drag.origY + dy));
          box.style.left = plot.layout.x + "px";
          box.style.top = plot.layout.y + "px";
        } else {
          plot.layout.width = Math.round(Math.max(240, drag.origW + dx));
          plot.layout.height = Math.round(Math.max(180, drag.origH + dy));
          box.style.width = plot.layout.width + "px";
          box.style.height = plot.layout.height + "px";
        }
      });
      box.addEventListener("pointerup", function () {
        if (!drag || drag.box !== box) return;
        if (drag.mode === "resize") {
          box.replaceChildren(buildPlotSvg(plot, plot.layout.width, plot.layout.height, true), handle);
        }
        drag = null;
        setDirty(true);
      });
    }

    function makePlotBox(plot) {
      var box = document.createElement("div");
      box.className = "tv-plot" + (plot.id === selectedPlotId ? " is-selected" : "");
      box.dataset.plotId = plot.id;
      box.style.left = plot.layout.x + "px";
      box.style.top = plot.layout.y + "px";
      box.style.width = plot.layout.width + "px";
      box.style.height = plot.layout.height + "px";
      var handle = document.createElement("button");
      handle.type = "button";
      handle.className = "tv-plot-resize";
      handle.setAttribute("aria-label", "调整「" + plot.title + "」大小");
      box.append(buildPlotSvg(plot, plot.layout.width, plot.layout.height, true), handle);
      bindPlotPointer(box, plot, handle);
      return box;
    }

    function renderCanvas() {
      paper.style.width = project.canvas.width + "px";
      paper.style.height = project.canvas.height + "px";
      paper.replaceChildren();
      if (!project.plots.length) {
        var empty = document.createElement("div");
        empty.className = "tv-canvas-empty";
        empty.innerHTML = project.datasets.length
          ? "<div><strong>画布是空的</strong><p>点击「新建图」，然后从左侧勾选曲线加入指定图。</p></div>"
          : "<div><strong>等待实验数据</strong><p>导入 CSV，或打开 <code>.tvproj.json</code> 工程继续编辑。</p></div>";
        paper.appendChild(empty);
        return;
      }
      project.plots.forEach(function (plot) { paper.appendChild(makePlotBox(plot)); });
    }

    function axisFields(axis, axisName, onChange) {
      var wrap = document.createElement("div");
      wrap.className = "tv-prop-block";
      var label = document.createElement("label");
      label.className = "tv-prop-label";
      label.textContent = axisName + " 坐标";
      var mode = document.createElement("select");
      mode.className = "tv-select";
      mode.innerHTML = "<option value=\"auto\">自动</option><option value=\"manual\">手动</option>";
      mode.value = axis.mode;
      var range = document.createElement("div");
      range.className = "tv-inline";
      var min = document.createElement("input");
      min.className = "tv-field";
      min.type = "number";
      min.placeholder = "最小值";
      min.value = axis.min == null ? "" : axis.min;
      var max = document.createElement("input");
      max.className = "tv-field";
      max.type = "number";
      max.placeholder = "最大值";
      max.value = axis.max == null ? "" : axis.max;
      range.append(min, max);
      range.hidden = axis.mode !== "manual";
      function commit() {
        axis.mode = mode.value;
        axis.min = min.value === "" ? null : Number(min.value);
        axis.max = max.value === "" ? null : Number(max.value);
        range.hidden = axis.mode !== "manual";
        onChange();
      }
      mode.addEventListener("change", commit);
      min.addEventListener("change", commit);
      max.addEventListener("change", commit);
      wrap.append(label, mode, range);
      return wrap;
    }

    function renderProps() {
      propsPanel.replaceChildren();
      var projectBlock = document.createElement("div");
      projectBlock.className = "tv-prop-block";
      projectBlock.innerHTML = "<label class=\"tv-prop-label\">工程名称</label>";

      projectName.value = project.projectName;

        project.projectName = projectName.value.trim() || "未命名工程";

      });

      var width = document.createElement("input");

      width.type = "number";

      width.value = project.canvas.width;
      width.setAttribute("aria-label", "画布宽度");
      var height = document.createElement("input");

      height.type = "number";
      height.min = "300";
      height.value = project.canvas.height;

      function commitCanvas() {
        project.canvas.width = Math.max(400, Number(width.value) || 1280);

      height.addEventListener("change", commitCanvas);

      propsPanel.appendChild(projectBlock);

      var plot = selectedPlot();
      if (!plot) {
        var hint = document.createElement("p");

        propsPanel.appendChild(hint);
        return;
      }

      function field(labelText, value, tag) {
        var wrap = document.createElement("label");
        wrap.className = "tv-prop-block";
        var caption = document.createElement("span");
        caption.className = "tv-prop-label";
        caption.textContent = labelText;
        var input = document.createElement(tag || "input");
        input.className = "tv-field";
        input.value = value;
        wrap.append(caption, input);
        return { wrap: wrap, input: input };
      }

      var title = field("标题", plot.title);
      var subtitle = field("副标题", plot.subtitle);
      var note = field("备注", plot.note, "textarea");
      title.input.addEventListener("change", function () {
        plot.title = title.input.value;
        setDirty(true);
        renderCanvas();
        renderData();
      });
      subtitle.input.addEventListener("change", function () {
        plot.subtitle = subtitle.input.value;
        setDirty(true);
        renderCanvas();
      });
      note.input.addEventListener("change", function () {
        plot.note = note.input.value;
        setDirty(true);
        renderCanvas();
      });
      propsPanel.append(title.wrap, subtitle.wrap, note.wrap);

      var seriesBlock = document.createElement("div");
      seriesBlock.className = "tv-prop-block";
      var seriesLabel = document.createElement("div");
      seriesLabel.className = "tv-prop-label";
      seriesLabel.textContent = "曲线";
      seriesBlock.appendChild(seriesLabel);
      if (!plot.seriesRefs.length) {
        var emptySeries = document.createElement("p");
        emptySeries.className = "tv-hint";
        emptySeries.textContent = "此图还没有曲线。";
        seriesBlock.appendChild(emptySeries);
      }
      plot.seriesRefs.forEach(function (ref) {
        var series = core.findSeries(project, ref.seriesId);
        var row = document.createElement("div");
        row.className = "tv-ref-row";
        var visible = document.createElement("input");
        visible.type = "checkbox";
        visible.checked = ref.visible !== false;
        visible.setAttribute("aria-label", "显示 " + (series ? series.label : ref.seriesId));
        visible.addEventListener("change", function () {
          ref.visible = visible.checked;
          setDirty(true);
          renderCanvas();
        });
        var color = document.createElement("input");
        color.type = "color";
        color.value = ref.color || (series && series.color) || "#2477b6";
        color.addEventListener("input", function () {
          ref.color = color.value;
          setDirty(true);
          renderCanvas();
        });
        var name = document.createElement("span");
        var dataset = series ? core.findDataset(project, series.datasetId) : null;
        name.textContent = series ? ((dataset ? dataset.name + " / " : "") + series.label) : ref.seriesId;
        name.title = ref.seriesId;
        var remove = document.createElement("button");
        remove.type = "button";
        remove.className = "tv-icon-button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "从本图移除");
        remove.addEventListener("click", function () {

        renderCanvas();
      }));
      var del = document.createElement("button");

      del.addEventListener("click", function () { deletePlot(plot.id); });

    function renderAll() {
      app.setAttribute("data-theme", project.options.theme || "light");
      document.getElementById("tvSourceUnit").value = project.options.sourceTimeUnit;
      document.getElementById("tvDisplayUnit").value = project.options.displayTimeUnit;
      renderData();
      renderCanvas();
      renderProps();
      setDirty(dirty);
    }

    function deletePlot(id) {
      project.plots = project.plots.filter(function (plot) { return plot.id !== id; });
      if (selectedPlotId === id) selectedPlotId = project.plots[0] ? project.plots[0].id : null;
      setDirty(true);
      setStatus("已删除图。", "ok");
      renderAll();
    }

    function importFiles(files) {
      var list = Array.from(files || []).filter(function (file) { return /\.csv$/i.test(file.name); });
      if (!list.length) return setStatus("请选择 CSV 文件。", "error");
      var names = [];
      var errors = [];
      var chain = Promise.resolve();
      list.forEach(function (file) {
        chain = chain.then(function () {
          return file.text().then(function (text) {
            var dataset = core.parseDatasetFromCsv(text, {
              name: file.name,
              sourceFilename: file.name,
              timeUnit: project.options.sourceTimeUnit
            });
            core.addDataset(project, dataset);
            names.push(dataset.name);
          }).catch(function (error) {
            errors.push(file.name + "：" + (error.message || String(error)));
          });
        });
      });
      chain.then(function () {
        if (names.length) setDirty(true);
        if (errors.length && names.length) setStatus("已导入 " + names.length + " 个；失败 " + errors.length + " 个。" + errors[0], "error");
        else if (errors.length) setStatus(errors[0], "error");
        else setStatus("已导入 " + names.length + " 个数据源：" + names.join("、") + "。", "ok");
        renderAll();
      });
    }

    function applyProject(next, message) {
      project = next;
      selectedPlotId = next.plots[0] ? next.plots[0].id : null;
      checkedSeries = new Set();
      setDirty(false);
      setStatus(message, "ok");
      renderAll();
    }

    function newProject() {
      if (!confirmDiscard()) return;
      applyProject(core.createProject(), "已新建空工程。");
    }

    function openProjectText(text, filename, options) {
      var next;
      try {
        next = core.parseProject(text);
      } catch (error) {
        setStatus((filename ? filename + "：" : "") + error.message, "error");
        return false;
      }
      if (!(options && options.force) && !confirmDiscard()) return false;
      applyProject(next, "已打开工程「" + next.projectName + "」。");
      return true;
    }

    function saveProject() {
      var text = core.serializeProject(project);
      downloadBlob(new Blob([text], { type: "application/json;charset=utf-8" }), sanitizeFilename(project.projectName) + ".tvproj.json");
      setDirty(false);
      setStatus("已保存 " + project.projectName + ".tvproj.json（含嵌入数据）。", "ok");
    }

    function showPreview() {
      var svg = buildCanvasSvg();
      previewStage.replaceChildren(svg);
      if (typeof previewDialog.showModal === "function") previewDialog.showModal();
      else previewDialog.setAttribute("open", "open");
      setStatus("预览为当前画布，不含工具栏和属性面板。", "ok");
    }

    function exportSvg() {
      var svg = buildCanvasSvg();
      downloadBlob(new Blob([svgFileText(svg)], { type: "image/svg+xml;charset=utf-8" }), sanitizeFilename(project.projectName) + "_canvas.svg");
      setStatus("已导出当前画布 SVG。", "ok");
    }

    function exportPng() {
      var svg = buildCanvasSvg();
      var text = svgFileText(svg);
      var image = new Image();
      var url = URL.createObjectURL(new Blob([text], { type: "image/svg+xml;charset=utf-8" }));
      image.onload = function () {
        var canvas = document.createElement("canvas");
        canvas.width = project.canvas.width * 2;
        canvas.height = project.canvas.height * 2;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = theme().surface;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          if (!blob) return setStatus("PNG 导出失败。", "error");
          downloadBlob(blob, sanitizeFilename(project.projectName) + "_canvas.png");
          setStatus("已导出当前画布 PNG。", "ok");
        }, "image/png");
      };
      image.onerror = function () {
        URL.revokeObjectURL(url);
        setStatus("PNG 导出失败。", "error");
      };
      image.src = url;
    }

    document.getElementById("tvCsvInput").addEventListener("change", function (event) {
      importFiles(event.target.files);
      event.target.value = "";
    });
    document.getElementById("tvNewProject").addEventListener("click", newProject);
    document.getElementById("tvOpenProject").addEventListener("click", function () {
      document.getElementById("tvProjectInput").click();
    });
    document.getElementById("tvProjectInput").addEventListener("change", function (event) {

      event.target.value = "";

      file.text().then(function (text) { openProjectText(text, file.name); });

    document.getElementById("tvSaveProject").addEventListener("click", saveProject);
    document.getElementById("tvNewPlot").addEventListener("click", function () {
      var plot = core.createPlot(project, { title: "图 " + (project.plots.length + 1) });

      setStatus("已新建「" + plot.title + "」。从左侧勾选曲线并加入此图。", "ok");

    document.getElementById("tvPreview").addEventListener("click", showPreview);

      if (typeof previewDialog.close === "function") previewDialog.close();
      else previewDialog.removeAttribute("open");
    });
    document.getElementById("tvExportPng").addEventListener("click", exportPng);
    document.getElementById("tvExportSvg").addEventListener("click", exportSvg);
    document.getElementById("tvSourceUnit").addEventListener("change", function (event) {
      project.options.sourceTimeUnit = event.target.value;
    });
    document.getElementById("tvDisplayUnit").addEventListener("change", function (event) {
      project.options.displayTimeUnit = event.target.value;
      setDirty(true);
      renderCanvas();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key !== "Delete" && event.key !== "Backspace") return;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName)) return;
      if (!selectedPlotId) return;
      event.preventDefault();
      deletePlot(selectedPlotId);
    });
    window.addEventListener("beforeunload", function (event) {
      if (!dirty) return;
      event.preventDefault();
      event.returnValue = "";
    });
    app.addEventListener("dragover", function (event) { event.preventDefault(); });
    app.addEventListener("drop", function (event) {
      event.preventDefault();
      var files = Array.from(event.dataTransfer.files || []);
      var projectFile = files.find(function (file) { return /\.(tvproj\.json|tvproj|json)$/i.test(file.name); });
      if (projectFile) {
        projectFile.text().then(function (text) { openProjectText(text, projectFile.name); });
        return;
      }
      importFiles(files);
    });

    window.VisualizerApp = {
      getProject: function () { return project; },
      isDirty: function () { return dirty; },
      importCsvText: function (text, options) {
        var dataset = core.parseDatasetFromCsv(text, options || {});
        core.addDataset(project, dataset);
        setDirty(true);
        renderAll();
        return dataset.id;
      },
      addSeriesToPlot: function (plotId, seriesIds) {
        var plot = project.plots.find(function (item) { return item.id === plotId; });
        if (!plot) throw new Error("找不到图。");
        core.addSeriesToPlot(project, plot, seriesIds);
        selectedPlotId = plot.id;
        setDirty(true);
        renderAll();
      },
      selectPlot: function (plotId) {
        selectedPlotId = plotId;
        renderAll();
      },
      openProjectText: openProjectText,
      canvasSvgText: function () { return svgFileText(buildCanvasSvg()); },
      getLastCanvasSvg: function () { return lastCanvasSvg; },
      buildCanvasSvg: buildCanvasSvg
    };
    renderAll();
  }());
  </script>
</body>
</html>
