<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>Visualizer</title>
  <style>
    :root {
      --paper: #fbfbfa;
      --surface: #ffffff;
      --surface-2: #f5f6f5;
      --ink: #1d2024;
      --muted: #5d646b;
      --faint: #8b9299;
      --line: #d7dcde;
      --grid: #e4e7e8;
      --focus: #1e6eaa;
      --shadow: 0 12px 30px rgba(27, 34, 38, .08);
      --danger: #aa3f34;
      --ok: #35694b;
      --radius: 5px;
      --side: 268px;
      --props: 300px;
    }
    [data-theme="dark"] {
      --paper: #15191b;
      --surface: #1b2023;
      --surface-2: #242a2e;
      --ink: #f1f3f1;
      --muted: #bcc3c4;
      --faint: #889395;
      --line: #354045;
      --grid: #2b3438;
      --focus: #75b8e7;
      --shadow: 0 12px 32px rgba(0, 0, 0, .22);
      --danger: #e08b82;
      --ok: #8fbf9e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Aptos", "Helvetica Neue", "Noto Sans SC", "PingFang SC", sans-serif;
      font-size: 13px;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { color: inherit; }
    .tv-app {
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr);
      height: 100%;
    }
    .tv-topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 52px;
      padding: 0 8px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      min-width: 0;
    }
    .tv-brand { flex: 0 0 auto; }
    .tv-kicker {
      margin: 0;
      color: var(--ink);
      font: 650 13px/1 "Aptos", "Helvetica Neue", "Noto Sans SC", sans-serif;
      letter-spacing: .04em;
    }
    .tv-dirty, .tv-status {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }
    .tv-dirty {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tv-dirty.is-dirty { color: #8a5a16; }
    .tv-status {
      flex: 1 1 80px;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tv-status[data-tone="error"] { color: var(--danger); }
    .tv-status[data-tone="ok"] { color: var(--ok); }
    .tv-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }
    .tv-topbar .tv-button,
    .tv-topbar .tv-file-button,
    .tv-topbar .tv-menu > summary {
      min-height: 28px;
      padding: 0 8px;
    }
    .tv-menu { position: relative; }
    .tv-menu > summary {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      list-style: none;
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
    }
    .tv-menu > summary::-webkit-details-marker { display: none; }
    .tv-menu > summary::after { content: "▾"; color: var(--muted); font-size: 9px; }
    .tv-menu-list {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 40;
      min-width: 128px;
      padding: 4px;
      display: grid;
      gap: 2px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .tv-menu-list .tv-button { width: 100%; text-align: left; }
    .tv-file-button, .tv-button, .tv-select, .tv-field {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
    }
    .tv-file-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      cursor: pointer;
      border-style: dashed;
    }
    .tv-file-button:hover, .tv-file-button:focus-within,
    .tv-button:hover { border-color: var(--focus); background: var(--surface-2); }
    .tv-file-button input { display: none; }
    .tv-file-stamp {
      display: grid;
      place-items: center;
      width: 28px;
      height: 22px;
      border: 1px solid currentColor;
      border-radius: 3px;
      color: var(--focus);
      font: 700 9px/1 "SFMono-Regular", "Cascadia Mono", monospace;
    }
    .tv-button {
      padding: 0 11px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }
    .tv-button:active { transform: translateY(1px); }
    .tv-button:focus-visible, .tv-select:focus-visible, .tv-field:focus-visible, .tv-file-button:focus-within {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .tv-button:disabled, .tv-field:disabled { opacity: .55; cursor: default; }
    .tv-button--primary { border-color: var(--focus); background: var(--focus); color: #fff; }
    .tv-button--primary:hover { background: #155d91; color: #fff; }
    .tv-button--danger { color: var(--danger); }
    .tv-toolbar .tv-select { min-width: 92px; padding: 0 8px; }
    .tv-control { display: grid; gap: 3px; }
    .tv-control span, .tv-side h2, .tv-prop-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .02em;
    }
    .tv-workspace {
      display: grid;
      grid-template-columns: var(--side) 5px minmax(0, 1fr) 5px var(--props);
      min-height: 0;
    }
    .tv-workspace.is-left-collapsed { grid-template-columns: 28px 0 minmax(0, 1fr) 5px var(--props); }
    .tv-workspace.is-right-collapsed { grid-template-columns: var(--side) 5px minmax(0, 1fr) 0 28px; }
    .tv-workspace.is-left-collapsed.is-right-collapsed { grid-template-columns: 28px 0 minmax(0, 1fr) 0 28px; }
    .tv-side {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: var(--surface);
      border-right: 1px solid var(--line);
      position: relative;
    }
    .tv-side--props { border-right: 0; border-left: 1px solid var(--line); }
    .tv-side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .tv-side-head h2 { border-bottom: 0; flex: 1; }
    .tv-splitter {
      background: var(--line);
      cursor: col-resize;
      position: relative;
      z-index: 10;
    }
    .tv-splitter:hover, .tv-splitter.is-active { background: var(--focus); }
    .tv-canvas-col {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }
    .tv-zoombar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    .tv-zoombar-label {
      min-width: 44px;
      text-align: center;
      font: 650 11px/1 "SFMono-Regular", "Cascadia Mono", monospace;
      color: var(--muted);
    }
    .tv-tools {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-right: 8px;
      padding-right: 8px;
      border-right: 1px solid var(--line);
    }
    .tv-tools button, .tv-annotate summary, .tv-tools select {
      min-height: 28px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
      cursor: pointer;
    }
    .tv-tools button.is-on, .tv-annotate.is-on > summary {
      background: var(--focus);
      border-color: var(--focus);
      color: #fff;
    }
    .tv-annotate { position: relative; }
    .tv-annotate summary { list-style: none; }
    .tv-annotate summary::-webkit-details-marker { display: none; }
    .tv-annotate-menu {
      position: absolute;
      left: 0;
      bottom: calc(100% + 6px);
      z-index: 30;
      display: grid;
      gap: 4px;
      min-width: 88px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .tv-annotate-menu button { text-align: left; }
    .tv-inspector {
      position: absolute;
      z-index: 8;
      width: 260px;
      max-height: 300px;
      overflow: auto;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      pointer-events: auto;
    }
    .tv-inspector-row.is-nearest {
      background: color-mix(in srgb, var(--focus) 16%, transparent);
      font-weight: 680;
    }
    .tv-inspector-row.is-nearest span:first-child::before { content: "▶ "; }
    .tv-cursor-marker {
      position: absolute;
      width: 7px;
      height: 7px;
      margin: -3.5px 0 0 -3.5px;
      border-radius: 50%;
      pointer-events: none;
    }
    .tv-cursor-marker.is-nearest {
      width: 11px;
      height: 11px;
      margin: -5.5px 0 0 -5.5px;
      box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px currentColor;
    }
    .tv-inspector[hidden] { display: none; }
    .tv-inspector-x, .tv-inspector-y {
      font-variant-numeric: tabular-nums;
    }
    .tv-inspector-x { font-weight: 680; margin-bottom: 6px; }
    .tv-inspector-row, .tv-inspector-delta {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin: 0;
      padding: 2px 0;
    }
    .tv-inspector-row span:first-child, .tv-inspector-delta span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tv-inspector-delta { color: var(--focus); }
    .tv-overlay { position: absolute; inset: 0; pointer-events: none; }
    .tv-range-rect {
      position: absolute;
      background: rgba(30, 110, 170, .14);
      border: 1px solid var(--focus);
    }
    .tv-range-actions {
      position: absolute;
      display: flex;
      gap: 4px;
      pointer-events: auto;
    }
    .tv-crosshair, .tv-cursor-line {
      position: absolute;
      width: 1px;
      background: var(--danger);
    }
    .tv-cursor-tag {
      position: absolute;
      padding: 0 3px;
      background: var(--surface);
      color: var(--danger);
      font: 650 10px/14px "SFMono-Regular", "Cascadia Mono", monospace;
    }
    .tv-object-box {
      position: absolute;
      border: 1px solid var(--focus);
      pointer-events: none;
    }
    .tv-object-handle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--focus);
    }
    .tv-ann-edit {
      position: absolute;
      z-index: 7;
      min-width: 96px;
      min-height: 28px;
      pointer-events: auto;
    }
    .tv-ann-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 4px;
      align-items: center;
      margin-bottom: 6px;
    }
    .tv-layout-menu {
      position: absolute;
      z-index: 100;
      display: grid;
      grid-template-columns: repeat(4, 64px);
      gap: 8px;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .tv-layout-choice {
      display: grid;
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--line);
      background: var(--surface);
      cursor: pointer;
      color: var(--muted);
      font-size: 10px;
    }
    .tv-layout-choice:hover { border-color: var(--focus); color: var(--ink); }
    .tv-layout-icon {
      height: 36px;
      border: 1px solid currentColor;
      display: grid;
    }
    .tv-guides, .tv-dock-preview {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }
    .tv-guide {
      position: absolute;
      background: var(--focus);
      opacity: .7;
    }
    .tv-guide.is-x { width: 1px; top: 0; bottom: 0; }
    .tv-guide.is-y { height: 1px; left: 0; right: 0; }
    .tv-size-tip {
      position: absolute;
      z-index: 9;
      padding: 2px 6px;
      background: var(--ink);
      color: var(--surface);
      font: 650 11px/1.3 "SFMono-Regular", "Cascadia Mono", monospace;
      pointer-events: none;
    }
    .tv-legend-hit {
      position: absolute;
      cursor: move;
      z-index: 5;
      pointer-events: auto;
    }
    .tv-accordion {
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      margin: 0;
      background: transparent;
    }
    .tv-accordion > summary {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 2px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink);
      list-style: none;
    }
    .tv-accordion > summary::-webkit-details-marker { display: none; }
    .tv-accordion > summary::before {
      content: "›";
      width: 10px;
      color: var(--muted);
      font-weight: 400;
    }
    .tv-accordion[open] > summary::before { content: "⌄"; }
    .tv-accordion-body { padding: 0 0 8px 14px; display: grid; gap: 8px; }
    .tv-accordion .tv-accordion > summary { font-weight: 600; color: var(--muted); }
    .tv-original-name {
      color: var(--faint);
      font-size: 10px;
      line-height: 1.4;
      word-break: break-all;
    }
    .tv-preview-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .tv-preview-table th, .tv-preview-table td {
      border-bottom: 1px solid var(--line);
      padding: 4px 6px;
      text-align: left;
      vertical-align: top;
    }
    .tv-rename-stage { max-height: 48vh; overflow: auto; padding: 12px; }
    .tv-side h2 {
      margin: 0;
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--line);
      font: 700 11px/1 "SFMono-Regular", "Cascadia Mono", monospace;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .tv-side-body { padding: 10px 12px 16px; }
    .tv-dataset {
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }
    .tv-dataset-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto auto;
      gap: 6px;
      align-items: center;
      padding: 7px 8px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .tv-dataset-toggle {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
    }
    .tv-dataset-count {
      color: var(--faint);
      font-size: 10px;
      white-space: nowrap;
    }
    .tv-dataset-head input {
      width: 100%;
      min-height: 28px;
      padding: 0 6px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      font-weight: 650;
      cursor: text;
    }
    .tv-dataset-head input:hover, .tv-dataset-head input:focus { border-color: var(--line); background: var(--surface); }
    .tv-dataset-tools {
      display: flex;
      gap: 6px;
      padding: 6px 8px 2px;
    }
    .tv-button--tiny {
      min-height: 26px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 650;
    }
    .tv-series-list { padding-bottom: 4px; }
    .tv-series-row {
      display: grid;
      grid-template-columns: auto 10px minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      min-height: 28px;
      padding: 4px 8px;
      font-size: 12px;
      user-select: none;
      cursor: pointer;
    }
    .tv-series-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tv-series-row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
    .tv-series-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      justify-self: center;
    }
    .tv-line-preview {
      display: block;
      width: 46px;
      height: 10px;
      color: var(--ink);
    }
    .tv-cluster-style {
      display: grid;
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .tv-color-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }
    .tv-color-row input[type="color"] {
      width: 36px;
      height: 28px;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .tv-field.is-invalid { border-color: var(--danger); }
    .tv-field-error { color: var(--danger); font-size: 11px; }
    .tv-line-current {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 28px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: inherit;
      cursor: pointer;
      text-align: left;
    }
    .tv-line-menu-list {
      display: grid;
      margin-top: 4px;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .tv-line-menu-list[hidden] { display: none; }
    .tv-line-option {
      display: grid;
      grid-template-columns: 14px 46px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 28px;
      padding: 2px 6px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }
    .tv-line-option:hover, .tv-line-option.is-selected { background: var(--surface-2); }
    .tv-line-check { color: var(--focus); font-size: 12px; }
    .tv-title-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
    }
    .tv-series-row small { color: var(--faint); font-size: 10px; }
    .tv-add-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      margin-top: 10px;
    }
    .tv-select, .tv-field, textarea.tv-field {
      width: 100%;
      padding: 0 8px;
      background: var(--surface);
    }
    textarea.tv-field { min-height: 64px; padding: 7px 8px; resize: vertical; }
    .tv-canvas-scroll {
      min-width: 0;
      overflow: auto;
      background:
        linear-gradient(var(--paper), var(--paper)),
        repeating-linear-gradient(0deg, transparent, transparent 15px, var(--grid) 16px),
        repeating-linear-gradient(90deg, transparent, transparent 15px, var(--grid) 16px);
      background-color: #e7eaeb;
      padding: 20px;
    }
    [data-theme="dark"] .tv-canvas-scroll { background-color: #101416; }
    .tv-canvas-zoom { position: relative; }
    .tv-canvas-paper {
      position: relative;
      isolation: isolate;
      margin: 0 auto;
      background: var(--surface);
      box-shadow: var(--shadow);
      outline: 1px solid var(--line);
    }
    .tv-workspace.is-left-collapsed #tvLeftPanel .tv-side-body,
    .tv-workspace.is-right-collapsed #tvRightPanel .tv-side-body,
    .tv-workspace.is-left-collapsed #tvLeftPanel h2,
    .tv-workspace.is-right-collapsed #tvRightPanel h2,
    .tv-workspace.is-right-collapsed #tvRightPanel .tv-side-tabs { display: none; }
    .tv-canvas-empty {
      display: grid;
      place-items: center;
      height: 100%;
      color: var(--muted);
      text-align: center;
      padding: 32px;
      line-height: 1.6;
      text-wrap: pretty;
    }
    .tv-plot {
      position: absolute;
      background: var(--surface);
    }
    .tv-plot.is-selected { outline: none; }
    .tv-selection-overlay {
      position: absolute;
      outline: 2px solid var(--focus);
      pointer-events: none;
      z-index: 1000;
    }
    .tv-selection-overlay .tv-plot-resize { pointer-events: auto; }
    .tv-side-tabs { display: flex; gap: 4px; flex: 1; }
    .tv-side-tabs button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .tv-side-tabs button[aria-selected="true"] { color: var(--ink); background: var(--surface-2); }
    .tv-layer-count { margin: 0 0 8px; color: var(--muted); }
    .tv-layer-row {
      display: grid;
      grid-template-columns: 28px 28px 1fr;
      align-items: center;
      gap: 2px;
      width: 100%;
      margin: 0 0 2px;
      padding: 3px 4px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .tv-layer-row.is-child { margin-left: 16px; width: calc(100% - 16px); }
    .tv-layer-row.is-selected { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--focus); }
    .tv-layer-row button {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 2px;
      font: inherit;
    }
    .tv-layer-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tv-layer-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tv-object-kicker { margin: 0 0 8px; color: var(--muted); }
    .tv-plot svg { display: block; width: 100%; height: 100%; }
    .tv-plot-resize {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 14px;
      height: 14px;
      padding: 0;
      border: 0;
      background:
        linear-gradient(135deg, transparent 0 55%, var(--focus) 56% 64%, transparent 65% 75%, var(--focus) 76% 84%, transparent 85%);
      cursor: nwse-resize;
    }
    .tv-prop-block { display: grid; gap: 8px; margin-bottom: 14px; }
    .tv-prop-label { display: block; margin-bottom: 4px; }
    .tv-inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .tv-unit-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tv-unit-row .tv-field { flex: 1; min-width: 0; }
    .tv-inline[hidden] { display: none; }
    .tv-ref-row {
      display: grid;
      grid-template-columns: auto auto auto minmax(0, 1fr) auto;
      gap: 6px;
      align-items: start;
      margin-bottom: 8px;
    }
    .tv-ref-row input[type="checkbox"] { margin: 0; }
    .tv-series-names {
      min-width: 0;
      overflow: hidden;
    }
    .tv-series-display {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      width: 100%;
    }
    .tv-series-original {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--faint);
      font-size: 10px;
      line-height: 1.35;
      word-break: break-all;
    }
    .tv-swatch {
      width: 18px;
      height: 3px;
      border-radius: 1px;
      justify-self: center;
      margin-top: 8px;
    }
    .tv-eye-btn {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }
    .tv-eye-btn.is-off { color: var(--faint); }
    .tv-eye-btn:hover { border-color: var(--line); background: var(--surface); }
    .tv-ref-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      justify-self: stretch;
      width: auto;
    }
    .tv-line-width,
    .tv-legend-style-panel {
      display: grid;
      gap: 6px;
    }
    .tv-line-width-row,
    .tv-opacity-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px auto;
      gap: 8px;
      align-items: center;
    }
    .tv-line-width input[type="range"],
    .tv-opacity-row input[type="range"] {
      width: 100%;
      min-width: 0;
    }
    .tv-count-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .tv-scope-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    .tv-legend-hit.is-free {
      cursor: grab;
      background: rgba(30, 110, 170, .06);
      outline: 1px dashed transparent;
    }
    .tv-legend-hit.is-free:hover { outline-color: var(--focus); }
    .tv-layout-menu {
      min-width: 300px;
      grid-template-columns: repeat(4, 72px);
    }
    .tv-layout-primary {
      grid-column: 1 / -1;
      display: grid;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--line);
    }
    .tv-plot-tools {
      position: absolute;
      top: 6px;
      right: 8px;
      z-index: 6;
      display: flex;
      gap: 4px;
    }
    .tv-snap-pop {
      position: fixed;
      z-index: 80;
      display: grid;
      grid-template-columns: repeat(3, 92px);
      gap: 8px;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .tv-snap-choice { display: grid; gap: 4px; }
    .tv-snap-choice span { font-size: 10px; color: var(--muted); }
    .tv-snap-icon {
      display: grid;
      gap: 3px;
      height: 64px;
      padding: 3px;
      border: 1px solid var(--line);
      background: var(--paper, var(--surface));
    }
    .tv-snap-slot {
      min-height: 0;
      padding: 0;
      border: 1px solid var(--focus);
      background: color-mix(in srgb, var(--focus) 12%, var(--surface));
      cursor: pointer;
    }
    .tv-snap-slot:hover, .tv-snap-slot:focus-visible { background: var(--focus); }
    .tv-fig-group { border-bottom: 1px solid var(--line); margin-bottom: 6px; }
    .tv-fig-group-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto auto;
      gap: 4px;
      align-items: center;
      padding: 4px 0;
    }
    .tv-fig-group-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }
    .tv-fig-group-count { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .tv-ref-row input[type="color"] {
      width: 28px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .tv-hint { margin: 8px 0 0; color: var(--faint); font-size: 11px; line-height: 1.45; text-wrap: pretty; }
    .tv-preview {
      z-index: 1000;
      border: 0;
      padding: 0;
      width: min(96vw, 1280px);
      max-height: 92vh;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .tv-preview::backdrop,
    .tv-about::backdrop { background: rgba(18, 22, 24, .45); }
    .tv-preview-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .tv-preview-stage {
      overflow: auto;
      max-height: calc(92vh - 52px);
      padding: 16px;
      background: #e7eaeb;
    }
    .tv-preview-stage svg {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .tv-icon-button {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .tv-icon-button:hover { border-color: var(--line); color: var(--ink); background: var(--surface); }
    .tv-about {
      position: fixed;
      inset: 0;
      z-index: 1000;
      width: min(92vw, 420px);
      height: fit-content;
      max-height: min(78vh, 640px);
      margin: auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .tv-about[open] {
      display: flex;
      flex-direction: column;
    }
    .tv-about-body {
      padding: 14px 16px 16px;
      overflow: auto;
      min-height: 0;
    }
    .tv-about-name {
      margin: 0;
      font-size: 18px;
      letter-spacing: -.03em;
      font-weight: 720;
    }
    .tv-about-tagline { margin: 4px 0 0; color: var(--muted); }
    .tv-about-meta {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 16px;
      margin: 14px 0;
      padding: 10px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .tv-about-meta dt { color: var(--muted); }
    .tv-about-meta dd {
      margin: 0;
      font-family: "SFMono-Regular", "Cascadia Mono", "Noto Sans Mono", monospace;
    }
    .tv-update-status {
      margin: 0 0 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
      line-height: 1.5;
    }
    .tv-update-status[data-status="up-to-date"] { border-color: #7ba88d; color: var(--ok); }
    .tv-update-status[data-status="available"] { border-color: var(--focus); }
    .tv-update-status[data-status="error"] { border-color: #c66d61; }
    .tv-update-heading { margin: 0 0 6px; font-size: 13px; }
    .tv-update-version {
      margin: 0;
      font-family: "SFMono-Regular", "Cascadia Mono", "Noto Sans Mono", monospace;
    }
    .tv-update-notes {
      max-height: 180px;
      overflow: auto;
      margin: 8px 0 0;
      padding: 8px 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      font-size: 12px;
      line-height: 1.5;
    }
    .tv-update-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .tv-about .tv-button:disabled { opacity: .55; cursor: default; }
    .tv-about-releases {
      display: inline-block;
      margin-top: 14px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--focus);
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }
    .tv-about-spin {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 6px;
      border: 2px solid var(--line);
      border-top-color: var(--focus);
      border-radius: 50%;
      vertical-align: -2px;
      animation: tv-about-spin .7s linear infinite;
    }
    @keyframes tv-about-spin { to { transform: rotate(360deg); } }
    @media (max-width: 1100px) {
      .tv-status { min-width: 0; width: min(48vw, 280px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <div class="tv-app" id="tvApp" data-theme="light">
    <header class="tv-topbar">
      <div class="tv-brand">
        <p class="tv-kicker" id="tvKicker">VISUALIZER</p>
      </div>
      <div class="tv-dirty" id="tvDirty">未命名工程.json  · 已保存</div>
      <p class="tv-status" id="tvStatus" role="status">导入 CSV 开始，或打开已有工程。</p>
      <div class="tv-toolbar" role="toolbar" aria-label="工程操作">
        <label class="tv-file-button">
          <span>导入</span>
          <input id="tvCsvInput" type="file" accept=".csv,text/csv" multiple>
        </label>
        <button type="button" class="tv-button" id="tvNewProject">新建</button>
        <button type="button" class="tv-button" id="tvOpenProject">打开</button>
        <details class="tv-menu">
          <summary>保存</summary>
          <div class="tv-menu-list">
            <button type="button" class="tv-button" id="tvSaveProject">保存</button>
            <button type="button" class="tv-button" id="tvSaveProjectAs">另存为</button>
          </div>
        </details>
        <button type="button" class="tv-button tv-button--primary" id="tvNewPlot">+ 图</button>
        <button type="button" class="tv-button" id="tvLayout">布局</button>
        <button type="button" class="tv-button" id="tvPreview">预览</button>
        <details class="tv-menu">
          <summary>导出</summary>
          <div class="tv-menu-list">
            <button type="button" class="tv-button" id="tvExportPng">导出 PNG</button>
            <button type="button" class="tv-button" id="tvExportSvg">导出 SVG</button>
          </div>
        </details>
        <button type="button" class="tv-button" id="tvAboutOpen" data-role="open-about">关于</button>
        <input id="tvProjectInput" type="file" accept=".tvproj.json,.tvproj,.json,application/json" hidden>
      </div>
    </header>
    <div class="tv-workspace" id="tvWorkspace">
      <aside class="tv-side" id="tvLeftPanel" aria-label="数据">
        <div class="tv-side-head">
          <h2>数据</h2>
          <button type="button" class="tv-icon-button" id="tvCollapseLeft" aria-label="折叠数据栏">◀</button>
        </div>
        <div class="tv-side-body" id="tvDataPanel"></div>
      </aside>
      <div class="tv-splitter" id="tvSplitLeft" role="separator" aria-orientation="vertical" aria-label="调整数据栏宽度"></div>
      <section class="tv-canvas-col">
        <div class="tv-canvas-scroll" id="tvCanvasScroll" aria-label="画布" tabindex="0">
          <div class="tv-canvas-zoom" id="tvCanvasZoom">
            <div class="tv-canvas-paper" id="tvCanvasPaper"></div>
            <div class="tv-guides" id="tvGuides"></div>
          </div>
        </div>
        <div id="tvInspector" class="tv-inspector" hidden></div>
        <div class="tv-zoombar" aria-label="画布缩放">
          <div class="tv-tools" role="toolbar" aria-label="查看与标注">
            <button type="button" data-tool="pointer" aria-pressed="true">选择</button>
            <button type="button" data-tool="range-select" aria-pressed="false">框选</button>
            <button type="button" data-tool="cursor" aria-pressed="false">读数</button>
            <select id="tvCursorMode" aria-label="读数方式" hidden>
              <option value="nearest">最近点</option>
              <option value="interpolate">插值</option>
            </select>
            <button type="button" id="tvClearCursors" hidden>清除游标</button>
            <details class="tv-annotate" id="tvAnnotate">
              <summary data-tool="annotate">标注</summary>
              <div class="tv-annotate-menu">
                <button type="button" data-ann="annotation-point">数据点标注</button>
                <button type="button" data-ann="annotation-free">自由文本</button>
              </div>
            </details>
          </div>
          <button type="button" class="tv-button tv-button--tiny" id="tvZoomOut">−</button>
          <div class="tv-zoombar-label" id="tvZoomLabel">100%</div>
          <button type="button" class="tv-button tv-button--tiny" id="tvZoomIn">+</button>
          <button type="button" class="tv-button tv-button--tiny" id="tvZoomFit">适应窗口</button>
          <button type="button" class="tv-button tv-button--tiny" id="tvZoom100">100%</button>
        </div>
      </section>
      <div class="tv-splitter" id="tvSplitRight" role="separator" aria-orientation="vertical" aria-label="调整属性栏宽度"></div>
      <aside class="tv-side tv-side--props" id="tvRightPanel" aria-label="属性">
        <div class="tv-side-head">
          <div class="tv-side-tabs" role="tablist" aria-label="属性与图层">
            <button type="button" id="tvTabProps" role="tab" aria-selected="true">属性</button>
            <button type="button" id="tvTabLayers" role="tab" aria-selected="false">图层</button>
          </div>
          <button type="button" class="tv-icon-button" id="tvCollapseRight" aria-label="折叠属性栏">▶</button>
        </div>
        <div class="tv-side-body" id="tvPropsPanel"></div>
        <div class="tv-side-body" id="tvLayerPanel" hidden></div>
      </aside>
    </div>
  </div>
  <dialog class="tv-preview" id="tvPreviewDialog" aria-label="画布预览">
    <div class="tv-preview-bar">
      <strong>画布预览</strong>
      <button type="button" class="tv-button" id="tvPreviewClose">关闭</button>
    </div>
    <div class="tv-preview-stage" id="tvPreviewStage"></div>
  </dialog>
  <dialog class="tv-preview" id="tvRenameDialog" aria-label="批量重命名">
    <div class="tv-preview-bar">
      <strong>批量重命名</strong>
      <button type="button" class="tv-button" id="tvRenameClose">取消</button>
    </div>
    <div class="tv-rename-stage" id="tvRenameStage"></div>
  </dialog>
  <dialog class="tv-about" id="tvAboutDialog" aria-labelledby="tvAboutTitle">
    <div class="tv-preview-bar">
      <strong id="tvAboutTitle">关于 Visualizer</strong>
      <button type="button" class="tv-button" id="tvAboutClose">关闭</button>
    </div>
    <div class="tv-about-body" id="tvAboutBody"></div>
  </dialog>
  <script src="visualizer-core.js"></script>
  <script>
  (function () {
    "use strict";

    var core = window.VisualizerCore;
    var svgNamespace = "http://www.w3.org/2000/svg";
    var app = document.getElementById("tvApp");
    var paper = document.getElementById("tvCanvasPaper");
    var canvasScroll = document.getElementById("tvCanvasScroll");
    var canvasZoomEl = document.getElementById("tvCanvasZoom");
    var guidesEl = document.getElementById("tvGuides");
    var workspaceEl = document.getElementById("tvWorkspace");
    var leftPanel = document.getElementById("tvLeftPanel");
    var rightPanel = document.getElementById("tvRightPanel");
    var dataPanel = document.getElementById("tvDataPanel");
    var propsPanel = document.getElementById("tvPropsPanel");
    var layerPanel = document.getElementById("tvLayerPanel");
    var rightTab = "props";
    var inspectorKind = "normal";
    var inspectorTarget = "";
    var inspectorOpen = {
      normal: {
        chart: true, "chart.title": true, "chart.frame": false, canvas: false,
        xAxis: false, "xAxis.line": true, "xAxis.title": false, "xAxis.range": false, "xAxis.time": false, "xAxis.top": false,
        yAxis: false, "yAxis.line": true, "yAxis.title": false, "yAxis.range": false, "yAxis.right": false,
        legend: false, series: false, "series.list": true, "series.style": false,
        local: false, annotation: false, export: false
      },
      detail: {
        about: false, viewport: true, title: false,
        xAxis: false, "xAxis.line": true, "xAxis.title": false, "xAxis.time": false, "xAxis.top": false,
        yAxis: false, "yAxis.line": true, "yAxis.title": false, "yAxis.right": false,
        legend: false, link: false, place: false, annotation: false, export: false, canvas: false
      }
    };
    var statusEl = document.getElementById("tvStatus");
    var dirtyEl = document.getElementById("tvDirty");
    var previewDialog = document.getElementById("tvPreviewDialog");
    var previewStage = document.getElementById("tvPreviewStage");
    var renameDialog = document.getElementById("tvRenameDialog");
    var renameStage = document.getElementById("tvRenameStage");
    var lastCanvasSvg = "";
    var project = core.createProject();
    core.ensureDefaultPlot(project);
    var selectedPlotId = project.plots[0].id;
    var selectedRefIndex = 0;
    var lastSelectedSeriesId = {};
    var checkedSeries = new Set();
    var collapsedDatasets = new Set();
    var expandedFigureGroups = {};
    var openGroupStyleKey = null;
    var selectionAnchor = {};
    var activeDatasetId = null;
    var dataPanelActive = false;
    var propsPanelActive = false;
    var canvasActive = false;
    var projectFileHandle = null;
    var dirty = false;
    var drag = null;
    var splitterDrag = null;
    var interactionMode = "pointer";
    var selectedObject = null;
    var cursorHover = null;
    var readoutCursor = null;
    var cursorReadMode = "nearest";
    var pendingText = null;
    var styleGesture = null;
    var axisGesture = null;
    var editHistory = core.createHistory(core.HISTORY_LIMIT);
    var layoutMenu = null;
    var snapMenu = null;
    var snapCloseTimer = null;
    var tickWarning = "";

    function isTextEntry(el) {
      if (!el) return false;
      if (el.isContentEditable) return true;
      var tag = el.tagName;
      if (tag === "TEXTAREA" || tag === "SELECT") return true;
      if (tag !== "INPUT") return false;
      var type = String(el.type || "text").toLowerCase();
      return type !== "checkbox" && type !== "radio" && type !== "button" && type !== "color" && type !== "file";
    }

    function projectFilename(name) {
      var base = sanitizeFilename(name || "未命名工程");
      if (/\.tvproj\.json$/i.test(base)) return base;
      if (/\.tvproj$/i.test(base)) return base + ".json";
      if (/\.json$/i.test(base)) return base.replace(/\.json$/i, ".tvproj.json");
      return base + ".tvproj.json";
    }

    function canUseSavePicker() {
      return typeof window.showSaveFilePicker === "function";
    }

    function pickSaveFile(suggestedName, types) {
      if (canUseSavePicker()) {
        return window.showSaveFilePicker({
          suggestedName: suggestedName,
          types: types
        }).catch(function (error) {
          if (error && error.name === "AbortError") return null;
          throw error;
        });
      }
      setStatus("当前浏览器不支持自定义文件保存位置，文件将使用浏览器默认下载方式。", "");
      return Promise.resolve("download");
    }

    function writeBlobToHandle(handle, blob) {
      return handle.createWritable().then(function (writable) {
        return writable.write(blob).then(function () { return writable.close(); }).then(function () { return handle; });
      });
    }

    function saveBlobWithPicker(blob, suggestedName, types) {
      return pickSaveFile(suggestedName, types).then(function (handle) {
        if (!handle) return null;
        if (handle === "download") {
          downloadBlob(blob, suggestedName);
          return "download";
        }
        return writeBlobToHandle(handle, blob);
      });
    }

    function exportSuggestedName(ext) {
      var plot = selectedPlot() || (project.plots && project.plots[0]);
      var base = plot && plot.title ? plot.title : "Figure_1";
      return sanitizeFilename(base).replace(/\s+/g, "_") + "." + ext;
    }

    function canUseOpenPicker() {
      return typeof window.showOpenFilePicker === "function";
    }

    function cssValue(property) {
      return getComputedStyle(app).getPropertyValue(property).trim();
    }

    function theme() {
      return {
        surface: cssValue("--surface"),
        ink: cssValue("--ink"),
        muted: cssValue("--muted"),
        faint: cssValue("--faint"),
        line: cssValue("--line"),
        grid: cssValue("--grid")
      };
    }

    function setStatus(text, tone) {
      statusEl.textContent = text;
      statusEl.setAttribute("data-tone", tone || "");
    }

    function projectFileLabel() {
      if (projectFileHandle && projectFileHandle.name) return projectFileHandle.name;
      var name = (project && project.projectName) || "未命名工程";
      return /\.json$/i.test(name) ? name : name + ".json";
    }

    function setDirty(value) {
      dirty = value;
      dirtyEl.hidden = false;
      dirtyEl.classList.toggle("is-dirty", !!dirty);
      dirtyEl.textContent = projectFileLabel() + (dirty ? "  · 未保存" : "  · 已保存");
      document.title = (dirty ? "• " : "") + project.projectName + " · Visualizer";
    }

    function syncInspectorFocus(kind, focusKey, childKey) {
      var objectKey = selectedObject ? selectedObject.type + ":" + selectedObject.id : "plot";
      var target = kind + "\0" + (selectedPlotId || "") + "\0" + objectKey;
      var switched = inspectorTarget !== target;
      inspectorTarget = target;
      inspectorOpen[kind] = core.retainInspectorOpen(inspectorOpen[kind], switched, focusKey, childKey);
    }

    function uiState() {
      if (!project.ui) project.ui = core.normalizeUi(null);
      return project.ui;
    }

    function canvasZoom() {
      return core.clampZoom(uiState().canvasZoom);
    }

    function applyPanelLayout() {

    function downsampleIndexes(length, maximum) {
      if (length <= maximum) return null;
      var indexes = [0];
      var step = (length - 1) / (maximum - 1);
      for (var index = 1; index < maximum - 1; index += 1) indexes.push(Math.round(index * step));
      indexes.push(length - 1);
      return Array.from(new Set(indexes));
    }

    function linePath(xs, ys, xScale, yScale, maximum, xMin, xMax) {
      var indexes = [];
      var cursor;
      var windowed = Number.isFinite(xMin) && Number.isFinite(xMax) && xMax > xMin;
      for (cursor = 0; cursor < xs.length; cursor += 1) {
        if (!Number.isFinite(xs[cursor]) || !Number.isFinite(ys[cursor])) continue;
        if (windowed && (xs[cursor] < xMin || xs[cursor] > xMax)) continue;
        indexes.push(cursor);
      }
      if (windowed && indexes.length) {
        var first = indexes[0];
        var last = indexes[indexes.length - 1];
        for (cursor = first - 1; cursor >= 0; cursor -= 1) {
          if (Number.isFinite(xs[cursor]) && Number.isFinite(ys[cursor])) {
            indexes.unshift(cursor);
            break;
          }
        }
        for (cursor = last + 1; cursor < xs.length; cursor += 1) {
          if (Number.isFinite(xs[cursor]) && Number.isFinite(ys[cursor])) {
            indexes.push(cursor);
            break;
          }
        }
      }
      if (!indexes.length) indexes = xs.map(function (_, index) { return index; });
      if (indexes.length > maximum) {
        var sampled = [indexes[0]];
        var step = (indexes.length - 1) / (maximum - 1);
        for (cursor = 1; cursor < maximum - 1; cursor += 1) sampled.push(indexes[Math.round(cursor * step)]);
        sampled.push(indexes[indexes.length - 1]);
        indexes = sampled;
      }
      var path = "";
      var drawing = false;
      var previous = -1;
      indexes.forEach(function (index) {
        if (index === previous) return;
        previous = index;
        if (!Number.isFinite(xs[index]) || !Number.isFinite(ys[index])) {
          drawing = false;
          return;
        }
        path += (drawing ? "L" : "M") + xScale(xs[index]).toFixed(2) + "," + yScale(ys[index]).toFixed(2);
        drawing = true;
      });
      return path;
    }

    function drawDetailSourceBoxes(svg, plot, xScale, yScale) {
      (project.plots || []).forEach(function (detail) {
        var source = detail.detailSource;
        if (!source || source.sourceFigureId !== plot.id || source.showSourceBox === false || detail.visible === false) return;
        var range = source.sourceRange || {};
        var x = xScale(range.xMin);
        var y = yScale(range.yMax);
        var width = xScale(range.xMax) - x;
        var height = yScale(range.yMin) - y;
        if (![x, y, width, height].every(Number.isFinite)) return;
        var style = source.boxStyle || {};
        var attrs = {
          x: x,
          y: y,
          width: Math.max(0, width),
          height: Math.max(0, height),
          fill: "none",
          stroke: style.color || "#1d4e89",
          "stroke-width": style.lineWidth || 1.25
        };
        var dash = core.strokeDasharray(style.lineType);
        if (dash) attrs["stroke-dasharray"] = dash;
        appendSvg(svg, "rect", attrs);
      });
    }

    function appendDetailConnectors(svg, originOf, onlyPlot) {
      (project.plots || []).forEach(function (detail) {
        if (onlyPlot && detail.id !== onlyPlot.id) return;
        if (detail.visible === false) return;
        var spec = detail.detailSource;
        if (!spec || spec.showConnectorLines === false) return;
        var source = (project.plots || []).find(function (item) { return item.id === spec.sourceFigureId; });
        if (!source) return;
        var sourceSvg = originOf(source);
        var frame = sourceSvg && sourceSvg.__inspection && sourceSvg.__inspection.frame;
        if (!frame) return;
        var range = spec.sourceRange;
        var box = {
          x1: source.layout.x + frame.dataToPixelX(range.xMin),
          x2: source.layout.x + frame.dataToPixelX(range.xMax),
          y1: source.layout.y + frame.dataToPixelY(range.yMax),
          y2: source.layout.y + frame.dataToPixelY(range.yMin)
        };
        var figure = { x: detail.layout.x, y: detail.layout.y, width: detail.layout.width, height: detail.layout.height };
        var style = spec.connectorStyle || {};
        var dash = core.strokeDasharray(style.lineType);
        core.detailConnectorLines(box, figure).forEach(function (line) {
          var attrs = {
            x1: line.x1, y1: line.y1, x2: line.x2, y2: line.y2,
            stroke: style.color || "#1d4e89",
            "stroke-width": style.lineWidth || 1
          };
          if (dash) attrs["stroke-dasharray"] = dash;
          appendSvg(svg, "line", attrs);
        });
      });
    }

    function buildCanvasSvg() {
      var colors = theme();

      appendSvg(svg, "rect", { width: width, height: height, fill: colors.surface });
      var nodes = {};
      core.plotsInLayerOrder(project).forEach(function (plot) {
        if (plot.visible === false) return;

    function pushHistory(label, before, after) {
      if (JSON.stringify(before) === JSON.stringify(after)) return;
      editHistory.push({
        label: label,
        undo: function () { core.restoreEditorState(project, before); },
        redo: function () { core.restoreEditorState(project, after); }
      });
    }

      var before = core.captureEditorState(project);
      mutate();
      pushHistory(label, before, core.captureEditorState(project));
      setDirty(true);
    }

    function applyHistory(direction) {

      if (!entry) return;

      drag = null;
      setDirty(true);
      renderAll();
      setStatus(direction === "undo" ? "已撤销。" : "已重做。", "");

    function formatReading(value) {
      if (!Number.isFinite(value)) return "—";
      var abs = Math.abs(value);
      if (abs !== 0 && (abs >= 10000 || abs < 0.001)) return value.toExponential(2);
      return String(Math.round(value * 1000) / 1000);
    }

    function annotationPixels(ann, frame, area) {
      function point(source) {
        if (!source) return { x: 0, y: 0 };

    function drawAnnotationBox(svg, x, y, text, style, colors) {

    function drawAnnotation(svg, ann, pixels, colors) {
      var style = ann.style || {};
      if (ann.type === "region") {

        var y = Math.min(pixels.anchor.y, pixels.end.y);

        });

          applyText(svg, x + 4, y + (style.fontSize || 12), {
            fontFamily: style.fontFamily, fontSize: style.fontSize, fontWeight: style.fontWeight, fontColor: style.color
          }, style.color || colors.ink, {}, ann.text);
        }

      }
      if (ann.type === "arrow") {
        appendSvg(svg, "line", {
          x1: pixels.anchor.x, y1: pixels.anchor.y, x2: pixels.end.x, y2: pixels.end.y,

        });

          points: arrowHeadPoints(pixels.anchor.x, pixels.anchor.y, pixels.end.x, pixels.end.y),
          fill: style.color || colors.ink
        });
        if (ann.text) {
          applyText(svg, pixels.end.x + 6, pixels.end.y, {
            fontFamily: style.fontFamily, fontSize: style.fontSize, fontWeight: style.fontWeight, fontColor: style.color
          }, style.color || colors.ink, {}, ann.text);

      }, style.color || colors.ink, {}, text);

    function drawMarker(svg, point, shape, style, colors) {

    function arrowHeadPoints(x1, y1, x2, y2) {

    function appendRangeOverlay(overlay, box, plot, gesture) {

      bar.style.left = Math.max(0, Math.min(x, plot.layout.width - 220)) + "px";

      [["放大到此范围", function () { zoomToRange(plot, gesture.range); }], ["创建局部视图", function () { createLocalFigure(plot, gesture.range); }], ["取消", function () { drag = null; updateOverlay(box, plot); }]].forEach(function (item) {

    function appendSelectionChrome(overlay, info) {

    function annotationBounds(hit) {
      if (hit.box) return hit.box;
      if (hit.type === "region" || hit.type === "arrow") {
        var x = Math.min(hit.anchor.x, hit.end.x);
        var y = Math.min(hit.anchor.y, hit.end.y);
        return { x: x, y: y, width: Math.max(8, Math.abs(hit.end.x - hit.anchor.x)), height: Math.max(8, Math.abs(hit.end.y - hit.anchor.y)) };
      }
      return { x: hit.anchor.x - 6, y: hit.anchor.y - 14, width: 72, height: 22 };
    }

    function hitInspection(info, x, y) {
      if (!info) return null;

      var inPlot = x >= area.x && y >= area.y && x <= area.x + area.width && y <= area.y + area.height;
      if (interactionMode !== "pointer") return inPlot ? { kind: "plot" } : null;
      var i;
      for (i = info.insets.length - 1; i >= 0; i -= 1) {
        var rect = info.insets[i].rect;
        if (Math.abs(x - (rect.x + rect.width)) <= 8 && Math.abs(y - (rect.y + rect.height)) <= 8) {
          return { kind: "inset-handle", id: info.insets[i].id };
        }
      }
      for (i = info.annotations.length - 1; i >= 0; i -= 1) {
        if (annotationContains(info.annotations[i], x, y)) return { kind: "annotation", id: info.annotations[i].id, type: info.annotations[i].type };
      }
      for (i = info.insets.length - 1; i >= 0; i -= 1) {
        var body = info.insets[i].rect;
        if (x >= body.x && y >= body.y && x <= body.x + body.width && y <= body.y + body.height) {
          return { kind: "inset", id: info.insets[i].id };
        }
      }
      return inPlot ? { kind: "plot" } : null;
    }

    function annotationContains(hit, x, y) {
      if (hit.type === "region") {
        var left = Math.min(hit.anchor.x, hit.end.x);
        var top = Math.min(hit.anchor.y, hit.end.y);
        return x >= left && y >= top && x <= left + Math.abs(hit.end.x - hit.anchor.x) && y <= top + Math.abs(hit.end.y - hit.anchor.y);
      }
      if (hit.box && x >= hit.box.x && y >= hit.box.y && x <= hit.box.x + hit.box.width && y <= hit.box.y + hit.box.height) return true;
      if (hit.type === "point") return Math.hypot(x - hit.anchor.x, y - hit.anchor.y) <= 8;
      if (hit.type === "arrow") return distanceToSegment(x, y, hit.anchor.x, hit.anchor.y, hit.end.x, hit.end.y) <= 6;
      return Math.hypot(x - hit.anchor.x, y - hit.anchor.y) <= 12;
    }

    function distanceToSegment(px, py, x1, y1, x2, y2) {
      var dx = x2 - x1;
      var dy = y2 - y1;

      return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    function clampToPlotArea(pt, area) {
      return {
        x: Math.min(area.x + area.width, Math.max(area.x, pt.x)),
        y: Math.min(area.y + area.height, Math.max(area.y, pt.y))

    }

        { x: frame.pixelToDataX(start.x), y: frame.pixelToDataY(start.y) },

        gesture.plot.id
      );
      if (range && xOnly) {
        range.yMin = gesture.info.extents.y[0];
        range.yMax = gesture.info.extents.y[1];

      }
      return range;
    }

    function zoomToRange(plot, range) {
      if (!range || !(range.xMax > range.xMin)) {
        setStatus("选择范围太小。", "error");
        return;
      }
      commitEdit("Zoom to range", function () {
        core.writeAxisRange(plot.xAxis, range.xMin, range.xMax);
        if (!range.xOnly && range.yMax > range.yMin) core.writeAxisRange(plot.yAxis, range.yMin, range.yMax);
      });
      drag = null;
      renderCanvas();
      renderProps();
    }

    function createLocalFigure(plot, range) {
      if (!range || !(range.xMax > range.xMin)) {
        setStatus("选择范围太小。", "error");
        return;
      }
      var created = null;
      commitEdit("Create local figure", function () {
        created = core.createLocalPlot(project, plot, range);
      });
      if (created) activatePlot(created.id);
      drag = null;
      core.syncCanvasToPlots(project);
      renderAll();
      setStatus(created ? "已创建局部视图「" + core.plotEditorName(created) + "」。" : "未能创建局部视图。", created ? "ok" : "error");
    }

    function createInsetFromRange(plot, range, plotArea) {
      if (!range || !(range.xMax > range.xMin)) {
        setStatus("选择范围太小。", "error");
        return;
      }
      var ids = core.resolvePlotSeries(project, plot).filter(function (item) { return item.visible; }).map(function (item) { return item.series.id; });
      var rect = core.clampInsetRect({
        x: plotArea.x + Math.max(8, plotArea.width - 220),
        y: plotArea.y + 8,
        width: Math.min(210, Math.max(80, plotArea.width * 0.42)),
        height: Math.min(140, Math.max(70, plotArea.height * 0.42))
      }, plot.layout.width, plot.layout.height);
      var inset = null;
      commitEdit("Create inset", function () {
        inset = core.normalizeInset({
          sourcePlotId: plot.id,
          sourceRange: { xMin: range.xMin, xMax: range.xMax, yMin: range.yMin, yMax: range.yMax },
          rect: rect,
          seriesIds: ids,
          xAxis: { auto: false, min: range.xMin, max: range.xMax },
          yAxis: { auto: true },
          connector: { visible: true }
        }, plot.id);
        plot.insets.push(inset);
      });
      selectedObject = inset ? { type: "inset", id: inset.id, plotId: plot.id } : null;
      drag = null;
      renderCanvas();
      renderProps();
    }

    function addAnnotation(plot, raw) {
      var ann = core.normalizeAnnotation(raw, plot.id);
      if (!ann) return null;
      if (ann.type === "text" && plot.textStyles && plot.textStyles.annotation) {
        ann.style.fontFamily = plot.textStyles.annotation.fontFamily;
        ann.style.fontSize = plot.textStyles.annotation.fontSize;
        ann.style.fontWeight = plot.textStyles.annotation.fontWeight;
        if (plot.textStyles.annotation.fontColor) ann.style.color = plot.textStyles.annotation.fontColor;
      }
      commitEdit("Create annotation", function () { plot.annotations.push(ann); });
      selectedObject = { type: "annotation", id: ann.id, plotId: plot.id };
      return ann;
    }

    function placeReadout(plot, dataX, nearestSeriesId) {
      readoutCursor = { plotId: plot.id, x: dataX, nearestSeriesId: nearestSeriesId || "" };
      cursorHover = null;
    }

    function showInspector(plot, dataX, clientX, clientY, nearestSeriesId) {
      var host = document.getElementById("tvInspector");
      var column = host.parentElement.getBoundingClientRect();
      var left = clientX - column.left + 16;
      var top = clientY - column.top + 16;
      if (left + 230 > column.width) left = Math.max(8, clientX - column.left - 236);
      if (top + 160 > column.height) top = Math.max(8, top - 180);
      host.style.left = left + "px";
      host.style.top = top + "px";
      host.hidden = false;
      host.replaceChildren();
      var xRow = document.createElement("div");
      xRow.className = "tv-inspector-x";
      xRow.textContent = "X = " + formatReading(dataX);
      host.appendChild(xRow);
      var rows = core.readPlotAtX(project, plot, dataX, cursorReadMode);
      if (!rows.length) {
        var empty = document.createElement("p");
        empty.className = "tv-hint";
        empty.textContent = "此图没有可见曲线。";
        host.appendChild(empty);
      }
      var nearestRow = null;
      rows.forEach(function (row) {
        var line = inspectorRow(row.name, formatReading(row.y) + (row.unit ? " " + row.unit : ""));
        line.title = row.name;
        if (row.seriesId && row.seriesId === nearestSeriesId) {
          line.classList.add("is-nearest");
          nearestRow = line;
        }
        host.appendChild(line);
      });
      if (nearestRow) {
        var top = nearestRow.offsetTop;
        var bottom = top + nearestRow.offsetHeight;
        if (top < host.scrollTop) host.scrollTop = top;
        else if (bottom > host.scrollTop + host.clientHeight) host.scrollTop = bottom - host.clientHeight;
      }
      var cursors = plot.fixedCursors || [];
      var cursorA = cursors.find(function (item) { return item.id === "A"; });
      var cursorB = cursors.find(function (item) { return item.id === "B"; });
      if (cursorA && cursorB) {
        host.appendChild(inspectorRow("ΔX", formatReading(cursorB.x - cursorA.x), true));
        var rowsA = core.readPlotAtX(project, plot, cursorA.x, cursorReadMode);
        var rowsB = core.readPlotAtX(project, plot, cursorB.x, cursorReadMode);
        rowsA.forEach(function (row) {
          var other = rowsB.find(function (item) { return item.seriesId === row.seriesId; });
          var delta = row.y == null || !other || other.y == null ? null : other.y - row.y;
          host.appendChild(inspectorRow("ΔY " + row.name, formatReading(delta), true));
        });
      }
    }

    function inspectorRow(name, value, delta) {
      var row = document.createElement("p");
      row.className = delta ? "tv-inspector-delta" : "tv-inspector-row";
      var label = document.createElement("span");
      label.textContent = name;
      var reading = document.createElement("span");
      reading.className = "tv-inspector-y";
      reading.textContent = value;
      row.append(label, reading);
      return row;
    }

    function deleteSelectedObject() {
      var plot = selectedPlot();
      if (!plot || !selectedObject || selectedObject.plotId !== plot.id) return false;
      var objectId = selectedObject.id;
      var objectType = selectedObject.type;
      commitEdit(objectType === "inset" ? "Delete inset" : "Delete annotation", function () {
        if (objectType === "inset") plot.insets = plot.insets.filter(function (item) { return item.id !== objectId; });
        else plot.annotations = plot.annotations.filter(function (item) { return item.id !== objectId; });
      });
      selectedObject = null;
      renderCanvas();
      renderProps();
      return true;
    }

    function beginTextEdit(box, plot, ann) {
      var svg = box.querySelector("svg");
      var info = svg && svg.__inspection;
      if (!info) return;
      var pixels = annotationPixels(ann, info.frame, info.plotArea);
      var input = document.createElement(ann.type === "point" || ann.type === "free" ? "textarea" : "input");
      input.className = "tv-field tv-ann-edit";
      input.value = ann.text || "";
      var origin = ann.type === "point" || ann.type === "free" ? pixels.end : pixels.anchor;
      input.style.left = origin.x + "px";
      input.style.top = origin.y + "px";
      var closed = false;
      function finish() {
        if (closed) return;
        closed = true;
        commitEdit("Edit annotation", function () { ann.text = input.value; });
        input.remove();
        renderCanvas();
        renderProps();
      }
      input.addEventListener("keydown", function (event) {
        event.stopPropagation();
        if (event.key === "Enter") { event.preventDefault(); finish(); }
        if (event.key === "Escape") { closed = true; input.remove(); }
      });
      input.addEventListener("blur", finish);
      box.appendChild(input);
      input.focus();
      input.select();
    }

    function bindPlotPointer(box, plot, handle) {
      function others() {
        return project.plots.filter(function (item) { return item.id !== plot.id; });
      }
      function selectBox() {
        var switched = activatePlot(plot.id);
        if (switched) {
          paper.querySelectorAll(".tv-crosshair").forEach(function (node) { node.remove(); });
          document.getElementById("tvInspector").hidden = true;
          renderData();
        }
        document.querySelectorAll(".tv-plot").forEach(function (node) {
          node.classList.toggle("is-selected", node === box);
        });
        paintSelectionOverlay();
        renderLayers();
      }
      box.addEventListener("pointerdown", function (event) {
        if (event.button != null && event.button !== 0) return;
        if (event.target === handle || (event.target.closest && event.target.closest(".tv-legend-hit, .tv-range-actions, .tv-ann-edit, .tv-plot-tools"))) return;
        var point = figurePoint(box, event);
        var svg = box.querySelector("svg");
        var info = svg && svg.__inspection;
        var hit = hitInspection(info, point.x, point.y);
        selectBox();
        if (plot.locked) {
          selectedObject = null;
          renderProps();
          return;
        }
        if (hit && hit.kind === "inset-handle") return startInsetGesture(box, plot, hit.id, "inset-resize", point, event);
        if (hit && hit.kind === "inset") return startInsetGesture(box, plot, hit.id, "inset-move", point, event);
        if (hit && hit.kind === "annotation") {
          var ann = (plot.annotations || []).find(function (item) { return item.id === hit.id; });
          selectedObject = { type: "annotation", id: hit.id, plotId: plot.id };
          renderProps();
          if (event.detail === 2 && ann && (ann.type === "text" || ann.type === "point" || ann.type === "free")) {
            beginTextEdit(box, plot, ann);
            return;
          }
          return startAnnotationGesture(box, plot, ann, point, info, event);
        }
        if (hit && hit.kind === "plot" && interactionMode !== "pointer") {
          return startToolGesture(box, plot, point, info, event);
        }
        if (interactionMode !== "pointer") return;
        selectedObject = null;
        drag = {
          mode: "move",
          plot: plot,
          box: box,
          before: core.captureEditorState(project),
          startX: event.clientX,
          startY: event.clientY,
          origX: plot.layout.x,
          origY: plot.layout.y
        };
        box.setPointerCapture(event.pointerId);
        renderProps();
      });
      if (handle) handle.addEventListener("pointerdown", function (event) {
        event.stopPropagation();
        if (plot.locked) {
          selectBox();
          renderProps();
          return;
        }
        selectBox();
        drag = {
          mode: "resize",
          plot: plot,
          box: box,
          before: core.captureEditorState(project),
          startX: event.clientX,
          startY: event.clientY,
          origW: plot.layout.width,
          origH: plot.layout.height
        };
        box.setPointerCapture(event.pointerId);
      });
      box.addEventListener("pointermove", function (event) {
        var point = figurePoint(box, event);
        if (interactionMode === "cursor" && (!drag || drag.box !== box)) {
          var svg = box.querySelector("svg");
          var info = svg && svg.__inspection;
          if (info && point.x >= info.plotArea.x && point.y >= info.plotArea.y && point.x <= info.plotArea.x + info.plotArea.width && point.y <= info.plotArea.y + info.plotArea.height) {
            if (readoutCursor && readoutCursor.plotId === plot.id) {
              readoutCursor.nearestSeriesId = nearestSeriesAtX(plot, info, readoutCursor.x, point.x, point.y);
              updateOverlay(box, plot);
              showInspector(plot, readoutCursor.x, event.clientX, event.clientY, readoutCursor.nearestSeriesId);
            } else {
              var hover = core.snapReadout(project, plot, info.frame, point.x, point.y);
              cursorHover = { plotId: plot.id, x: hover.x, nearestSeriesId: hover.nearestSeriesId };
              updateOverlay(box, plot);
              showInspector(plot, hover.x, event.clientX, event.clientY, hover.nearestSeriesId);
            }
          }
        }
        if (!drag || drag.box !== box) return;
        if (drag.mode === "range" || drag.mode === "arrow" || drag.mode === "region") {
          drag.currentPt = point;
          updateOverlay(box, plot);
          return;
        }
        if (drag.mode === "inset-move" || drag.mode === "inset-resize") return moveInset(plot, point);
        if (drag.mode === "ann-move") return moveAnnotation(point);
        var delta = core.screenToWorld(event.clientX - drag.startX, event.clientY - drag.startY, canvasZoom());
        if (drag.mode === "move") {
          plot.layout.x = Math.round(drag.origX + delta.x);
          plot.layout.y = Math.round(drag.origY + delta.y);
          var snapped = core.snapPlotMove(plot, others(), project.canvas, canvasZoom());
          showGuides(snapped.guides);
          box.style.left = plot.layout.x + "px";
          box.style.top = plot.layout.y + "px";
        } else if (drag.mode === "resize") {
          core.setPlotSize(plot, drag.origW + delta.x, drag.origH + delta.y, "width");
          var resized = core.snapPlotResize(plot, others(), project.canvas, canvasZoom());
          showGuides(resized.guides);
          box.style.width = plot.layout.width + "px";
          box.style.height = plot.layout.height + "px";
          showSizeTip(plot);
        }
        syncSelectionOverlay();
        paintDetailLinks();
        syncSizeFields(plot);
      });
      box.addEventListener("pointerup", function (event) {
        if (event.target.closest && event.target.closest(".tv-range-actions")) return;
        if (!drag || drag.box !== box) return;
        finishPlotGesture(box, plot);
      });
    }

    function startInsetGesture(box, plot, id, mode, point, event) {
      var inset = (plot.insets || []).find(function (item) { return item.id === id; });
      if (!inset) return;
      selectedObject = { type: "inset", id: id, plotId: plot.id };
      drag = {
        mode: mode,
        plot: plot,
        box: box,
        inset: inset,
        before: core.captureEditorState(project),
        label: mode === "inset-resize" ? "Resize inset" : "Move inset",
        startPt: point,
        orig: core.cloneJson(inset.rect)
      };
      box.setPointerCapture(event.pointerId);
      renderProps();
      updateOverlay(box, plot);
    }

    function moveInset(plot, point) {
      var dx = point.x - drag.startPt.x;
      var dy = point.y - drag.startPt.y;
      var next = {
        x: drag.orig.x + (drag.mode === "inset-move" ? dx : 0),
        y: drag.orig.y + (drag.mode === "inset-move" ? dy : 0),
        width: drag.mode === "inset-resize" ? Math.max(80, drag.orig.width + dx) : drag.orig.width,
        height: drag.mode === "inset-resize" ? Math.max(60, drag.orig.height + dy) : drag.orig.height
      };
      drag.inset.rect = core.clampInsetRect(next, plot.layout.width, plot.layout.height);
      paintPlot(drag.box, plot);
    }

    function startAnnotationGesture(box, plot, ann, point, info, event) {
      if (!ann) return;
      drag = {
        mode: "ann-move",
        plot: plot,
        box: box,
        ann: ann,
        before: core.captureEditorState(project),
        label: "Move annotation",
        startPt: point,
        frame: info.frame,
        area: info.plotArea,
        orig: { anchor: core.cloneJson(ann.anchor), end: core.cloneJson(ann.end) }
      };
      box.setPointerCapture(event.pointerId);
    }

    function moveAnnotation(point) {
      var dx = point.x - drag.startPt.x;
      var dy = point.y - drag.startPt.y;
      var ann = drag.ann;
      if (ann.type === "point") {
        ann.end = {
          x: drag.frame.pixelToDataX(drag.frame.dataToPixelX(drag.orig.end.x) + dx),
          y: drag.frame.pixelToDataY(drag.frame.dataToPixelY(drag.orig.end.y) + dy)
        };
      } else if (ann.coordinateMode === "plot" && drag.area) {
        ann.anchor = {
          x: drag.orig.anchor.x + dx / Math.max(1, drag.area.width),
          y: drag.orig.anchor.y + dy / Math.max(1, drag.area.height)
        };
        ann.end = { x: ann.anchor.x, y: ann.anchor.y };
      } else if (ann.coordinateMode === "canvas") {
        ann.anchor = { x: drag.orig.anchor.x + dx, y: drag.orig.anchor.y + dy };
        ann.end = { x: drag.orig.end.x + dx, y: drag.orig.end.y + dy };
      } else {
        ann.anchor = {
          x: drag.frame.pixelToDataX(drag.frame.dataToPixelX(drag.orig.anchor.x) + dx),
          y: drag.frame.pixelToDataY(drag.frame.dataToPixelY(drag.orig.anchor.y) + dy)
        };
        ann.end = {
          x: drag.frame.pixelToDataX(drag.frame.dataToPixelX(drag.orig.end.x) + dx),
          y: drag.frame.pixelToDataY(drag.frame.dataToPixelY(drag.orig.end.y) + dy)
        };
      }
      paintPlot(drag.box, drag.plot);
    }

    function startToolGesture(box, plot, point, info, event) {
      if (interactionMode === "cursor") {
        var snap = core.snapReadout(project, plot, info.frame, point.x, point.y);
        placeReadout(plot, snap.x, snap.nearestSeriesId);
        showInspector(plot, snap.x, event.clientX, event.clientY, snap.nearestSeriesId);
        updateOverlay(box, plot);
        return;
      }
      if (interactionMode === "annotation-point") {
        var hit = core.findNearestDataPoint(project, plot, info.frame, point.x, point.y);
        if (!hit) {
          setStatus("附近没有可标注的数据点。", "error");
          return;
        }
        var labelX = info.frame.pixelToDataX(Math.min(info.plotArea.x + info.plotArea.width - 8, info.frame.dataToPixelX(hit.x) + 28));
        var labelY = info.frame.pixelToDataY(Math.max(info.plotArea.y + 8, info.frame.dataToPixelY(hit.y) - 28));
        var yUnit = hit.unit ? " " + hit.unit : "";
        addAnnotation(plot, {
          type: "point",
          seriesId: hit.seriesId,
          coordinateMode: "data",
          anchor: { x: hit.x, y: hit.y },
          end: { x: labelX, y: labelY },
          text: hit.name + "\nx = " + formatReading(hit.x) + "\ny = " + formatReading(hit.y) + yUnit,
          style: { color: hit.color || "#1d2024" }
        });
        setInteractionMode("pointer", true);
        renderCanvas();
        renderProps();
        return;
      }
      if (interactionMode === "annotation-free") {
        var area = info.plotArea;
        var nx = (point.x - area.x) / Math.max(1, area.width);
        var ny = (point.y - area.y) / Math.max(1, area.height);
        addAnnotation(plot, {
          type: "free",
          coordinateMode: "plot",
          anchor: { x: nx, y: ny },
          end: { x: nx, y: ny },
          text: "文本"
        });
        setInteractionMode("pointer", true);
        renderCanvas();
        renderProps();
        return;
      }
      if (interactionMode === "annotation-text") {
        var created = addAnnotation(plot, {
          type: "text",
          coordinateMode: "data",
          anchor: { x: info.frame.pixelToDataX(point.x), y: info.frame.pixelToDataY(point.y) },
          text: "文字"
        });
        pendingText = created ? { plotId: plot.id, id: created.id } : null;
        renderCanvas();
        renderProps();
        return;
      }
      if (interactionMode === "annotation-marker") {
        var dataX = info.frame.pixelToDataX(point.x);
        var rows = core.readPlotAtX(project, plot, dataX, "nearest");
        var anchor = { x: dataX, y: info.frame.pixelToDataY(point.y) };
        var best = null;
        rows.forEach(function (row) {
          if (row.y == null || row.x == null) return;
          var distance = Math.abs(info.frame.dataToPixelY(row.y) - point.y);
          if (!best || distance < best.distance) best = { distance: distance, x: row.x, y: row.y };
        });
        if (best) anchor = { x: best.x, y: best.y };
        addAnnotation(plot, { type: "marker", coordinateMode: "data", anchor: anchor, marker: "circle" });
        renderCanvas();
        renderProps();
        return;
      }
      drag = {
        mode: interactionMode === "annotation-arrow" ? "arrow" : (interactionMode === "annotation-region" ? "region" : "range"),
        plot: plot,
        box: box,
        info: info,
        startPt: point,
        currentPt: point
      };
      box.setPointerCapture(event.pointerId);
      updateOverlay(box, plot);
    }

    function finishPlotGesture(box, plot) {
      showGuides([]);
      var tip = paper.querySelector(".tv-size-tip");
      if (tip) tip.remove();
      if (drag.mode === "range-ready") return;
      if (drag.mode === "range") {
        var dx = Math.abs(drag.currentPt.x - drag.startPt.x);
        var dy = Math.abs(drag.currentPt.y - drag.startPt.y);
        if (dx < 4 && dy < 4) drag = null;
        else {
          drag.mode = "range-ready";
          drag.range = selectionFromGesture(drag);
        }
        updateOverlay(box, plot);
        return;
      }
      if (drag.mode === "arrow" || drag.mode === "region") {
        var span = Math.hypot(drag.currentPt.x - drag.startPt.x, drag.currentPt.y - drag.startPt.y);
        if (span >= 4) {
          var frame = drag.info.frame;
          addAnnotation(plot, {
            type: drag.mode === "arrow" ? "arrow" : "region",
            coordinateMode: "data",
            anchor: { x: frame.pixelToDataX(drag.startPt.x), y: frame.pixelToDataY(drag.startPt.y) },
            end: { x: frame.pixelToDataX(drag.currentPt.x), y: frame.pixelToDataY(drag.currentPt.y) }
          });
        }
        drag = null;
        renderCanvas();
        renderProps();
        return;
      }
      if (drag.before) {
        if (drag.mode === "resize") {
          (plot.insets || []).forEach(function (inset) {
            inset.rect = core.clampInsetRect(inset.rect, plot.layout.width, plot.layout.height);
          });
        }
        pushHistory(drag.label || (drag.mode === "resize" ? "Resize plot" : drag.mode === "move" ? "Move plot" : "Edit"), drag.before, core.captureEditorState(project));
      }
      drag = null;
      core.syncCanvasToPlots(project);
      applyCanvasZoom();
      setDirty(true);
      paintPlot(box, plot);
    }

    function attachLegendHit(box, plot, svg) {
      var legendBox = svg.__legendBox;
      var plotArea = svg.__plotArea;
      if (!legendBox || !legendBox.height) return;
      var position = core.resolveLegendPosition(plot.legend);
      if (position !== "free") return;
      var pad = legendBox.pad || 0;
      var hit = document.createElement("div");
      hit.className = "tv-legend-hit is-free";
      hit.style.left = legendBox.x + "px";
      hit.style.top = legendBox.y + "px";
      hit.style.width = Math.max(24, legendBox.width + pad * 2) + "px";
      hit.style.height = Math.max(16, legendBox.height + pad * 2) + "px";
      hit.title = "拖动图例";
      hit.addEventListener("pointerdown", function (event) {
        event.stopPropagation();
        event.preventDefault();
        selectedPlotId = plot.id;
        drag = {
          mode: "legend",
          plot: plot,
          box: box,
          before: core.captureEditorState(project),
          startX: event.clientX,
          startY: event.clientY,
          origX: legendBox.x,
          origY: legendBox.y,
          plotArea: plotArea,
          boxW: legendBox.width + pad * 2,
          boxH: legendBox.height + pad * 2
        };
        hit.setPointerCapture(event.pointerId);
      });
      hit.addEventListener("pointermove", function (event) {
        if (!drag || drag.mode !== "legend" || drag.plot !== plot) return;
        var delta = core.screenToWorld(event.clientX - drag.startX, event.clientY - drag.startY, canvasZoom());
        var area = drag.plotArea || { x: 0, y: 0, width: plot.layout.width, height: plot.layout.height };
        var nextX = core.clamp(drag.origX + delta.x, area.x, area.x + area.width - drag.boxW);
        var nextY = core.clamp(drag.origY + delta.y, area.y, area.y + area.height - drag.boxH);
        var spanX = Math.max(1, area.width - drag.boxW);
        var spanY = Math.max(1, area.height - drag.boxH);
        plot.legend.position = "free";
        plot.legend.x = core.clamp((nextX - area.x) / spanX, 0, 1);

    function figureGroups(plot) {
      var groups = [];

      (plot.seriesRefs || []).forEach(function (ref) {
        var series = core.findSeries(project, ref.seriesId);
        var datasetId = series ? series.datasetId : "";
        if (!byId[datasetId]) {
          byId[datasetId] = {
            datasetId: datasetId,
            dataset: series ? core.findDataset(project, datasetId) : null,
            refs: []
          };
          groups.push(byId[datasetId]);
        }
        byId[datasetId].refs.push(ref);
      });
      return groups;
    }

    function formatMagnification(plot) {
