<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>Visualizer</title>
  <style>
    :root {
      --paper: #fbfbfa;
      --surface: #ffffff;
      --surface-2: #f5f6f5;
      --ink: #1d2024;
      --muted: #5d646b;
      --faint: #8b9299;
      --line: #d7dcde;
      --grid: #e4e7e8;
      --focus: #1e6eaa;
      --shadow: 0 12px 30px rgba(27, 34, 38, .08);
      --danger: #aa3f34;
      --ok: #35694b;
      --radius: 5px;
      --side: 268px;
      --props: 300px;
    }
    [data-theme="dark"] {
      --paper: #15191b;
      --surface: #1b2023;
      --surface-2: #242a2e;
      --ink: #f1f3f1;
      --muted: #bcc3c4;
      --faint: #889395;
      --line: #354045;
      --grid: #2b3438;
      --focus: #75b8e7;
      --shadow: 0 12px 32px rgba(0, 0, 0, .22);
      --danger: #e08b82;
      --ok: #8fbf9e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Aptos", "Helvetica Neue", "Noto Sans SC", "PingFang SC", sans-serif;
      font-size: 13px;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { color: inherit; }
    .tv-app {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      height: 100%;
    }
    .tv-header, .tv-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .tv-header { justify-content: space-between; min-height: 56px; }
    .tv-brand { min-width: 0; }
    .tv-kicker {
      margin: 0 0 2px;
      color: var(--focus);
      font: 600 10px/1.2 "SFMono-Regular", "Cascadia Mono", "Noto Sans Mono", monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .tv-header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -.03em;
      font-weight: 720;
      text-wrap: pretty;
    }
    .tv-header-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .tv-dirty, .tv-status {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .tv-dirty {
      display: none;
      padding: 6px 8px;
      color: #8a5a16;
      border-color: #e0c089;
    }
    .tv-dirty.is-on { display: block; }
    .tv-status {
      min-width: min(42vw, 420px);
      max-width: 520px;
      min-height: 34px;
      padding: 7px 10px;
    }
    .tv-status[data-tone="error"] { border-color: #c66d61; color: var(--danger); }
    .tv-status[data-tone="ok"] { border-color: #7ba88d; color: var(--ok); }
    .tv-toolbar { flex-wrap: wrap; gap: 8px; }
    .tv-file-button, .tv-button, .tv-select, .tv-field {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
    }
    .tv-file-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      cursor: pointer;
      border-style: dashed;
    }
    .tv-file-button:hover, .tv-file-button:focus-within,
    .tv-button:hover { border-color: var(--focus); background: var(--surface-2); }
    .tv-file-button input { display: none; }
    .tv-file-stamp {
      display: grid;
      place-items: center;
      width: 28px;
      height: 22px;
      border: 1px solid currentColor;
      border-radius: 3px;
      color: var(--focus);
      font: 700 9px/1 "SFMono-Regular", "Cascadia Mono", monospace;
    }
    .tv-button {
      padding: 0 11px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }
    .tv-button:active { transform: translateY(1px); }
    .tv-button:focus-visible, .tv-select:focus-visible, .tv-field:focus-visible, .tv-file-button:focus-within {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .tv-button--primary { border-color: var(--focus); background: var(--focus); color: #fff; }
    .tv-button--primary:hover { background: #155d91; color: #fff; }
    .tv-button--danger { color: var(--danger); }
    .tv-toolbar .tv-select { min-width: 92px; padding: 0 8px; }
    .tv-control { display: grid; gap: 3px; }
    .tv-control span, .tv-side h2, .tv-prop-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .02em;
    }
    .tv-workspace {
      display: grid;
      grid-template-columns: var(--side) 5px minmax(0, 1fr) 5px var(--props);
      min-height: 0;
    }
    .tv-workspace.is-left-collapsed { grid-template-columns: 28px 0 minmax(0, 1fr) 5px var(--props); }
    .tv-workspace.is-right-collapsed { grid-template-columns: var(--side) 5px minmax(0, 1fr) 0 28px; }
    .tv-workspace.is-left-collapsed.is-right-collapsed { grid-template-columns: 28px 0 minmax(0, 1fr) 0 28px; }
    .tv-side {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: var(--surface);
      border-right: 1px solid var(--line);
      position: relative;
    }
    .tv-side--props { border-right: 0; border-left: 1px solid var(--line); }
    .tv-side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .tv-side-head h2 { border-bottom: 0; flex: 1; }
    .tv-splitter {
      background: var(--line);
      cursor: col-resize;
      position: relative;
      z-index: 6;
    }
    .tv-splitter:hover, .tv-splitter.is-active { background: var(--focus); }
    .tv-canvas-col {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }
    .tv-zoombar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    .tv-zoombar-label {
      min-width: 44px;
      text-align: center;
      font: 650 11px/1 "SFMono-Regular", "Cascadia Mono", monospace;
      color: var(--muted);
    }
    .tv-layout-menu {
      position: absolute;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(4, 64px);
      gap: 8px;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .tv-layout-choice {
      display: grid;
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--line);
      background: var(--surface);
      cursor: pointer;
      color: var(--muted);
      font-size: 10px;
    }
    .tv-layout-choice:hover { border-color: var(--focus); color: var(--ink); }
    .tv-layout-icon {
      height: 36px;
      border: 1px solid currentColor;
      display: grid;
    }
    .tv-guides, .tv-dock-preview {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }
    .tv-guide {
      position: absolute;
      background: var(--focus);
      opacity: .7;
    }
    .tv-guide.is-x { width: 1px; top: 0; bottom: 0; }
    .tv-guide.is-y { height: 1px; left: 0; right: 0; }
    .tv-size-tip {
      position: absolute;
      z-index: 9;
      padding: 2px 6px;
      background: var(--ink);
      color: var(--surface);
      font: 650 11px/1.3 "SFMono-Regular", "Cascadia Mono", monospace;
      pointer-events: none;
    }
    .tv-legend-hit {
      position: absolute;
      cursor: move;
      z-index: 5;
      pointer-events: auto;
    }
    .tv-accordion {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 8px;
      background: var(--surface);
    }
    .tv-accordion > summary {
      cursor: pointer;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
      list-style: none;
    }
    .tv-accordion > summary::-webkit-details-marker { display: none; }
    .tv-accordion[open] > summary { border-bottom: 1px solid var(--line); }
    .tv-accordion-body { padding: 10px; display: grid; gap: 8px; }
    .tv-original-name {
      color: var(--faint);
      font-size: 10px;
      line-height: 1.4;
      word-break: break-all;
    }
    .tv-preview-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .tv-preview-table th, .tv-preview-table td {
      border-bottom: 1px solid var(--line);
      padding: 4px 6px;
      text-align: left;
      vertical-align: top;
    }
    .tv-rename-stage { max-height: 48vh; overflow: auto; padding: 12px; }
    .tv-side h2 {
      margin: 0;
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--line);
      font: 700 11px/1 "SFMono-Regular", "Cascadia Mono", monospace;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .tv-side-body { padding: 10px 12px 16px; }
    .tv-dataset {
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }
    .tv-dataset-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      gap: 6px;
      align-items: center;
      padding: 7px 8px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .tv-dataset-toggle {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
    }
    .tv-dataset-count {
      color: var(--faint);
      font-size: 10px;
      white-space: nowrap;
    }
    .tv-dataset-head input {
      width: 100%;
      min-height: 28px;
      padding: 0 6px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      font-weight: 650;
      cursor: text;
    }
    .tv-dataset-head input:hover, .tv-dataset-head input:focus { border-color: var(--line); background: var(--surface); }
    .tv-dataset-tools {
      display: flex;
      gap: 6px;
      padding: 6px 8px 2px;
    }
    .tv-button--tiny {
      min-height: 26px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 650;
    }
    .tv-series-list { padding-bottom: 4px; }
    .tv-series-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      padding: 5px 8px;
      font-size: 12px;
      user-select: none;
    }
    .tv-title-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
    }
    .tv-series-row small { color: var(--faint); font-size: 10px; }
    .tv-add-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      margin-top: 10px;
    }
    .tv-select, .tv-field, textarea.tv-field {
      width: 100%;
      padding: 0 8px;
      background: var(--surface);
    }
    textarea.tv-field { min-height: 64px; padding: 7px 8px; resize: vertical; }
    .tv-canvas-scroll {
      min-width: 0;
      overflow: auto;
      background:
        linear-gradient(var(--paper), var(--paper)),
        repeating-linear-gradient(0deg, transparent, transparent 15px, var(--grid) 16px),
        repeating-linear-gradient(90deg, transparent, transparent 15px, var(--grid) 16px);
      background-color: #e7eaeb;
      padding: 20px;
    }
    [data-theme="dark"] .tv-canvas-scroll { background-color: #101416; }
    .tv-canvas-zoom { position: relative; }
    .tv-canvas-paper {
      position: relative;
      margin: 0 auto;
      background: var(--surface);
      box-shadow: var(--shadow);
      outline: 1px solid var(--line);
    }
    .tv-workspace.is-left-collapsed #tvLeftPanel .tv-side-body,
    .tv-workspace.is-right-collapsed #tvRightPanel .tv-side-body,
    .tv-workspace.is-left-collapsed #tvLeftPanel h2,
    .tv-workspace.is-right-collapsed #tvRightPanel h2 { display: none; }
    .tv-canvas-empty {
      display: grid;
      place-items: center;
      height: 100%;
      color: var(--muted);
      text-align: center;
      padding: 32px;
      line-height: 1.6;
      text-wrap: pretty;
    }
    .tv-plot {
      position: absolute;
      background: var(--surface);
    }
    .tv-plot.is-selected { outline: 2px solid var(--focus); z-index: 4; }
    .tv-plot svg { display: block; width: 100%; height: 100%; }
    .tv-plot-resize {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 14px;
      height: 14px;
      padding: 0;
      border: 0;
      background:
        linear-gradient(135deg, transparent 0 55%, var(--focus) 56% 64%, transparent 65% 75%, var(--focus) 76% 84%, transparent 85%);
      cursor: nwse-resize;
    }
    .tv-prop-block { display: grid; gap: 8px; margin-bottom: 14px; }
    .tv-prop-label { display: block; margin-bottom: 4px; }
    .tv-inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .tv-inline[hidden] { display: none; }
    .tv-ref-row {
      display: grid;
      grid-template-columns: auto auto auto minmax(0, 1fr) auto;
      gap: 6px;
      align-items: start;
      margin-bottom: 8px;
    }
    .tv-ref-row input[type="checkbox"] { margin: 0; }
    .tv-series-names {
      min-width: 0;
      overflow: hidden;
    }
    .tv-series-display {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      width: 100%;
    }
    .tv-series-original {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--faint);
      font-size: 10px;
      line-height: 1.35;
      word-break: break-all;
    }
    .tv-swatch {
      width: 18px;
      height: 3px;
      border-radius: 1px;
      justify-self: center;
      margin-top: 8px;
    }
    .tv-eye-btn {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }
    .tv-eye-btn.is-off { color: var(--faint); }
    .tv-eye-btn:hover { border-color: var(--line); background: var(--surface); }
    .tv-ref-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      justify-self: stretch;
      width: auto;
    }
    .tv-line-width,
    .tv-legend-style-panel {
      display: grid;
      gap: 6px;
    }
    .tv-line-width-row,
    .tv-opacity-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px auto;
      gap: 8px;
      align-items: center;
    }
    .tv-line-width input[type="range"],
    .tv-opacity-row input[type="range"] {
      width: 100%;
      min-width: 0;
    }
    .tv-count-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .tv-scope-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    .tv-legend-hit.is-free {
      cursor: grab;
      background: rgba(30, 110, 170, .06);
      outline: 1px dashed transparent;
    }
    .tv-legend-hit.is-free:hover { outline-color: var(--focus); }
    .tv-layout-menu {
      min-width: 300px;
      grid-template-columns: repeat(4, 72px);
    }
    .tv-layout-primary {
      grid-column: 1 / -1;
      display: grid;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--line);
    }
    .tv-ref-row input[type="color"] {
      width: 28px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .tv-hint { margin: 8px 0 0; color: var(--faint); font-size: 11px; line-height: 1.45; text-wrap: pretty; }
    .tv-preview {
      border: 0;
      padding: 0;
      width: min(96vw, 1280px);
      max-height: 92vh;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .tv-preview::backdrop { background: rgba(18, 22, 24, .45); }
    .tv-preview-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .tv-preview-stage {
      overflow: auto;
      max-height: calc(92vh - 52px);
      padding: 16px;
      background: #e7eaeb;
    }
    .tv-preview-stage svg {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .tv-icon-button {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .tv-icon-button:hover { border-color: var(--line); color: var(--ink); background: var(--surface); }
    @media (max-width: 1100px) {
      .tv-status { min-width: 0; width: min(48vw, 280px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <div class="tv-app" id="tvApp" data-theme="light">
    <header class="tv-header">
      <div class="tv-brand">
        <p class="tv-kicker">Visualizer v0.2.3</p>
        <h1>实验数据可视化工作台</h1>
      </div>
      <div class="tv-header-meta">
        <div class="tv-dirty" id="tvDirty">未保存</div>
        <div class="tv-status" id="tvStatus" role="status">导入 CSV 开始，或打开已有工程。</div>
      </div>
    </header>
    <section class="tv-toolbar" aria-label="工程操作">
      <label class="tv-file-button">
        <span class="tv-file-stamp">CSV</span>
        <span>导入 CSV</span>
        <input id="tvCsvInput" type="file" accept=".csv,text/csv" multiple>
      </label>
      <button type="button" class="tv-button" id="tvNewProject">新建工程</button>
      <button type="button" class="tv-button" id="tvOpenProject">打开工程</button>
      <button type="button" class="tv-button" id="tvSaveProject">保存</button>
      <button type="button" class="tv-button" id="tvSaveProjectAs">另存为</button>
      <button type="button" class="tv-button tv-button--primary" id="tvNewPlot">新建图</button>
      <button type="button" class="tv-button" id="tvLayout">布局</button>
      <button type="button" class="tv-button" id="tvPreview">预览</button>
      <button type="button" class="tv-button" id="tvExportPng">导出 PNG</button>
      <button type="button" class="tv-button" id="tvExportSvg">导出 SVG</button>
      <input id="tvProjectInput" type="file" accept=".tvproj.json,.tvproj,.json,application/json" hidden>
    </section>
    <div class="tv-workspace" id="tvWorkspace">
      <aside class="tv-side" id="tvLeftPanel" aria-label="数据">
        <div class="tv-side-head">
          <h2>数据</h2>
          <button type="button" class="tv-icon-button" id="tvCollapseLeft" aria-label="折叠数据栏">◀</button>
        </div>
        <div class="tv-side-body" id="tvDataPanel"></div>
      </aside>
      <div class="tv-splitter" id="tvSplitLeft" role="separator" aria-orientation="vertical" aria-label="调整数据栏宽度"></div>
      <section class="tv-canvas-col">
        <div class="tv-canvas-scroll" id="tvCanvasScroll" aria-label="画布" tabindex="0">
          <div class="tv-canvas-zoom" id="tvCanvasZoom">
            <div class="tv-canvas-paper" id="tvCanvasPaper"></div>
            <div class="tv-guides" id="tvGuides"></div>
          </div>
        </div>
        <div class="tv-zoombar" aria-label="画布缩放">
          <button type="button" class="tv-button tv-button--tiny" id="tvZoomOut">−</button>
          <div class="tv-zoombar-label" id="tvZoomLabel">100%</div>
          <button type="button" class="tv-button tv-button--tiny" id="tvZoomIn">+</button>
          <button type="button" class="tv-button tv-button--tiny" id="tvZoomFit">适应窗口</button>
          <button type="button" class="tv-button tv-button--tiny" id="tvZoom100">100%</button>
        </div>
      </section>
      <div class="tv-splitter" id="tvSplitRight" role="separator" aria-orientation="vertical" aria-label="调整属性栏宽度"></div>
      <aside class="tv-side tv-side--props" id="tvRightPanel" aria-label="属性">
        <div class="tv-side-head">
          <h2>属性</h2>
          <button type="button" class="tv-icon-button" id="tvCollapseRight" aria-label="折叠属性栏">▶</button>
        </div>
        <div class="tv-side-body" id="tvPropsPanel"></div>
      </aside>
    </div>
  </div>
  <dialog class="tv-preview" id="tvPreviewDialog" aria-label="画布预览">
    <div class="tv-preview-bar">
      <strong>画布预览</strong>
      <button type="button" class="tv-button" id="tvPreviewClose">关闭</button>
    </div>
    <div class="tv-preview-stage" id="tvPreviewStage"></div>
  </dialog>
  <dialog class="tv-preview" id="tvRenameDialog" aria-label="批量重命名">
    <div class="tv-preview-bar">
      <strong>批量重命名</strong>
      <button type="button" class="tv-button" id="tvRenameClose">取消</button>
    </div>
    <div class="tv-rename-stage" id="tvRenameStage"></div>
  </dialog>
  <script src="visualizer-core.js"></script>
  <script>
  (function () {
    "use strict";

    var core = window.VisualizerCore;
    var svgNamespace = "http://www.w3.org/2000/svg";
    var app = document.getElementById("tvApp");
    var paper = document.getElementById("tvCanvasPaper");
    var canvasScroll = document.getElementById("tvCanvasScroll");
    var canvasZoomEl = document.getElementById("tvCanvasZoom");
    var guidesEl = document.getElementById("tvGuides");
    var workspaceEl = document.getElementById("tvWorkspace");
    var leftPanel = document.getElementById("tvLeftPanel");
    var rightPanel = document.getElementById("tvRightPanel");
    var dataPanel = document.getElementById("tvDataPanel");
    var propsPanel = document.getElementById("tvPropsPanel");
    var statusEl = document.getElementById("tvStatus");
    var dirtyEl = document.getElementById("tvDirty");
    var previewDialog = document.getElementById("tvPreviewDialog");
    var previewStage = document.getElementById("tvPreviewStage");
    var renameDialog = document.getElementById("tvRenameDialog");
    var renameStage = document.getElementById("tvRenameStage");
    var lastCanvasSvg = "";
    var project = core.createProject();
    core.ensureDefaultPlot(project);
    var selectedPlotId = project.plots[0].id;
    var selectedRefIndex = 0;
    var lastSelectedSeriesId = {};
    var checkedSeries = new Set();
    var collapsedDatasets = new Set();
    var selectionAnchor = {};
    var activeDatasetId = null;
    var dataPanelActive = false;
    var propsPanelActive = false;
    var canvasActive = false;
    var projectFileHandle = null;
    var dirty = false;
    var drag = null;
    var splitterDrag = null;
    var layoutMenu = null;
    var tickWarning = "";

    function isTextEntry(el) {
      if (!el) return false;
      if (el.isContentEditable) return true;
      var tag = el.tagName;
      if (tag === "TEXTAREA" || tag === "SELECT") return true;
      if (tag !== "INPUT") return false;
      var type = String(el.type || "text").toLowerCase();
      return type !== "checkbox" && type !== "radio" && type !== "button" && type !== "color" && type !== "file";
    }

    function projectFilename(name) {
      var base = sanitizeFilename(name || "未命名工程");
      if (/\.tvproj\.json$/i.test(base)) return base;
      if (/\.tvproj$/i.test(base)) return base + ".json";
      if (/\.json$/i.test(base)) return base.replace(/\.json$/i, ".tvproj.json");
      return base + ".tvproj.json";
    }

    function canUseSavePicker() {
      return typeof window.showSaveFilePicker === "function";
    }

    function pickSaveFile(suggestedName, types) {
      if (canUseSavePicker()) {
        return window.showSaveFilePicker({
          suggestedName: suggestedName,
          types: types
        }).catch(function (error) {
          if (error && error.name === "AbortError") return null;
          throw error;
        });
      }
      setStatus("当前浏览器不支持自定义文件保存位置，文件将使用浏览器默认下载方式。", "");
      return Promise.resolve("download");
    }

    function writeBlobToHandle(handle, blob) {
      return handle.createWritable().then(function (writable) {
        return writable.write(blob).then(function () { return writable.close(); }).then(function () { return handle; });
      });
    }

    function saveBlobWithPicker(blob, suggestedName, types) {
      return pickSaveFile(suggestedName, types).then(function (handle) {
        if (!handle) return null;
        if (handle === "download") {
          downloadBlob(blob, suggestedName);
          return "download";
        }
        return writeBlobToHandle(handle, blob);
      });
    }

    function exportSuggestedName(ext) {
      var plot = selectedPlot() || (project.plots && project.plots[0]);
      var base = plot && plot.title ? plot.title : "Figure_1";
      return sanitizeFilename(base).replace(/\s+/g, "_") + "." + ext;
    }

    function canUseOpenPicker() {
      return typeof window.showOpenFilePicker === "function";
    }

    function cssValue(property) {
      return getComputedStyle(app).getPropertyValue(property).trim();
    }

    function theme() {
      return {
        surface: cssValue("--surface"),
        ink: cssValue("--ink"),
        muted: cssValue("--muted"),
        faint: cssValue("--faint"),
        line: cssValue("--line"),
        grid: cssValue("--grid")
      };
    }

    function setStatus(text, tone) {
      statusEl.textContent = text;
      statusEl.setAttribute("data-tone", tone || "");
    }

    function setDirty(value) {
      dirty = value;
      dirtyEl.classList.toggle("is-on", dirty);
      document.title = (dirty ? "• " : "") + project.projectName + " · Visualizer";
    }

    function uiState() {
      if (!project.ui) project.ui = core.normalizeUi(null);
      return project.ui;
    }

    function canvasZoom() {
      return core.clampZoom(uiState().canvasZoom);
    }

    function applyPanelLayout() {
      var ui = uiState();
      workspaceEl.classList.toggle("is-left-collapsed", !!ui.leftPanelCollapsed);
      workspaceEl.classList.toggle("is-right-collapsed", !!ui.rightPanelCollapsed);
      app.style.setProperty("--side", (ui.leftPanelCollapsed ? 0 : ui.leftPanelWidth) + "px");
      app.style.setProperty("--props", (ui.rightPanelCollapsed ? 0 : ui.rightPanelWidth) + "px");
      leftPanel.hidden = false;
      rightPanel.hidden = false;
      document.getElementById("tvCollapseLeft").textContent = ui.leftPanelCollapsed ? "▶" : "◀";
      document.getElementById("tvCollapseRight").textContent = ui.rightPanelCollapsed ? "◀" : "▶";
      dataPanel.parentElement.style.overflow = ui.leftPanelCollapsed ? "hidden" : "auto";
      propsPanel.parentElement.style.overflow = ui.rightPanelCollapsed ? "hidden" : "auto";
    }

    function applyCanvasZoom(keepPoint) {
      var zoom = canvasZoom();
      core.syncCanvasToPlots(project);
      var width = project.canvas.width;
      var height = project.canvas.height;
      canvasZoomEl.style.width = (width * zoom) + "px";
      canvasZoomEl.style.height = (height * zoom) + "px";
      paper.style.width = width + "px";
      paper.style.height = height + "px";
      paper.style.transform = "scale(" + zoom + ")";
      paper.style.transformOrigin = "0 0";
      guidesEl.style.width = width + "px";
      guidesEl.style.height = height + "px";
      guidesEl.style.transform = "scale(" + zoom + ")";
      guidesEl.style.transformOrigin = "0 0";
      document.getElementById("tvZoomLabel").textContent = Math.round(zoom * 100) + "%";
      if (keepPoint) {
        canvasScroll.scrollLeft = keepPoint.worldX * zoom - keepPoint.offsetX;
        canvasScroll.scrollTop = keepPoint.worldY * zoom - keepPoint.offsetY;
      }
    }

    function setCanvasZoom(nextZoom, originEvent) {
      var oldZoom = canvasZoom();
      var zoom = core.clampZoom(nextZoom);
      var rect = canvasScroll.getBoundingClientRect();
      var offsetX = originEvent ? (originEvent.clientX - rect.left) : canvasScroll.clientWidth / 2;
      var offsetY = originEvent ? (originEvent.clientY - rect.top) : canvasScroll.clientHeight / 2;
      var worldX = (canvasScroll.scrollLeft + offsetX) / oldZoom;
      var worldY = (canvasScroll.scrollTop + offsetY) / oldZoom;
      uiState().canvasZoom = zoom;
      if (project.canvas) project.canvas.zoom = zoom;
      applyCanvasZoom({ worldX: worldX, worldY: worldY, offsetX: offsetX, offsetY: offsetY });
    }

    function fitCanvasView() {
      var zoom = core.fitViewZoom(project.plots, canvasScroll.clientWidth, canvasScroll.clientHeight, 40);
      uiState().canvasZoom = zoom;
      project.canvas.zoom = zoom;
      applyCanvasZoom();
      var box = core.plotsBoundingBox(project.plots);
      canvasScroll.scrollLeft = Math.max(0, box.minX * zoom - 40);
      canvasScroll.scrollTop = Math.max(0, box.minY * zoom - 40);
    }

    function showGuides(lines) {
      guidesEl.replaceChildren();
      (lines || []).forEach(function (line) {
        var el = document.createElement("div");
        el.className = "tv-guide is-" + line.axis;
        if (line.axis === "x") el.style.left = line.value + "px";
        else el.style.top = line.value + "px";
        guidesEl.appendChild(el);
      });
    }

    function showSizeTip(plot) {
      var existing = paper.querySelector(".tv-size-tip");
      if (existing) existing.remove();
      if (!plot) return;
      var tip = document.createElement("div");
      tip.className = "tv-size-tip";
      tip.textContent = plot.layout.width + " × " + plot.layout.height;
      tip.style.left = (plot.layout.x + plot.layout.width - 88) + "px";
      tip.style.top = (plot.layout.y + plot.layout.height + 6) + "px";
      paper.appendChild(tip);
    }

    function syncSizeFields(plot) {
      var widthInput = document.getElementById("tvFigWidth");
      var heightInput = document.getElementById("tvFigHeight");
      var xInput = document.getElementById("tvFigX");
      var yInput = document.getElementById("tvFigY");
      if (widthInput) widthInput.value = plot.layout.width;
      if (heightInput) heightInput.value = plot.layout.height;
      if (xInput) xInput.value = plot.layout.x;
      if (yInput) yInput.value = plot.layout.y;
    }

    function selectedCount(dataset) {
      var count = 0;
      dataset.series.forEach(function (series) {
        if (checkedSeries.has(series.id)) count += 1;
      });
      return count;
    }

    function applyDatasetSelection(dataset, action) {
      var ids = dataset.series.map(function (series) { return series.id; });
      var next = core.applyMultiSelect({
        ids: ids,
        selectedIds: Array.from(checkedSeries),
        anchorId: selectionAnchor[dataset.id]
      }, action);
      checkedSeries = new Set(next.selectedIds);
      selectionAnchor[dataset.id] = next.anchorId;
    }

    function applyFigureSelection(plot, action) {
      var ids = (plot.seriesRefs || []).map(function (ref) { return ref.seriesId; });
      var selected = (plot.seriesRefs || []).filter(function (ref) { return ref.selected; }).map(function (ref) { return ref.seriesId; });
      var next = core.applyMultiSelect({
        ids: ids,
        selectedIds: selected,
        anchorId: lastSelectedSeriesId[plot.id]
      }, action);
      var set = {};
      next.selectedIds.forEach(function (id) { set[id] = true; });
      (plot.seriesRefs || []).forEach(function (ref) { ref.selected = !!set[ref.seriesId]; });
      lastSelectedSeriesId[plot.id] = next.anchorId;
      if (next.anchorId) {
        var idx = ids.indexOf(next.anchorId);
        if (idx >= 0) selectedRefIndex = idx;
      }
    }

    function selectedPlot() {
      return project.plots.find(function (plot) { return plot.id === selectedPlotId; }) || null;
    }

    function confirmDiscard() {
      return !dirty || window.confirm("有未保存的修改，确定放弃当前工程？");
    }

    function createSvg(name, attributes) {
      var element = document.createElementNS(svgNamespace, name);
      Object.keys(attributes || {}).forEach(function (key) { element.setAttribute(key, String(attributes[key])); });
      return element;
    }

    function appendSvg(parent, name, attributes, content) {
      var element = createSvg(name, attributes);
      if (content !== undefined) element.textContent = content;
      parent.appendChild(element);
      return element;
    }

    function measureText(text, font) {
      if (!measureText.ctx) measureText.ctx = document.createElement("canvas").getContext("2d");
      measureText.ctx.font = font;
      return measureText.ctx.measureText(text).width;
    }

    function measureStyledText(text, style) {
      if (!text) return { width: 0, height: 0, ascent: 0, descent: 0 };
      style = style || {};
      var fontSize = Number(style.fontSize) || 12;
      var font = (style.italic ? "italic " : "") + (style.fontWeight || "400") + " " + fontSize + "px " + (style.fontFamily || core.DEFAULT_FONT);
      if (!measureStyledText.cache) measureStyledText.cache = {};
      var key = font + "\0" + text;
      if (measureStyledText.cache[key]) return measureStyledText.cache[key];
      if (!measureText.ctx) measureText.ctx = document.createElement("canvas").getContext("2d");
      measureText.ctx.font = font;
      var m = measureText.ctx.measureText(text);
      var ascent = Number.isFinite(m.actualBoundingBoxAscent) ? m.actualBoundingBoxAscent : fontSize * 0.8;
      var descent = Number.isFinite(m.actualBoundingBoxDescent) ? m.actualBoundingBoxDescent : fontSize * 0.2;
      var size = {
        width: m.width,
        height: Math.max(fontSize, ascent + descent),
        ascent: ascent,
        descent: descent
      };
      measureStyledText.cache[key] = size;
      return size;
    }

    function measureLegend(text, style) {
      return measureStyledText(text, style).width;
    }

    function plotLegendItems(plot, resolved) {
      return plot.legend && plot.legend.visible === false ? [] : resolved.map(function (item) {
        return {
          seriesId: item.series.id,
          label: core.seriesDisplayName(item.series),
          color: item.color,
          visible: item.visible,
          style: item.style
        };
      });
    }

    function textStyleAttrs(style, fallbackFill) {
      style = style || {};
      var attrs = {
        fill: style.fontColor || fallbackFill,
        "font-size": style.fontSize || 12,
        "font-family": style.fontFamily || core.DEFAULT_FONT,
        "font-weight": style.fontWeight || "400"
      };
      if (style.italic) attrs["font-style"] = "italic";
      return attrs;
    }

    function applyText(parent, x, y, style, fallbackFill, extra, content) {
      var attrs = textStyleAttrs(style, fallbackFill);
      attrs.x = x;
      attrs.y = y;
      Object.keys(extra || {}).forEach(function (key) { attrs[key] = extra[key]; });
      return appendSvg(parent, "text", attrs, content);
    }

    function strokeStyleAttrs(style, color) {
      var attrs = {
        fill: "none",
        stroke: (style && style.color) || color,
        "stroke-width": (style && style.lineWidth) || 1.5,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
        "stroke-opacity": style && style.opacity != null ? style.opacity : 1
      };
      var dash = core.strokeDasharray(style && style.lineType);
      if (dash) attrs["stroke-dasharray"] = dash;
      return attrs;
    }

    function buildPlotSvg(plot, width, height, interactive) {
      var colors = theme();
      core.syncPlotAxisAutoTitles(project, plot);
      if (!plot.legend) plot.legend = core.normalizeLegend(plot.legend, plot.legendVisible);
      if (!plot.textStyles) plot.textStyles = core.normalizePlotTextStyles(plot.textStyles);
      plot.legendVisible = plot.legend.visible;
      var resolved = core.resolvePlotSeries(project, plot);
      var visible = resolved.filter(function (item) { return item.visible; });
      var extents = core.plotExtents(project, plot);
      var xTickSet = core.axisTickSet(plot.xAxis, extents.x[0], extents.x[1], 5);
      var yTickSet = core.axisTickSet(plot.yAxis, extents.y[0], extents.y[1], 5);
      tickWarning = xTickSet.error || yTickSet.error || "";
      var xTicks = xTickSet.major;
      var yTicks = yTickSet.major;
      var legendText = plot.textStyles.legend;
      var fontSize = plot.legend.fontSize || legendText.fontSize || 12;
      var legendStyle = {
        fontFamily: plot.legend.fontFamily || legendText.fontFamily,
        fontSize: fontSize,
        fontWeight: plot.legend.fontWeight || legendText.fontWeight,
        italic: plot.legend.italic || legendText.italic
      };
      var xTitle = core.resolvedAxisTitle(plot.xAxis);
      var yTitle = core.resolvedAxisTitle(plot.yAxis);
      var yTickSize = yTicks.reduce(function (max, tick) {
        var size = measureStyledText(core.formatTickValue(tick, plot.yAxis), plot.textStyles.yTick);
        return {
          width: Math.max(max.width, size.width),
          height: Math.max(max.height, size.height),
          ascent: Math.max(max.ascent, size.ascent),
          descent: Math.max(max.descent, size.descent)
        };
      }, { width: 12, height: plot.textStyles.yTick.fontSize || 10, ascent: 0, descent: 0 });
      var xTickSize = xTicks.reduce(function (max, tick) {
        var size = measureStyledText(core.formatTickValue(tick, plot.xAxis), plot.textStyles.xTick);
        return {
          width: Math.max(max.width, size.width),
          height: Math.max(max.height, size.height),
          ascent: Math.max(max.ascent, size.ascent),
          descent: Math.max(max.descent, size.descent)
        };
      }, { width: 12, height: plot.textStyles.xTick.fontSize || 10, ascent: 0, descent: 0 });
      var metrics = {
        title: measureStyledText(plot.title || "未命名图", plot.textStyles.title),
        subtitle: measureStyledText(plot.subtitle, { fontFamily: plot.textStyles.title.fontFamily, fontSize: 11, fontWeight: "400" }),
        note: measureStyledText(plot.note, { fontFamily: plot.textStyles.title.fontFamily, fontSize: 10, fontWeight: "400" }),
        xAxisTitle: measureStyledText(xTitle, plot.textStyles.xAxisTitle),
        yAxisTitle: measureStyledText(yTitle, plot.textStyles.yAxisTitle),
        xTick: xTickSize,
        yTick: yTickSize,
        legend: { width: 0, height: 0 },
        legendPosition: plot.legend.position
      };
      var position = core.resolveLegendPosition(plot.legend);
      var slot = core.legendLayoutSlot(position);
      var overlay = slot === "overlay";
      var draft = core.computePlotLayout(width, height, metrics);
      var legendItems = plot.legend.visible ? plotLegendItems(plot, resolved) : [];
      var maxLegendWidth = plot.legend.maxWidth || (slot === "left" || slot === "right"
        ? Math.max(80, Math.min(width * 0.32, 280))
        : Math.max(80, draft.plotArea.width));
      var maxLegendHeight = slot === "top" || slot === "bottom"
        ? Math.max(16, Math.min(height * 0.4, draft.plotArea.height))
        : Math.max(16, draft.plotArea.height);
      var legend = core.layoutLegendItems(legendItems, {
        maxWidth: maxLegendWidth,
        maxHeight: maxLegendHeight,
        fontSize: fontSize,
        sampleLength: plot.legend.sampleLength,
        rowGap: plot.legend.rowGap,
        columnGap: plot.legend.columnGap,
        orientation: plot.legend.orientation,
        columns: plot.legend.columns,
        rows: plot.legend.rows,
        wrap: plot.legend.wrap,
        measure: function (text) { return measureLegend(text, legendStyle); }
      });
      var pad = plot.legend.padding || 6;
      metrics.legend = {
        width: legend.width + (legend.height ? pad * 2 : 0),
        height: legend.height + (legend.height ? pad * 2 : 0)
      };
      metrics.legendPosition = position;
      var layout = core.computePlotLayout(width, height, metrics);
      if (layout.grown && !drag) {
        plot.layout.width = layout.width;
        plot.layout.height = layout.height;
        core.syncCanvasToPlots(project);
      }
      width = layout.width;
      height = layout.height;
      var margin = layout.margin;
      var plotWidth = layout.plotArea.width;
      var plotHeight = layout.plotArea.height;
      var legendBox = {
        x: layout.legendBox.x,
        y: layout.legendBox.y,
        width: legend.width,
        height: legend.height,
        position: position,
        pad: pad
      };
      if (overlay && legend.height) {
        var fx = plot.legend.x;
        var fy = plot.legend.y;
        if (position !== "free") {
          var anchor = core.legendAnchor(position);
          fx = anchor[0];
          fy = anchor[1];
        }
        if (!Number.isFinite(Number(fx))) fx = 0.72;
        if (!Number.isFinite(Number(fy))) fy = 0.08;
        var boxW = legend.width + pad * 2;
        var boxH = legend.height + pad * 2;
        legendBox.x = margin.left + fx * Math.max(1, plotWidth - boxW);
        legendBox.y = margin.top + fy * Math.max(1, plotHeight - boxH);
        legendBox.x = core.clamp(legendBox.x, margin.left, Math.max(margin.left, margin.left + plotWidth - boxW));
        legendBox.y = core.clamp(legendBox.y, margin.top, Math.max(margin.top, margin.top + plotHeight - boxH));
      }
      var xScale = function (value) {
        return margin.left + (value - extents.x[0]) / (extents.x[1] - extents.x[0] || 1) * plotWidth;
      };
      var yScale = function (value) {
        return margin.top + (extents.y[1] - value) / (extents.y[1] - extents.y[0] || 1) * plotHeight;
      };
      var svg = createSvg("svg", {
        viewBox: "0 0 " + width + " " + height,
        width: width,
        height: height,
        role: "img",
        "aria-label": plot.title,
        xmlns: svgNamespace
      });
      svg.__legendBox = legendBox;
      svg.__legendOverflow = legend.overflow || 0;
      svg.__plotArea = layout.plotArea;
      appendSvg(svg, "rect", { x: 0, y: 0, width: width, height: height, fill: plot.background || colors.surface });
      applyText(svg, layout.titlePos.x, layout.titlePos.y, plot.textStyles.title, colors.ink, {}, plot.title || "未命名图");
      if (plot.subtitle) {
        applyText(svg, layout.subtitlePos.x, layout.subtitlePos.y, { fontFamily: plot.textStyles.title.fontFamily, fontSize: 11, fontColor: colors.muted, fontWeight: "400" }, colors.muted, {}, plot.subtitle);
      }
      if (plot.note) {
        applyText(svg, layout.notePos.x, layout.notePos.y, { fontFamily: plot.textStyles.title.fontFamily, fontSize: 10, fontColor: colors.faint, fontWeight: "400" }, colors.faint, {}, plot.note);
      }
      var axisStroke = plot.xAxis.lineColor || colors.ink;
      var axisWidth = plot.xAxis.lineWidth || 1.1;
      yTickSet.minor.forEach(function (tick) {
        var y = yScale(tick);
        appendSvg(svg, "line", { x1: margin.left, y1: y, x2: margin.left - 3, y2: y, stroke: colors.line, "stroke-width": 1 });
      });
      xTickSet.minor.forEach(function (tick) {
        var x = xScale(tick);
        appendSvg(svg, "line", { x1: x, y1: height - margin.bottom, x2: x, y2: height - margin.bottom + 3, stroke: colors.line, "stroke-width": 1 });
      });
      yTicks.forEach(function (tick) {
        var y = yScale(tick);
        appendSvg(svg, "line", { x1: margin.left, y1: y, x2: width - margin.right, y2: y, stroke: colors.grid, "stroke-width": 1 });
        applyText(svg, layout.yTickX, y + (yTickSize.ascent - yTickSize.descent) / 2, plot.textStyles.yTick, colors.muted, { "text-anchor": "end" }, core.formatTickValue(tick, plot.yAxis));
      });
      xTicks.forEach(function (tick) {
        var x = xScale(tick);
        appendSvg(svg, "line", { x1: x, y1: height - margin.bottom, x2: x, y2: height - margin.bottom + 4, stroke: colors.line, "stroke-width": 1 });
        applyText(svg, x, layout.xTickY, plot.textStyles.xTick, colors.muted, { "text-anchor": "middle" }, core.formatTickValue(tick, plot.xAxis));
      });
      appendSvg(svg, "line", { x1: margin.left, y1: margin.top, x2: margin.left, y2: height - margin.bottom, stroke: plot.yAxis.lineColor || axisStroke, "stroke-width": plot.yAxis.lineWidth || axisWidth });
      appendSvg(svg, "line", { x1: margin.left, y1: height - margin.bottom, x2: width - margin.right, y2: height - margin.bottom, stroke: axisStroke, "stroke-width": axisWidth });
      if (xTitle) {
        applyText(svg, layout.xAxisTitlePos.x, layout.xAxisTitlePos.y, plot.textStyles.xAxisTitle, colors.ink, { "text-anchor": "middle" }, xTitle);
      }
      if (yTitle) {
        var yTitleNode = applyText(svg, layout.yAxisTitlePos.x, layout.yAxisTitlePos.y, plot.textStyles.yAxisTitle, colors.ink, {
          "text-anchor": "middle",
          transform: "rotate(-90 " + layout.yAxisTitlePos.x + " " + layout.yAxisTitlePos.y + ")"
        }, yTitle);
        yTitleNode.setAttribute("letter-spacing", ".01em");
      }
      visible.forEach(function (item) {
        var dataset = core.findDataset(project, item.series.datasetId);
        var xs = core.seriesXForPlot(project, plot, item.series, dataset);
        var pathAttrs = strokeStyleAttrs(item.style, item.color);
        pathAttrs.d = linePath(xs, item.series.y, xScale, yScale, 1400);
        appendSvg(svg, "path", pathAttrs);
      });
      if (legend.height) {
        var showBg = plot.legend.showBackground !== false;
        var showBorder = !!(plot.legend.showBorder || plot.legend.border);
        if (showBg || showBorder) {
          var fillOpacity = Number.isFinite(Number(plot.legend.backgroundOpacity)) ? plot.legend.backgroundOpacity : 0.85;
          appendSvg(svg, "rect", {
            x: legendBox.x, y: legendBox.y,
            width: legend.width + (legendBox.pad || 0) * 2,
            height: legend.height + (legendBox.pad || 0) * 2,
            fill: showBg ? (plot.legend.backgroundColor || colors.surface) : "none",
            "fill-opacity": showBg ? fillOpacity : 0,
            stroke: showBorder ? (plot.legend.borderColor || colors.line) : "none",
            "stroke-width": showBorder ? (plot.legend.borderWidth || 1) : 0,
            rx: plot.legend.borderRadius == null ? 4 : plot.legend.borderRadius
          });
        }
      }
      var legendOriginX = legendBox.x + (legendBox.pad || 0);
      var legendOriginY = legendBox.y + (legendBox.pad || 0);
      legend.placed.forEach(function (entry) {
        var x = legendOriginX + entry.x;
        var y = legendOriginY + entry.y + fontSize - 2;
        var sample = plot.legend.sampleLength || 16;
        var lineAttrs = strokeStyleAttrs(entry.item.style, entry.item.visible ? entry.item.color : colors.faint);
        lineAttrs.x1 = x;
        lineAttrs.y1 = y;
        lineAttrs.x2 = x + sample;
        lineAttrs.y2 = y;
        if (!entry.item.visible) lineAttrs.stroke = colors.faint;
        appendSvg(svg, "line", lineAttrs);
        var label = applyText(svg, x + sample + 6, y + 2, {
          fontFamily: plot.legend.fontFamily || legendText.fontFamily,
          fontSize: fontSize,
          fontColor: plot.legend.fontColor || (entry.item.visible ? colors.ink : colors.faint),
          fontWeight: plot.legend.fontWeight || legendText.fontWeight,
          italic: plot.legend.italic || legendText.italic
        }, entry.item.visible ? colors.ink : colors.faint, {
          "text-decoration": entry.item.visible ? "none" : "line-through"
        }, entry.item.label);
        if (interactive && entry.item.seriesId) {
          var hit = appendSvg(svg, "rect", {
            x: x, y: y - 10, width: Math.max(48, entry.width),
            height: entry.height, fill: "transparent", cursor: "pointer"
          });
          hit.addEventListener("click", function (event) {
            event.stopPropagation();
            var ref = plot.seriesRefs.find(function (item) { return item.seriesId === entry.item.seriesId; });
            if (!ref) return;
            ref.visible = !ref.visible;
            setDirty(true);
            renderCanvas();
            renderProps();
          });
          label.style.pointerEvents = "none";
        }
      });
      if (!visible.length) {
        applyText(svg, margin.left + plotWidth / 2, margin.top + plotHeight / 2, { fontSize: 12, fontColor: colors.muted, fontFamily: core.DEFAULT_FONT }, colors.muted, { "text-anchor": "middle" }, "从左侧勾选曲线并加入此图");
      }
      return svg;
    }

    function downsampleIndexes(length, maximum) {
      if (length <= maximum) return null;
      var indexes = [0];
      var step = (length - 1) / (maximum - 1);
      for (var index = 1; index < maximum - 1; index += 1) indexes.push(Math.round(index * step));
      indexes.push(length - 1);
      return Array.from(new Set(indexes));
    }

    function linePath(xs, ys, xScale, yScale, maximum) {
      var indexes = downsampleIndexes(xs.length, maximum) || xs.map(function (_, index) { return index; });
      var path = "";
      var drawing = false;
      var previous = -1;
      indexes.forEach(function (index) {
        if (index === previous) return;
        previous = index;
        if (!Number.isFinite(xs[index]) || !Number.isFinite(ys[index])) {
          drawing = false;
          return;
        }
        path += (drawing ? "L" : "M") + xScale(xs[index]).toFixed(2) + "," + yScale(ys[index]).toFixed(2);
        drawing = true;
      });
      return path;
    }

    function buildCanvasSvg() {
      var colors = theme();
      var width = project.canvas.width;
      var height = project.canvas.height;
      var svg = createSvg("svg", {
        xmlns: svgNamespace,
        width: width,
        height: height,
        viewBox: "0 0 " + width + " " + height,
        "aria-label": project.projectName + " 画布"
      });
      appendSvg(svg, "rect", { width: width, height: height, fill: colors.surface });
      project.plots.forEach(function (plot) {
        var nested = buildPlotSvg(plot, plot.layout.width, plot.layout.height, false);
        nested.setAttribute("x", plot.layout.x);
        nested.setAttribute("y", plot.layout.y);
        svg.appendChild(nested);
      });
      lastCanvasSvg = new XMLSerializer().serializeToString(svg);
      return svg;
    }

    function svgFileText(svg) {
      if (!svg.getAttribute("xmlns")) svg.setAttribute("xmlns", svgNamespace);
      return '<?xml version="1.0" encoding="UTF-8"?>' + new XMLSerializer().serializeToString(svg);
    }

    function sanitizeFilename(value) {
      return String(value || "visualizer").replace(/[\\/:*?"<>|]/g, "_");

      link.download = filename;

    function bindPlotPointer(box, plot, handle) {
      function others() {
        return project.plots.filter(function (item) { return item.id !== plot.id; });
      }
      box.addEventListener("pointerdown", function (event) {
        if (event.target === handle || event.target.classList.contains("tv-legend-hit")) return;
        selectedPlotId = plot.id;
        box.parentElement.appendChild(box);
        renderProps();
        document.querySelectorAll(".tv-plot").forEach(function (node) {
          node.classList.toggle("is-selected", node === box);
        });
        drag = {
          mode: "move",
          plot: plot,
          box: box,
          startX: event.clientX,
          startY: event.clientY,
          origX: plot.layout.x,
          origY: plot.layout.y
        };
        box.setPointerCapture(event.pointerId);
      });
      handle.addEventListener("pointerdown", function (event) {
        event.stopPropagation();
        selectedPlotId = plot.id;
        drag = {
          mode: "resize",
          plot: plot,
          box: box,
          startX: event.clientX,
          startY: event.clientY,
          origW: plot.layout.width,
          origH: plot.layout.height
        };
        box.setPointerCapture(event.pointerId);
      });
      box.addEventListener("pointermove", function (event) {
        if (!drag || drag.box !== box) return;
        var delta = core.screenToWorld(event.clientX - drag.startX, event.clientY - drag.startY, canvasZoom());
        if (drag.mode === "move") {
          plot.layout.x = Math.round(drag.origX + delta.x);
          plot.layout.y = Math.round(drag.origY + delta.y);
          var snapped = core.snapPlotMove(plot, others(), project.canvas, canvasZoom());
          showGuides(snapped.guides);
          box.style.left = plot.layout.x + "px";
          box.style.top = plot.layout.y + "px";
        } else {
          core.setPlotSize(plot, drag.origW + delta.x, drag.origH + delta.y, "width");
          var resized = core.snapPlotResize(plot, others(), project.canvas, canvasZoom());
          showGuides(resized.guides);
          box.style.width = plot.layout.width + "px";
          box.style.height = plot.layout.height + "px";
          showSizeTip(plot);
        }
        syncSizeFields(plot);
      });
      box.addEventListener("pointerup", function () {
        if (!drag || drag.box !== box) return;
        showGuides([]);
        var tip = paper.querySelector(".tv-size-tip");
        if (tip) tip.remove();
        core.syncCanvasToPlots(project);
        if (drag.mode === "resize") {
          var svg = buildPlotSvg(plot, plot.layout.width, plot.layout.height, true);
          box.replaceChildren(svg, handle);
          attachLegendHit(box, plot, svg);
        }
        drag = null;
        applyCanvasZoom();
        setDirty(true);
      });
    }

    function attachLegendHit(box, plot, svg) {
      var legendBox = svg.__legendBox;
      var plotArea = svg.__plotArea;
      if (!legendBox || !legendBox.height) return;
      var position = core.resolveLegendPosition(plot.legend);
      if (position !== "free") return;
      var pad = legendBox.pad || 0;
      var hit = document.createElement("div");
      hit.className = "tv-legend-hit is-free";
      hit.style.left = legendBox.x + "px";
      hit.style.top = legendBox.y + "px";
      hit.style.width = Math.max(24, legendBox.width + pad * 2) + "px";
      hit.style.height = Math.max(16, legendBox.height + pad * 2) + "px";
      hit.title = "拖动图例";
      hit.addEventListener("pointerdown", function (event) {
        event.stopPropagation();
        event.preventDefault();
        selectedPlotId = plot.id;
        drag = {
          mode: "legend",
          plot: plot,
          box: box,
          startX: event.clientX,
          startY: event.clientY,
          origX: legendBox.x,
          origY: legendBox.y,
          plotArea: plotArea,
          boxW: legendBox.width + pad * 2,
          boxH: legendBox.height + pad * 2
        };
        hit.setPointerCapture(event.pointerId);
      });
      hit.addEventListener("pointermove", function (event) {
        if (!drag || drag.mode !== "legend" || drag.plot !== plot) return;
        var delta = core.screenToWorld(event.clientX - drag.startX, event.clientY - drag.startY, canvasZoom());
        var area = drag.plotArea || { x: 0, y: 0, width: plot.layout.width, height: plot.layout.height };
        var nextX = core.clamp(drag.origX + delta.x, area.x, area.x + area.width - drag.boxW);
        var nextY = core.clamp(drag.origY + delta.y, area.y, area.y + area.height - drag.boxH);
        var spanX = Math.max(1, area.width - drag.boxW);
        var spanY = Math.max(1, area.height - drag.boxH);
        plot.legend.position = "free";
        plot.legend.x = core.clamp((nextX - area.x) / spanX, 0, 1);
        plot.legend.y = core.clamp((nextY - area.y) / spanY, 0, 1);
        plot.legend.floatingX = plot.legend.x;
        plot.legend.floatingY = plot.legend.y;
        hit.style.left = nextX + "px";
        hit.style.top = nextY + "px";
      });
      hit.addEventListener("pointerup", function () {
        if (!drag || drag.mode !== "legend") return;
        drag = null;
        setDirty(true);
        renderCanvas();
        renderProps();
      });
      box.appendChild(hit);
    }

    function makePlotBox(plot) {
      var box = document.createElement("div");
      box.className = "tv-plot" + (plot.id === selectedPlotId ? " is-selected" : "");
      box.dataset.plotId = plot.id;
      box.style.left = plot.layout.x + "px";
      box.style.top = plot.layout.y + "px";
      var svg = buildPlotSvg(plot, plot.layout.width, plot.layout.height, true);
      box.style.width = plot.layout.width + "px";
      box.style.height = plot.layout.height + "px";
      var handle = document.createElement("button");
      handle.type = "button";
      handle.className = "tv-plot-resize";
      handle.setAttribute("aria-label", "调整「" + plot.title + "」大小");
      box.append(svg, handle);
      attachLegendHit(box, plot, svg);
      bindPlotPointer(box, plot, handle);
      return box;
    }

    function renderCanvas() {

          ? "<div><strong>画布是空的</strong><p>点击「新建图」，然后从左侧勾选曲线加入指定图。</p></div>"
          : "<div><strong>等待实验数据</strong><p>导入 CSV，或打开 <code>.tvproj.json</code> 工程继续编辑。</p></div>";

      });

    function fieldControl(labelText, value, tag) {
      var wrap = document.createElement("label");
      var caption = document.createElement("span");
      caption.className = "tv-prop-label";
      caption.textContent = labelText;
      var input = document.createElement(tag || "input");

      return { wrap: wrap, input: input };
    }

    function section(title, open) {
      var details = document.createElement("details");
      details.className = "tv-accordion";
      details.open = open !== false;

      summary.textContent = title;

    function selectControl(labelText, value, options) {
      var field = fieldControl(labelText, "");
      field.input.remove();
      var select = document.createElement("select");
      select.className = "tv-select";
      options.forEach(function (pair) {
        var option = document.createElement("option");
        option.value = pair[0];
        option.textContent = pair[1];
        select.appendChild(option);
      });
      select.value = value;
      field.wrap.appendChild(select);

    }

    function fontFamilyControl(labelText, value) {
      var options = (core.FONT_FAMILIES || []).map(function (item) { return [item.value, item.label]; });
      var current = value || core.DEFAULT_FONT;
      if (!options.some(function (pair) { return pair[0] === current; })) {
        options.push([current, current.split(",")[0].replace(/['"]/g, "").trim() || current]);
      }
      return selectControl(labelText, current, options);
    }

    function sliderNumberControl(labelText, value, opts) {
      opts = opts || {};
      var min = opts.min;
      var max = opts.max;
      var step = opts.step;
      var wrap = document.createElement("div");
      wrap.className = "tv-line-width";
      var caption = document.createElement("span");
      caption.className = "tv-prop-label";
      caption.textContent = labelText;
      var row = document.createElement("div");
      row.className = "tv-line-width-row";
      var slider = document.createElement("input");
      slider.type = "range";
      slider.min = String(min);
      slider.max = String(max);
      slider.step = String(step);
      var number = document.createElement("input");
      number.className = "tv-field";
      number.type = "number";
      number.min = String(min);
      number.max = String(max);
      number.step = String(step);
      if (opts.mixed) {
        number.placeholder = "混合";
        number.value = "";
        slider.value = String(min);
      } else {
        number.value = value;
        slider.value = String(value);
      }
      var unit = document.createElement("span");
      unit.textContent = opts.unit || "";
      unit.style.color = "var(--muted)";
      unit.style.fontSize = "11px";
      var listeners = [];
      function parseValue(raw) {
        var n = Number(raw);
        if (!Number.isFinite(n)) return null;
        return core.clamp(n, min, max);
      }
      function emit(raw) {
        var n = parseValue(raw);
        if (n == null) return;
        slider.value = String(n);
        number.value = String(n);
        listeners.forEach(function (fn) { fn(n); });
      }
      slider.addEventListener("input", function () { emit(slider.value); });
      number.addEventListener("input", function () {
        if (number.value === "") return;
        var n = parseValue(number.value);
        if (n == null) return;
        slider.value = String(n);
        listeners.forEach(function (fn) { fn(n); });
      });
      number.addEventListener("change", function () {
        var n = parseValue(number.value);
        if (n == null) {
          if (!opts.mixed) number.value = slider.value;
          return;
        }
        emit(n);
      });
      row.append(slider, number, unit);
      wrap.append(caption, row);
      return {
        wrap: wrap,
        input: number,
        onValue: function (fn) { listeners.push(fn); }
      };
    }

    function bindTextStyle(style, onChange) {
      var wrap = document.createElement("div");
      wrap.style.display = "grid";
      wrap.style.gap = "6px";
      var family = fontFamilyControl("字体", style.fontFamily);
      var size = fieldControl("字号", style.fontSize);
      size.input.type = "number";
      size.input.min = "6";
      size.input.max = "72";
      var color = fieldControl("文字颜色", style.fontColor || "#1d2024");
      color.input.type = "color";
      var weight = document.createElement("label");
      var italic = document.createElement("label");
      var weightBox = document.createElement("input");
      weightBox.type = "checkbox";

    function importFiles(files) {
      var list = Array.from(files || []).filter(function (file) { return /\.csv$/i.test(file.name); });
      if (!list.length) return setStatus("请选择 CSV 文件。", "error");
      var names = [];
      var errors = [];
      var chain = Promise.resolve();
      list.forEach(function (file) {
        chain = chain.then(function () {
          return file.text().then(function (text) {
            var timeUnit = "s";
            var plot = selectedPlot();
            if (plot && plot.xAxis && plot.xAxis.time && plot.xAxis.time.sourceUnit) {
              timeUnit = plot.xAxis.time.sourceUnit;
            }
            var dataset = core.parseDatasetFromCsv(text, {
              name: file.name,
              sourceFilename: file.name,
              timeUnit: timeUnit
            });
            core.addDataset(project, dataset);
            names.push(dataset.name);
            if (dataset.warnings && dataset.warnings.length) {
              errors.push(file.name + "：" + dataset.warnings[0]);
            }
          }).catch(function (error) {
            errors.push(file.name + "：" + (error.message || String(error)));
          });
        });
      });
      chain.then(function () {
        if (names.length) setDirty(true);
        if (errors.length && names.length) setStatus("已导入 " + names.length + " 个；失败 " + errors.length + " 个。" + errors[0], "error");
        else if (errors.length) setStatus(errors[0], "error");
        else setStatus("已导入 " + names.length + " 个数据源：" + names.join("、") + "。", "ok");
        renderAll();
      });
    }

    function rememberSavedName(handle, filename) {
      var name = core.projectNameFromFilename((handle && handle.name) || filename || "");

      setDirty(false);
      setStatus("已保存到 " + ((handle && handle.name) || filename) + "。", "ok");

    function writeTextToHandle(handle, text) {
      return handle.createWritable().then(function (writable) {
        return writable.write(text).then(function () { return writable.close(); });
      });
    }

    function saveProjectAs() {
      var filename = projectFilename(project.projectName);
      pickSaveFile(filename, [{
        description: "Trajectory Visualizer Project",
        accept: { "application/json": [".json"] }
      }]).then(function (handle) {
        if (!handle) return;
        if (handle !== "download") {
          var name = core.projectNameFromFilename(handle.name || filename);
          if (name) project.projectName = name;
        } else {
          var fallbackName = core.projectNameFromFilename(filename);
          if (fallbackName) project.projectName = fallbackName;
        }
        var blob = new Blob([core.serializeProject(project)], { type: "application/json;charset=utf-8" });
        if (handle === "download") {
          downloadBlob(blob, filename);
          rememberSavedName(null, filename);
          return;
        }
        return writeBlobToHandle(handle, blob).then(function () {
          rememberSavedName(handle, filename);
        });
      }).catch(function (error) {
        setStatus("保存失败：" + (error && error.message ? error.message : String(error)), "error");
      });
    }

    function saveProject() {
      if (projectFileHandle) {
        writeTextToHandle(projectFileHandle, core.serializeProject(project)).then(function () {
          rememberSavedName(projectFileHandle, projectFileHandle.name);
        }).catch(function (error) {
          setStatus("保存失败：" + (error && error.message ? error.message : String(error)), "error");
        });
        return;

    function exportSvg() {

    function exportPng() {
      var svg = buildCanvasSvg();
      var text = svgFileText(svg);
      var image = new Image();
      var url = URL.createObjectURL(new Blob([text], { type: "image/svg+xml;charset=utf-8" }));
      image.onload = function () {
        var canvas = document.createElement("canvas");
        canvas.width = project.canvas.width * 2;
        canvas.height = project.canvas.height * 2;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = theme().surface;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          if (!blob) return setStatus("PNG 导出失败。", "error");
          var name = exportSuggestedName("png");
          saveBlobWithPicker(blob, name, [{
            description: "PNG Image",
            accept: { "image/png": [".png"] }
          }]).then(function (handle) {
            if (handle === null) return;
            setStatus(handle === "download" ? "已导出当前画布 PNG。" : "已保存 PNG：" + (handle.name || name) + "。", "ok");
          }).catch(function (error) {
            setStatus("PNG 导出失败：" + (error && error.message ? error.message : String(error)), "error");
          });
        }, "image/png");
      };
      image.onerror = function () {
        URL.revokeObjectURL(url);
        setStatus("PNG 导出失败。", "error");
      };
      image.src = url;
    }

    function bindSplitter(el, side) {
      el.addEventListener("pointerdown", function (event) {
        splitterDrag = { side: side, startX: event.clientX, startLeft: uiState().leftPanelWidth, startRight: uiState().rightPanelWidth };
        el.classList.add("is-active");
        el.setPointerCapture(event.pointerId);
      });
      el.addEventListener("pointermove", function (event) {
        if (!splitterDrag || splitterDrag.side !== side) return;
        var dx = event.clientX - splitterDrag.startX;
        var ui = uiState();
        if (side === "left") ui.leftPanelWidth = core.clamp(splitterDrag.startLeft + dx, 220, 600);
        else ui.rightPanelWidth = core.clamp(splitterDrag.startRight - dx, 260, 650);
        applyPanelLayout();
      });
      el.addEventListener("pointerup", function () {
        if (!splitterDrag) return;
        splitterDrag = null;
        el.classList.remove("is-active");
        setDirty(true);
      });
      el.addEventListener("dblclick", function () {
        var ui = uiState();
        if (side === "left") ui.leftPanelWidth = 268;
        else ui.rightPanelWidth = 300;
        applyPanelLayout();
        setDirty(true);
      });
    }

      if ((event.key === "a" || event.key === "A") && (event.ctrlKey || event.metaKey)) {
        if (isTextEntry(document.activeElement)) return;
        if (propsPanelActive) {
          var plotForSelect = selectedPlot();
          if (!plotForSelect || !(plotForSelect.seriesRefs || []).length) return;
          event.preventDefault();
          applyFigureSelection(plotForSelect, { type: "selectAll" });
          renderProps();
          return;
        }
        if (!dataPanelActive) return;
        var dataset = activeDatasetId ? core.findDataset(project, activeDatasetId) : null;
        if (!dataset && project.datasets.length === 1) dataset = project.datasets[0];
        if (!dataset) return;
        event.preventDefault();
        activeDatasetId = dataset.id;
        applyDatasetSelection(dataset, { type: "selectAll" });
        renderData();
        return;
      }
      if ((event.ctrlKey || event.metaKey) && (canvasActive || canvasScroll.contains(document.activeElement))) {
        if (event.key === "=" || event.key === "+") {
          event.preventDefault();
          setCanvasZoom(canvasZoom() + core.ZOOM_STEP);
          return;
        }
        if (event.key === "-" || event.key === "_") {
          event.preventDefault();
          setCanvasZoom(canvasZoom() - core.ZOOM_STEP);
          return;
        }
        if (event.key === "0") {
          event.preventDefault();
          setCanvasZoom(1);
          return;
        }
      }
      if (event.key !== "Delete" && event.key !== "Backspace") return;
      if (isTextEntry(document.activeElement)) return;
      if (!selectedPlotId) return;
      event.preventDefault();
      deletePlot(selectedPlotId);
    });
    window.addEventListener("beforeunload", function (event) {
      if (!dirty) return;
      event.preventDefault();
      event.returnValue = "";
    });
    app.addEventListener("dragover", function (event) { event.preventDefault(); });
    app.addEventListener("drop", function (event) {
      event.preventDefault();
      var files = Array.from(event.dataTransfer.files || []);
      var projectFile = files.find(function (file) { return /\.(tvproj\.json|tvproj|json)$/i.test(file.name); });
      if (projectFile) {
        projectFile.text().then(function (text) { openProjectText(text, projectFile.name); });
        return;
      }
      importFiles(files);
    });

    window.VisualizerApp = {
      getProject: function () { return project; },
      isDirty: function () { return dirty; },
      importCsvText: function (text, options) {
        var dataset = core.parseDatasetFromCsv(text, options || {});
        core.addDataset(project, dataset);
        setDirty(true);
        renderAll();
        return dataset.id;
      },
      addSeriesToPlot: function (plotId, seriesIds) {
        var plot = project.plots.find(function (item) { return item.id === plotId; });
        if (!plot) throw new Error("找不到图。");
        core.addSeriesToPlot(project, plot, seriesIds);
        selectedPlotId = plot.id;
        setDirty(true);
        renderAll();
      },
      selectPlot: function (plotId) {
        selectedPlotId = plotId;
        renderAll();
      },
      openProjectText: openProjectText,
      canvasSvgText: function () { return svgFileText(buildCanvasSvg()); },
      getLastCanvasSvg: function () { return lastCanvasSvg; },
      buildCanvasSvg: buildCanvasSvg
    };
    renderAll();
  }());
  </script>
</body>
</html>
