<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>Visualizer</title>
  <style>
    :root {
      /* Figure tokens. theme() reads these for axes, grid, paper and export. */
      --paper: #fbfbfa;
      --surface: #ffffff;
      --surface-2: #f5f6f5;
      --ink: #1d2024;
      --muted: #5d646b;
      --faint: #8b9299;
      --line: #d7dcde;
      --grid: #e4e7e8;
      --focus: #1e6eaa;
      --shadow: 0 12px 30px rgba(27, 34, 38, .08);
      --danger: #aa3f34;
      --ok: #35694b;
      --radius: 7px;
      --side: 276px;
      --props: 300px;
      /* Workbench chrome. Not read by the figure renderer. */
      --frame: #f6f2ea;
      --desk: #efe4d4;
      --ui: #1c1b19;
      --secondary: #4a453f;
      --rule: #ddd4c6;
      --export: #3a3228;
      --export-ink: #f6f1e8;
      --ui-font: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", STSong, serif;
      --chrome-shadow: 0 10px 24px -14px rgba(40, 32, 20, .4);
      --paper-shadow: 0 1px 0 rgba(60, 44, 28, .1), 0 14px 26px -12px rgba(60, 44, 28, .38);
    }
    [data-theme="dark"] {
      --paper: #15191b;
      --surface: #1b2023;
      --surface-2: #242a2e;
      --ink: #f1f3f1;
      --muted: #bcc3c4;
      --faint: #889395;
      --line: #354045;
      --grid: #2b3438;
      --focus: #75b8e7;
      --shadow: 0 12px 32px rgba(0, 0, 0, .22);
      --danger: #e08b82;
      --ok: #8fbf9e;
      --frame: #15191b;
      --desk: #101416;
      --ui: #f1f3f1;
      --secondary: #bcc3c4;
      --rule: #354045;
      --export: #243038;
      --export-ink: #f1f3f1;
      --chrome-shadow: 0 12px 32px rgba(0, 0, 0, .22);
      --paper-shadow: 0 12px 32px rgba(0, 0, 0, .22);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--frame);
      color: var(--ui);
      font-family: var(--ui-font);
      font-size: 14px;
      line-height: 1.45;
      font-variant-numeric: tabular-nums;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea, code, kbd { font: inherit; color: inherit; font-variant-numeric: tabular-nums; }
    button { color: inherit; cursor: pointer; }
    .tv-app {
      display: grid;
      grid-template-rows: 52px auto minmax(0, 1fr);
      grid-auto-rows: 0;
      height: 100%;
      min-width: 760px;
      background: var(--frame);
    }
    .tv-app.is-dock-pinned {
      grid-template-rows: 52px auto minmax(0, 1fr) auto;
      grid-auto-rows: auto;
    }
    .tv-topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      height: 52px;
      padding: 0 16px 0 20px;
      border-bottom: 1px solid var(--rule);
      background: var(--frame);
      min-width: 0;
    }
    .tv-bar { display: flex; align-items: center; gap: 2px; min-width: 0; }
    .tv-bar-right { justify-content: flex-end; }
    .tv-brand {
      margin: 0 22px 0 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ui);
      font-family: var(--ui-font);
      font-size: 22px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
    }
    .tv-doc {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
      white-space: nowrap;
    }
    .tv-doc-name {
      font-family: var(--ui-font);
      font-size: 16px;
      font-weight: 400;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tv-dirty, .tv-status {
      color: var(--secondary);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 400;
    }
    .tv-dirty { flex: none; }
    .tv-dirty.is-dirty { color: var(--ui); }
    .tv-dirty.is-dirty::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 6px;
      border-radius: 50%;
      background: #8d6b4a;
      vertical-align: 1px;
    }
    .tv-status {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tv-status[data-tone="error"] { color: var(--danger); }
    .tv-status[data-tone="ok"] { color: var(--ok); }
    .tv-topbar .tv-button,
    .tv-topbar .tv-file-button,
    .tv-topbar .tv-menu > summary {
      height: 30px;
      min-height: 30px;
      padding: 0 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--ui);
      font-size: 14px;
      font-weight: 400;
    }
    .tv-topbar .tv-button:hover,
    .tv-topbar .tv-file-button:hover,
    .tv-topbar .tv-menu > summary:hover {
      border-color: transparent;
      background: rgba(255, 255, 255, .45);
      color: var(--ui);
    }
    .tv-menu { position: relative; }
    .tv-menu > summary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      list-style: none;
      cursor: pointer;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--ui);
    }
    .tv-menu > summary::-webkit-details-marker { display: none; }
    .tv-menu > summary::after { content: "▾"; color: var(--secondary); font-size: 9px; }
    .tv-menu-list {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 40;
      min-width: 148px;
      padding: 6px;
      display: grid;
      gap: 2px;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: var(--frame);
      box-shadow: var(--chrome-shadow);
    }
    .tv-menu-list .tv-button { width: 100%; text-align: left; }
    .tv-file-button, .tv-button, .tv-select, .tv-field {
      min-height: 30px;
      border: 1px solid var(--rule);
      border-radius: 7px;
      background: var(--frame);
      color: var(--ui);
    }
    .tv-file-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      cursor: pointer;
    }
    .tv-file-button:hover, .tv-file-button:focus-within,
    .tv-button:hover { border-color: var(--ui); background: rgba(255, 255, 255, .45); }
    .tv-file-button input { display: none; }
    .tv-file-stamp {
      display: grid;
      place-items: center;
      width: 28px;
      height: 22px;
      border: 1px solid currentColor;
      border-radius: 3px;
      color: var(--focus);
      font: 500 9px/1 var(--ui-font);
    }
    .tv-button {
      padding: 0 11px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }
    .tv-button:active { transform: translateY(1px); }
    .tv-button:focus-visible, .tv-select:focus-visible, .tv-field:focus-visible, .tv-file-button:focus-within,
    .tv-brand:focus-visible {
      outline: 2px solid var(--ui);
      outline-offset: 2px;
    }
    .tv-button:disabled, .tv-field:disabled { opacity: .55; cursor: default; }
    .tv-button--primary { border-color: var(--export); background: var(--export); color: var(--export-ink); }
    .tv-button--primary:hover { background: #2c261e; color: #fff; }
    .tv-button--export,
    .tv-topbar .tv-menu > summary.tv-button--export {
      height: 30px;
      padding: 0 14px;
      border-radius: 8px;
      background: var(--export);
      color: var(--export-ink);
      font-weight: 600;
    }
    .tv-topbar .tv-menu > summary.tv-button--export::after { color: var(--export-ink); }
    .tv-button--export:hover,
    .tv-topbar .tv-menu > summary.tv-button--export:hover {
      background: #2c261e;
      color: #fff;
    }
    [data-theme="dark"] .tv-button--primary:hover,
    [data-theme="dark"] .tv-button--export:hover,
    [data-theme="dark"] .tv-topbar .tv-menu > summary.tv-button--export:hover {
      background: #2e3c46;
    }
    .tv-button--danger { color: var(--danger); }
    .tv-toolbar .tv-select { min-width: 92px; padding: 0 8px; }
    .tv-control { display: grid; gap: 3px; }
    .tv-control span, .tv-prop-label {
      color: var(--secondary);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0;
    }
    .tv-workspace {
      display: grid;
      grid-template-columns: var(--side) 5px minmax(0, 1fr) 5px var(--props);
      min-height: 0;
    }
    .tv-workspace.is-left-collapsed { grid-template-columns: 28px 0 minmax(0, 1fr) 5px var(--props); }
    .tv-workspace.is-right-collapsed { grid-template-columns: var(--side) 5px minmax(0, 1fr) 0 28px; }
    .tv-workspace.is-left-collapsed.is-right-collapsed { grid-template-columns: 28px 0 minmax(0, 1fr) 0 28px; }
    .tv-side {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: var(--frame);
      border-right: 1px solid var(--rule);
      position: relative;
      color: var(--ui);
    }
    .tv-side--props { border-right: 0; border-left: 1px solid var(--rule); }
    .tv-side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 0;
      padding: 16px 14px 0 18px;
    }
    .tv-side-head h2 { border-bottom: 0; flex: 1; }
    .tv-splitter {
      background: var(--rule);
      cursor: col-resize;
      position: relative;
      z-index: 10;
    }
    .tv-splitter:hover, .tv-splitter.is-active { background: var(--secondary); }
    .tv-canvas-col {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--desk);
    }
    .tv-zoombar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow-x: auto;
      padding: 8px 12px 0;
      border: 0;
      background: transparent;
    }
    .tv-zoombar .tv-button--tiny { white-space: nowrap; flex: none; }
    .tv-statusline {
      display: flex;
      align-items: center;
      min-height: 36px;
      padding: 0 16px 8px;
    }
    .tv-zoombar-label {
      min-width: 44px;
      text-align: center;
      font: 500 14px/1 var(--ui-font);
      font-variant-numeric: tabular-nums;
      color: var(--secondary);
    }
    .tv-tools {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      margin: 0;
      padding: 3px;
      border: 0;
      border-radius: 10px;
      background: #ddd4c4;
    }
    .tv-tools button, .tv-annotate summary, .tv-tools select {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--secondary);
      cursor: pointer;
    }
    .tv-tools svg { width: 15px; height: 15px; display: block; flex: none; }
    .tv-tools kbd { border: 0; background: transparent; color: inherit; opacity: .62; font-size: 11px; padding: 0; }
    .tv-tools button.is-on, .tv-annotate.is-on > summary {
      background: #fff;
      border-color: transparent;
      color: var(--ui);
      font-weight: 650;
      box-shadow: 0 1px 2px rgba(40, 32, 20, .16);
    }
    .tv-annotate { position: relative; }
    .tv-annotate summary { list-style: none; }
    .tv-annotate summary::-webkit-details-marker { display: none; }
    .tv-annotate-menu {
      position: absolute;
      left: 0;
      top: calc(100% + 6px);
      z-index: 30;
      display: grid;
      gap: 4px;
      min-width: 120px;
      padding: 6px;
      background: var(--frame);
      border: 1px solid var(--rule);
      border-radius: 10px;
      box-shadow: var(--chrome-shadow);
    }
    .tv-annotate-menu button { text-align: left; }
    .tv-inspector {
      position: absolute;
      z-index: 46;
      width: 280px;
      max-height: none;
      overflow: hidden;
      padding: 8px;
      background: var(--frame);
      border: 1px solid var(--rule);
      border-radius: 10px;
      box-shadow: var(--chrome-shadow);
      color: var(--ui);
      pointer-events: auto;
    }
    .tv-inspector-list {
      max-height: min(320px, 46vh);
      overflow: auto;
    }
    .tv-inspector-filter { height: 28px; margin: 0 0 6px; }
    .tv-inspector-row {
      width: 100%;
      border: 0;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
    }
    .tv-inspector-row:hover,
    .tv-inspector-row.is-nearest {
      background: color-mix(in srgb, var(--focus) 16%, transparent);
    }
    .tv-inspector-row.is-nearest { font-weight: 680; }
    .tv-inspector-swatch {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      align-self: center;
    }
    .tv-cursor-marker {
      position: absolute;
      width: 7px;
      height: 7px;
      margin: -3.5px 0 0 -3.5px;
      border-radius: 50%;
      pointer-events: none;
    }
    .tv-cursor-marker.is-nearest {
      width: 11px;
      height: 11px;
      margin: -5.5px 0 0 -5.5px;
      box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px currentColor;
    }
    .tv-inspector[hidden] { display: none; }
    .tv-inspector-x, .tv-inspector-y {
      font-variant-numeric: tabular-nums;
    }
    .tv-inspector-x { font-weight: 680; margin-bottom: 6px; }
    .tv-inspector-row, .tv-inspector-delta {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      margin: 0;
      padding: 3px 4px;
    }
    .tv-inspector-row span:first-child, .tv-inspector-delta span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tv-inspector-delta { color: var(--focus); }
    .tv-overlay { position: absolute; inset: 0; pointer-events: none; }
    .tv-range-rect {
      position: absolute;
      background: rgba(30, 110, 170, .14);
      border: 1px solid var(--focus);
    }
    .tv-range-actions {
      position: absolute;
      display: flex;
      gap: 4px;
      pointer-events: auto;
    }
    .tv-crosshair, .tv-cursor-line {
      position: absolute;
      width: 1px;
      background: var(--danger);
    }
    .tv-cursor-tag {
      position: absolute;
      padding: 0 3px;
      background: var(--surface);
      color: var(--danger);
      font: 500 12px/14px var(--ui-font);
    }
    .tv-object-box {
      position: absolute;
      border: 1px solid var(--focus);
      pointer-events: none;
    }
    .tv-object-handle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--focus);
    }
    .tv-ann-edit {
      position: absolute;
      z-index: 7;
      min-width: 96px;
      min-height: 28px;
      pointer-events: auto;
    }
    .tv-ann-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 4px;
      align-items: center;
      margin-bottom: 6px;
    }
    .tv-layout-menu {
      position: absolute;
      z-index: 100;
      display: grid;
      grid-template-columns: repeat(4, 64px);
      gap: 8px;
      padding: 10px;
      background: var(--frame);
      border: 1px solid var(--rule);
      border-radius: 10px;
      box-shadow: var(--chrome-shadow);
    }
    .tv-layout-choice {
      display: grid;
      gap: 4px;
      padding: 6px;
      border: 1px solid var(--line);
      background: var(--surface);
      cursor: pointer;
      color: var(--muted);
      font-size: 10px;
    }
    .tv-layout-choice:hover { border-color: var(--focus); color: var(--ink); }
    .tv-layout-icon {
      height: 36px;
      border: 1px solid currentColor;
      display: grid;
    }
    .tv-guides, .tv-dock-preview {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }
    .tv-guide {
      position: absolute;
      background: var(--focus);
      opacity: .7;
    }
    .tv-guide.is-x { width: 1px; top: 0; bottom: 0; }
    .tv-guide.is-y { height: 1px; left: 0; right: 0; }
    .tv-size-tip {
      position: absolute;
      z-index: 9;
      padding: 2px 6px;
      background: var(--ink);
      color: var(--surface);
      font: 500 12px/1.3 var(--ui-font);
      pointer-events: none;
    }
    .tv-legend-hit {
      position: absolute;
      cursor: move;
      z-index: 5;
      pointer-events: auto;
    }
    .tv-accordion {
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      margin: 0;
      background: transparent;
    }
    .tv-accordion > summary {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 2px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink);
      list-style: none;
    }
    .tv-accordion > summary::-webkit-details-marker { display: none; }
    .tv-accordion > summary::before {
      content: "›";
      width: 10px;
      color: var(--muted);
      font-weight: 400;
    }
    .tv-accordion[open] > summary::before { content: "⌄"; }
    .tv-accordion-body { padding: 0 0 8px 14px; display: grid; gap: 8px; }
    .tv-accordion .tv-accordion > summary { font-weight: 600; color: var(--muted); }
    .tv-original-name {
      color: var(--faint);
      font-size: 10px;
      line-height: 1.4;
      word-break: break-all;
    }
    .tv-preview-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .tv-preview-table th, .tv-preview-table td {
      border-bottom: 1px solid var(--line);
      padding: 4px 6px;
      text-align: left;
      vertical-align: top;
    }
    .tv-rename-stage { max-height: 48vh; overflow: auto; padding: 12px; }
    .tv-side h2 {
      margin: 0;
      padding: 0;
      border: 0;
      color: var(--ui);
      font: 500 22px/1.15 var(--ui-font);
      letter-spacing: 0;
      text-transform: none;
    }
    .tv-side-body { padding: 12px 18px 16px; }
    .tv-dataset {
      margin-bottom: 16px;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .tv-dataset-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto auto;
      gap: 6px;
      align-items: center;
      padding: 7px 0;
      border-bottom: 0;
      cursor: pointer;
    }
    .tv-dataset-toggle {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
    }
    .tv-dataset-count {
      color: var(--faint);
      font-size: 10px;
      white-space: nowrap;
    }
    .tv-dataset-head input {
      width: 100%;
      min-height: 28px;
      padding: 0 6px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      font-weight: 650;
      cursor: text;
    }
    .tv-dataset-head input:hover, .tv-dataset-head input:focus { border-color: var(--line); background: var(--surface); }
    .tv-dataset-tools {
      display: flex;
      gap: 6px;
      padding: 6px 8px 2px;
    }
    .tv-button--tiny {
      min-height: 26px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 650;
    }
    .tv-series-list { padding-bottom: 4px; }
    .tv-series-row {
      display: grid;
      grid-template-columns: auto 10px minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      min-height: 28px;
      padding: 4px 8px;
      font-size: 12px;
      user-select: none;
      cursor: pointer;
    }
    .tv-series-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tv-series-row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
    .tv-series-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      justify-self: center;
    }
    .tv-line-preview {
      display: block;
      width: 46px;
      height: 10px;
      color: var(--ink);
    }
    .tv-cluster-style {
      display: grid;
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .tv-color-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }
    .tv-color-row input[type="color"] {
      width: 36px;
      height: 28px;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .tv-field.is-invalid { border-color: var(--danger); }
    .tv-field-error { color: var(--danger); font-size: 11px; }
    .tv-line-current {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 28px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: inherit;
      cursor: pointer;
      text-align: left;
    }
    .tv-line-menu-list {
      display: grid;
      margin-top: 4px;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .tv-line-menu-list[hidden] { display: none; }

    .tv-hover-preview svg { width: 100%; height: 100%; display: block; }
    .tv-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 28px;
      font-size: 13px;
    }
    .tv-switch input {
      appearance: none;
      width: 32px;
      height: 18px;
      margin: 0;
      border: 0;
      border-radius: 999px;
      background: #d7d0c4;
      position: relative;
      flex: none;
      cursor: pointer;
    }
    .tv-switch input::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 140ms ease;
    }
    .tv-switch input:checked { background: #3a3228; }
    .tv-switch input:checked::after { transform: translateX(14px); }
    .tv-switch input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .tv-switch input:disabled { opacity: .45; }
    .tv-segment { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: #efe8dc; }
    .tv-segment button {
      flex: 1;
      min-height: 28px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--secondary);
      cursor: pointer;
    }
    .tv-segment button[aria-pressed="true"] { background: var(--surface); color: var(--ui); }
    .tv-segment button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .tv-metric {
      display: grid;
      grid-template-columns: 3.2em minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 28px;
    }
    .tv-metric .tv-field { height: 28px; }
    .tv-metric-unit { color: var(--secondary); font-size: 12px; }
    .tv-size-stack { display: grid; gap: 8px; }
    [data-theme="dark"] .tv-switch input { background: #354045; }
    [data-theme="dark"] .tv-switch input:checked { background: var(--focus); }
    [data-theme="dark"] .tv-segment,
    [data-theme="dark"] .tv-mode-switch { background: #242a2e; }
    [data-theme="dark"] .tv-mode-switch button[aria-pressed="true"],
    [data-theme="dark"] .tv-segment button[aria-pressed="true"] { background: var(--surface); color: var(--ui); }
    .tv-overview {
      margin: 8px 10px 0;
      padding: 8px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--surface);
      font-size: 12px;
    }
    .tv-overview p { margin: 0 0 4px; }
    .tv-overview table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    .tv-overview th, .tv-overview td { padding: 2px 4px; text-align: right; font-variant-numeric: tabular-nums; }
    .tv-overview th:first-child, .tv-overview td:first-child { text-align: left; }
    .tv-overview caption { caption-side: bottom; padding-top: 4px; color: var(--secondary); text-align: left; }
    .tv-dock-split { width: 1px; align-self: stretch; background: #e2e2e2; margin: 0 2px 22px; flex: none; }
    .tv-dock-plus .tv-dock-thumb { background: #fff; border-color: #e2e2e2; color: #737373; font-size: 28px; line-height: 1; }
    .tv-dock-thumb svg { width: 100%; height: 100%; display: block; }
    .tv-dock-menu { position: relative; }
    .tv-dock-popover {
      position: absolute;
      right: 0;
      bottom: 28px;
      z-index: 30;
      min-width: 140px;
      padding: 6px;
      background: #fafafa;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
    }
    .tv-dock-popover button, .tv-context button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      border-radius: 6px;
      padding: 6px 8px;
      cursor: pointer;
    }
    .tv-dock-popover button:hover, .tv-context button:hover, .tv-dock-card:hover .tv-dock-thumb { filter: saturate(1.05); }
    .tv-dock-popover button:hover, .tv-context button:hover { background: #eef3f8; }
    .tv-context {
      position: fixed;
      z-index: 60;
      min-width: 168px;
      padding: 6px;
      background: #fafafa;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
    }
    .tv-canvas-paper.is-drop { outline: 2px dashed #638dbb; }
    .tv-series-preview {
      margin: 8px 12px 0;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    .tv-series-preview p { margin: 0 0 6px; }
    .tv-series-preview svg { width: 100%; height: 36px; display: block; }
    @media (max-width: 1500px) {
      .tv-tools span { display: none; }

    @media (max-width: 980px) {

      .tv-modebar, .tv-dock { margin-left: 8px; margin-right: 8px; }
      .tv-tools span, .tv-tools kbd { display: none; }
    }

    function isTextEntry(el) {
      if (!el) return false;
      if (el.isContentEditable) return true;
      var tag = el.tagName;
      if (tag === "TEXTAREA" || tag === "SELECT") return true;
      if (tag !== "INPUT") return false;
      var type = String(el.type || "text").toLowerCase();
      return type !== "checkbox" && type !== "radio" && type !== "button" && type !== "color" && type !== "file";
    }

    function projectFilename(name) {
      var base = sanitizeFilename(name || "未命名工程");
      if (/\.tvproj\.json$/i.test(base)) return base;
      if (/\.tvproj$/i.test(base)) return base + ".json";
      if (/\.json$/i.test(base)) return base.replace(/\.json$/i, ".tvproj.json");
      return base + ".tvproj.json";
    }

    function canUseSavePicker() {
      return typeof window.showSaveFilePicker === "function";
    }

    function pickSaveFile(suggestedName, types) {
      if (canUseSavePicker()) {
        return window.showSaveFilePicker({
          suggestedName: suggestedName,
          types: types
        }).catch(function (error) {
          if (error && error.name === "AbortError") return null;
          throw error;
        });
      }
      setStatus("当前浏览器不支持自定义文件保存位置，文件将使用浏览器默认下载方式。", "");
      return Promise.resolve("download");
    }

    function writeBlobToHandle(handle, blob) {
      return handle.createWritable().then(function (writable) {
        return writable.write(blob).then(function () { return writable.close(); }).then(function () { return handle; });
      });
    }

    function saveBlobWithPicker(blob, suggestedName, types) {
      return pickSaveFile(suggestedName, types).then(function (handle) {
        if (!handle) return null;
        if (handle === "download") {
          downloadBlob(blob, suggestedName);
          return "download";
        }
        return writeBlobToHandle(handle, blob);
      });
    }

    function exportSuggestedName(ext) {
      var plot = selectedPlot() || (project.plots && project.plots[0]);
      var base = plot && plot.title ? plot.title : "Figure_1";
      return sanitizeFilename(base).replace(/\s+/g, "_") + "." + ext;
    }

    function canUseOpenPicker() {
      return typeof window.showOpenFilePicker === "function";
    }

    function cssValue(property) {
      return getComputedStyle(app).getPropertyValue(property).trim();
    }

    function theme() {
      return {
        surface: cssValue("--surface"),
        ink: cssValue("--ink"),
        muted: cssValue("--muted"),
        faint: cssValue("--faint"),
        line: cssValue("--line"),
        grid: cssValue("--grid")
      };
    }

    function setStatus(text, tone) {
      statusEl.textContent = text;
      statusEl.setAttribute("data-tone", tone || "");
    }

    function projectFileLabel() {
      if (projectFileHandle && projectFileHandle.name) return projectFileHandle.name;
      var name = (project && project.projectName) || "未命名工程";
      return /\.json$/i.test(name) ? name : name + ".json";
    }

    function setDirty(value) {
      dirty = value;

    function downsampleIndexes(length, maximum) {
      if (length <= maximum) return null;
      var indexes = [0];
      var step = (length - 1) / (maximum - 1);
      for (var index = 1; index < maximum - 1; index += 1) indexes.push(Math.round(index * step));
      indexes.push(length - 1);
      return Array.from(new Set(indexes));
    }

    function linePath(xs, ys, xScale, yScale, maximum, xMin, xMax) {
      var indexes = [];
      var cursor;
      var windowed = Number.isFinite(xMin) && Number.isFinite(xMax) && xMax > xMin;
      for (cursor = 0; cursor < xs.length; cursor += 1) {
        if (!Number.isFinite(xs[cursor]) || !Number.isFinite(ys[cursor])) continue;
        if (windowed && (xs[cursor] < xMin || xs[cursor] > xMax)) continue;
        indexes.push(cursor);
      }
      if (windowed && indexes.length) {
        var first = indexes[0];
        var last = indexes[indexes.length - 1];
        for (cursor = first - 1; cursor >= 0; cursor -= 1) {
          if (Number.isFinite(xs[cursor]) && Number.isFinite(ys[cursor])) {
            indexes.unshift(cursor);
            break;
          }
        }
        for (cursor = last + 1; cursor < xs.length; cursor += 1) {
          if (Number.isFinite(xs[cursor]) && Number.isFinite(ys[cursor])) {
            indexes.push(cursor);
            break;
          }
        }
      }
      if (!indexes.length) indexes = xs.map(function (_, index) { return index; });
      if (indexes.length > maximum) {
        var sampled = [indexes[0]];
        var step = (indexes.length - 1) / (maximum - 1);
        for (cursor = 1; cursor < maximum - 1; cursor += 1) sampled.push(indexes[Math.round(cursor * step)]);
        sampled.push(indexes[indexes.length - 1]);
        indexes = sampled;
      }
      var path = "";
      var drawing = false;
      var previous = -1;
      indexes.forEach(function (index) {
        if (index === previous) return;
        previous = index;
        if (!Number.isFinite(xs[index]) || !Number.isFinite(ys[index])) {
          drawing = false;
          return;
        }
        path += (drawing ? "L" : "M") + xScale(xs[index]).toFixed(2) + "," + yScale(ys[index]).toFixed(2);
        drawing = true;
      });
      return path;
    }

    function drawDetailSourceBoxes(svg, plot, xScale, yScale, interactive) {
      (project.plots || []).forEach(function (detail) {
        var source = detail.detailSource;
        if (!source || source.sourceFigureId !== plot.id || source.showSourceBox === false || detail.visible === false) return;
        var range = source.sourceRange || {};
        var x = xScale(range.xMin);
        var y = yScale(range.yMax);
        var width = xScale(range.xMax) - x;
        var height = yScale(range.yMin) - y;
        if (![x, y, width, height].every(Number.isFinite)) return;
        var style = source.boxStyle || {};
        var attrs = {
          x: x,
          y: y,
          width: Math.max(0, width),
          height: Math.max(0, height),
          fill: "none",
          stroke: style.color || "#1d4e89",
          "stroke-width": style.lineWidth || 1.25
        };
        var dash = core.strokeDasharray(style.lineType);
        if (dash) attrs["stroke-dasharray"] = dash;
        appendSvg(svg, "rect", attrs);
        if (!interactive) return;
        appendSvg(svg, "rect", {
          x: attrs.x,
          y: attrs.y,
          width: attrs.width,
          height: attrs.height,
          fill: "transparent",
          stroke: "transparent",
          "stroke-width": Math.max(8, Number(style.lineWidth) || 1),
          "data-object": "source-box",
          "data-object-id": detail.id
        });
      });
    }

    function appendDetailConnectors(svg, originOf, onlyPlot, interactive) {
      (project.plots || []).forEach(function (detail) {
        if (onlyPlot && detail.id !== onlyPlot.id) return;
        if (detail.visible === false) return;
        var spec = detail.detailSource;
        if (!spec || spec.showConnectorLines === false) return;
        var source = (project.plots || []).find(function (item) { return item.id === spec.sourceFigureId; });
        if (!source) return;
        var sourceSvg = originOf(source);
        var frame = sourceSvg && sourceSvg.__inspection && sourceSvg.__inspection.frame;
        if (!frame) return;
        var range = spec.sourceRange;
        var sourceView = viewBox(source);
        var detailView = viewBox(detail);
        var box = {
          x1: sourceView.x + frame.dataToPixelX(range.xMin) * sourceView.scaleX,
          x2: sourceView.x + frame.dataToPixelX(range.xMax) * sourceView.scaleX,
          y1: sourceView.y + frame.dataToPixelY(range.yMax) * sourceView.scaleY,
          y2: sourceView.y + frame.dataToPixelY(range.yMin) * sourceView.scaleY
        };
        var figure = { x: detailView.x, y: detailView.y, width: detailView.width, height: detailView.height };
        var style = spec.connectorStyle || {};
        var dash = core.strokeDasharray(style.lineType);
        core.detailConnectorLines(box, figure).forEach(function (line) {
          var attrs = {
            x1: line.x1, y1: line.y1, x2: line.x2, y2: line.y2,
            stroke: style.color || "#1d4e89",
            "stroke-width": style.lineWidth || 1

          if (dash) attrs["stroke-dasharray"] = dash;

          if (interactive) drawn.style.pointerEvents = "none";
          if (!interactive) return;
          var hit = appendSvg(svg, "line", {
            x1: line.x1, y1: line.y1, x2: line.x2, y2: line.y2,
            stroke: "transparent",
            "stroke-width": Math.max(10, (Number(style.lineWidth) || 1) + 8),
            "data-object": "connector",

    function pushHistory(label, before, after) {
      if (JSON.stringify(before) === JSON.stringify(after)) return;
      editHistory.push({
        label: label,
        undo: function () { core.restoreEditorState(project, before); },
        redo: function () { core.restoreEditorState(project, after); }
      });
    }

    function commitEdit(label, mutate) {
      var before = core.captureEditorState(project);
      mutate();
      pushHistory(label, before, core.captureEditorState(project));
      setDirty(true);
    }

    function applyHistory(direction) {
      var entry = direction === "undo" ? editHistory.undo() : editHistory.redo();
      if (!entry) return;
      selectedObject = null;
      drag = null;
      setDirty(true);
      renderAll();
      setStatus(direction === "undo" ? "已撤销。" : "已重做。", "");
    }

    function armStyleGesture() {
      if (!styleGesture) styleGesture = core.captureEditorState(project);
    }

    function finishStyleGesture() {
      if (!styleGesture) return;
      var before = styleGesture;
      styleGesture = null;
      pushHistory("Series style", before, core.captureEditorState(project));
    }

    function formatReading(value) {
      if (!Number.isFinite(value)) return "—";
      var abs = Math.abs(value);
      if (abs !== 0 && (abs >= 10000 || abs < 0.001)) return value.toExponential(2);
      return String(Math.round(value * 1000) / 1000);
    }

    function figurePoint(box, event) {
      var rect = box.getBoundingClientRect();
      var zoom = canvasZoom() || 1;
      var scaleX = Number(box.dataset.scaleX) || 1;
      var scaleY = Number(box.dataset.scaleY) || 1;
      return { x: (event.clientX - rect.left) / zoom / scaleX, y: (event.clientY - rect.top) / zoom / scaleY };
    }

    function annotationPixels(ann, frame, area) {
      function point(source) {
        if (!source) return { x: 0, y: 0 };
        if (ann.coordinateMode === "canvas") return { x: source.x, y: source.y };
        if (ann.coordinateMode === "plot" && area) {
          return { x: area.x + source.x * area.width, y: area.y + source.y * area.height };
        }
        return { x: frame.dataToPixelX(source.x), y: frame.dataToPixelY(source.y) };
      }
      return { anchor: point(ann.anchor), end: point(ann.end || ann.anchor) };
    }

    function setInteractionMode(mode, silent) {
      interactionMode = mode;
      document.querySelectorAll(".tv-tools [data-tool]").forEach(function (btn) {
        var on = btn.getAttribute("data-tool") === mode || (mode.indexOf("annotation-") === 0 && btn.getAttribute("data-tool") === "annotate");
        btn.classList.toggle("is-on", on);
        if (btn.hasAttribute("aria-pressed")) btn.setAttribute("aria-pressed", on ? "true" : "false");
      });
      var annotate = document.getElementById("tvAnnotate");
      if (annotate) annotate.classList.toggle("is-on", mode.indexOf("annotation-") === 0);
      document.querySelectorAll("[data-ann]").forEach(function (btn) {
        btn.classList.toggle("is-on", btn.getAttribute("data-ann") === mode);
      });
      var cursorControls = mode === "cursor";
      document.getElementById("tvCursorMode").hidden = !cursorControls;
      document.getElementById("tvClearCursors").hidden = !cursorControls;
      if (!cursorControls) {
        cursorHover = null;
        readoutCursor = null;
        document.getElementById("tvInspector").hidden = true;
      }
      if (mode !== "range-select" && drag && (drag.mode === "range" || drag.mode === "range-ready")) drag = null;
      if (!silent) renderCanvas();
    }

    function drawPlotInspection(svg, plot, ctx) {
      var hits = { annotations: [], insets: [] };
      (plot.insets || []).forEach(function (inset) {
        if (inset.visible === false) return;
        drawSourceRange(svg, inset, ctx);
        hits.insets.push({ id: inset.id, rect: inset.rect });
      });
      (plot.annotations || []).forEach(function (ann) {
        if (ann.visible === false) return;
        var pixels = annotationPixels(ann, ctx.frame, ctx.plotArea);
        var drawn = drawAnnotation(svg, ann, pixels, ctx.colors);
        hits.annotations.push({
          id: ann.id,
          type: ann.type,
          anchor: pixels.anchor,
          end: pixels.end,
          box: drawn && drawn.box
        });
      });
      (plot.insets || []).forEach(function (inset) {
        if (inset.visible === false) return;
        drawInset(svg, plot, inset, ctx.colors, ctx.interactive);
      });
      if (!ctx.interactive && plot.exportCursors) drawExportedCursors(svg, plot, ctx);
      return {
        plotArea: ctx.plotArea,
        frame: ctx.frame,
        extents: ctx.extents,
        annotations: hits.annotations,
        insets: hits.insets
      };
    }

    function drawSourceRange(svg, inset, ctx) {
      var x = ctx.xScale(inset.sourceRange.xMin);
      var y = ctx.yScale(inset.sourceRange.yMax);
      var width = ctx.xScale(inset.sourceRange.xMax) - x;
      var height = ctx.yScale(inset.sourceRange.yMin) - y;
      appendSvg(svg, "rect", {
        x: x, y: y, width: Math.max(0, width), height: Math.max(0, height),
        fill: "#1e6eaa", "fill-opacity": 0.08, stroke: "#1e6eaa",
        "stroke-width": 1, "stroke-dasharray": "4 3"
      });
      if (!inset.connector || inset.connector.visible === false) return;
      appendSvg(svg, "line", {
        x1: x + width / 2, y1: y + height / 2,
        x2: inset.rect.x + inset.rect.width / 2,
        y2: inset.rect.y + inset.rect.height / 2,
        stroke: "#1e6eaa", "stroke-width": 1
      });
    }

    function drawInset(svg, plot, inset, colors, interactive) {
      var rect = inset.rect;
      var ranges = core.insetRanges(project, plot, inset);
      var top = inset.title ? 18 : 6;
      var inner = {
        x: 26,
        y: top,
        width: Math.max(12, rect.width - 32),
        height: Math.max(12, rect.height - top - 16)
      };
      var frame = core.createPlotFrame(ranges.x, ranges.y, inner);
      var node = createSvg("svg", { x: rect.x, y: rect.y, width: rect.width, height: rect.height });
      appendSvg(node, "rect", {
        x: 0, y: 0, width: rect.width, height: rect.height,
        fill: inset.style.backgroundColor,
        "fill-opacity": inset.style.backgroundOpacity,
        stroke: inset.style.borderColor,
        "stroke-width": inset.style.borderWidth
      });
      if (inset.title) {
        applyText(node, 6, 13, { fontSize: 11, fontFamily: core.DEFAULT_FONT, fontWeight: "650" }, colors.ink, {}, inset.title);
      }
      var clipId = (interactive ? "edit-" : "file-") + String(inset.id).replace(/[^A-Za-z0-9_-]/g, "");
      var defs = createSvg("defs");
      var clip = createSvg("clipPath", { id: clipId });
      appendSvg(clip, "rect", inner);
      defs.appendChild(clip);
      node.appendChild(defs);
      var group = createSvg("g", { "clip-path": "url(#" + clipId + ")" });
      var wanted = {};
      (inset.seriesIds || []).forEach(function (id) { wanted[id] = true; });
      var drawn = [];
      core.resolvePlotSeries(project, plot).forEach(function (item) {
        if (!item.visible || !wanted[item.series.id]) return;
        var dataset = core.findDataset(project, item.series.datasetId);
        var xs = core.seriesXForPlot(project, plot, item.series, dataset);
        var attrs = strokeStyleAttrs(item.style, item.color);
        attrs.d = linePath(xs, item.series.y, frame.dataToPixelX, frame.dataToPixelY, 800);
        if (!attrs.d) return;
        appendSvg(group, "path", attrs);
        drawn.push(item);
      });
      node.appendChild(group);
      appendSvg(node, "line", { x1: inner.x, y1: inner.y, x2: inner.x, y2: inner.y + inner.height, stroke: colors.ink, "stroke-width": 0.8 });
      appendSvg(node, "line", { x1: inner.x, y1: inner.y + inner.height, x2: inner.x + inner.width, y2: inner.y + inner.height, stroke: colors.ink, "stroke-width": 0.8 });
      if (!drawn.length) {
        applyText(node, inner.x + inner.width / 2, inner.y + inner.height / 2, { fontSize: 10, fontFamily: core.DEFAULT_FONT }, colors.muted, { "text-anchor": "middle" }, "无可绘制曲线");
      } else if (inset.showLegend) {
        drawn.slice(0, 6).forEach(function (item, index) {
          var y = inner.y + 10 + index * 12;
          appendSvg(node, "line", { x1: inner.x + inner.width - 70, y1: y, x2: inner.x + inner.width - 56, y2: y, stroke: item.color, "stroke-width": 1.4 });
          applyText(node, inner.x + inner.width - 52, y + 3, { fontSize: 9, fontFamily: core.DEFAULT_FONT }, colors.ink, {}, core.seriesDisplayName(item.series));
        });
      }
      svg.appendChild(node);
    }

    function drawAnnotationBox(svg, x, y, text, style, colors) {
      var lines = String(text || "").split("\n");
      var fontSize = Number(style.fontSize) || 12;
      var width = 36;
      lines.forEach(function (line) {
        var size = measureStyledText(line || " ", { fontFamily: style.fontFamily, fontSize: fontSize, fontWeight: style.fontWeight });
        width = Math.max(width, size.width + 12);
      });
      var height = lines.length * (fontSize + 3) + 8;
      var border = Number(style.borderWidth);
      if (!Number.isFinite(border)) border = 1;
      appendSvg(svg, "rect", {
        x: x, y: y, width: width, height: height,
        fill: style.backgroundColor || "#ffffff",
        "fill-opacity": style.backgroundOpacity == null ? 0.92 : style.backgroundOpacity,
        stroke: border > 0 ? (style.borderColor || style.color || colors.ink) : "none",
        "stroke-width": border,
        rx: 2
      });
      lines.forEach(function (line, index) {
        applyText(svg, x + 6, y + 6 + fontSize + index * (fontSize + 3), {
          fontFamily: style.fontFamily, fontSize: fontSize, fontWeight: style.fontWeight, fontColor: style.color
        }, style.color || colors.ink, {}, line);
      });
      return { x: x, y: y, width: width, height: height };
    }

    function drawAnnotation(svg, ann, pixels, colors) {
      var style = ann.style || {};
      if (ann.type === "region") {
        var x = Math.min(pixels.anchor.x, pixels.end.x);
        var y = Math.min(pixels.anchor.y, pixels.end.y);
        var width = Math.abs(pixels.end.x - pixels.anchor.x);
        var height = Math.abs(pixels.end.y - pixels.anchor.y);
        appendSvg(svg, "rect", {
          x: x, y: y, width: width, height: height,
          fill: style.fillColor || "#1e6eaa",
          "fill-opacity": style.fillOpacity == null ? 0.16 : style.fillOpacity,
          stroke: style.borderColor || style.color || colors.ink,
          "stroke-width": style.lineWidth || 1
        });
        if (ann.text) {
          applyText(svg, x + 4, y + (style.fontSize || 12), {
            fontFamily: style.fontFamily, fontSize: style.fontSize, fontWeight: style.fontWeight, fontColor: style.color
          }, style.color || colors.ink, {}, ann.text);
        }
        return;
      }
      if (ann.type === "arrow") {
        appendSvg(svg, "line", {
          x1: pixels.anchor.x, y1: pixels.anchor.y, x2: pixels.end.x, y2: pixels.end.y,
          stroke: style.color || colors.ink, "stroke-width": style.lineWidth || 1.2
        });
        appendSvg(svg, "polygon", {
          points: arrowHeadPoints(pixels.anchor.x, pixels.anchor.y, pixels.end.x, pixels.end.y),
          fill: style.color || colors.ink
        });
        if (ann.text) {
          applyText(svg, pixels.end.x + 6, pixels.end.y, {
            fontFamily: style.fontFamily, fontSize: style.fontSize, fontWeight: style.fontWeight, fontColor: style.color
          }, style.color || colors.ink, {}, ann.text);
        }
        return;
      }
      if (ann.type === "point" || ann.type === "free") {
        var box = drawAnnotationBox(svg, pixels.end.x, pixels.end.y, ann.text || (ann.type === "free" ? "文本" : ""), style, colors);
        if (ann.type === "point") {
          appendSvg(svg, "line", {
            x1: pixels.anchor.x, y1: pixels.anchor.y,
            x2: box.x, y2: box.y + box.height / 2,
            stroke: style.color || colors.ink,
            "stroke-width": style.lineWidth || 1
          });
          appendSvg(svg, "circle", {
            cx: pixels.anchor.x, cy: pixels.anchor.y, r: 3.5,
            fill: style.color || colors.ink,
            stroke: "#ffffff",
            "stroke-width": 1
          });
        }
        return { box: box };
      }
      if (ann.type === "marker") drawMarker(svg, pixels.anchor, ann.marker, style, colors);
      var text = ann.text || (ann.type === "text" ? "文字" : "");
      if (!text) return;
      var measured = measureStyledText(text, { fontFamily: style.fontFamily, fontSize: style.fontSize, fontWeight: style.fontWeight });
      if (style.backgroundOpacity > 0) {
        appendSvg(svg, "rect", {
          x: pixels.anchor.x, y: pixels.anchor.y - measured.height,
          width: Math.max(8, measured.width + 6), height: measured.height + 4,
          fill: style.backgroundColor || "#ffffff", "fill-opacity": style.backgroundOpacity
        });
      }
      applyText(svg, pixels.anchor.x + 3, pixels.anchor.y, {
        fontFamily: style.fontFamily, fontSize: style.fontSize, fontWeight: style.fontWeight, fontColor: style.color
      }, style.color || colors.ink, {}, text);
    }

    function drawMarker(svg, point, shape, style, colors) {
      var color = style.color || colors.ink;
      if (shape === "square") {
        appendSvg(svg, "rect", { x: point.x - 4, y: point.y - 4, width: 8, height: 8, fill: color });
        return;
      }
      if (shape === "diamond") {
        appendSvg(svg, "polygon", {
          points: [point.x, point.y - 5, point.x + 5, point.y, point.x, point.y + 5, point.x - 5, point.y].join(" "),
          fill: color
        });
        return;
      }
      appendSvg(svg, "circle", { cx: point.x, cy: point.y, r: 4, fill: color });
    }

    function arrowHeadPoints(x1, y1, x2, y2) {
      var angle = Math.atan2(y2 - y1, x2 - x1);
      var size = 8;
      function tip(turn) {
        return (x2 + Math.cos(angle + turn) * size).toFixed(2) + "," + (y2 + Math.sin(angle + turn) * size).toFixed(2);
      }
      return x2.toFixed(2) + "," + y2.toFixed(2) + " " + tip(Math.PI * 0.82) + " " + tip(-Math.PI * 0.82);
    }

    function drawExportedCursors(svg, plot, ctx) {
      var area = ctx.plotArea;
      (plot.fixedCursors || []).forEach(function (cursor) {
        var x = ctx.xScale(cursor.x);
        appendSvg(svg, "line", {
          x1: x, y1: area.y, x2: x, y2: area.y + area.height,
          stroke: "#aa3f34", "stroke-width": 1
        });
        applyText(svg, x + 4, area.y + 12, { fontSize: 10, fontFamily: core.DEFAULT_FONT, fontWeight: "700" }, "#aa3f34", {}, cursor.id);
      });
    }

    function updateOverlay(box, plot) {
      var previous = box.querySelector(".tv-overlay");
      if (previous) previous.remove();
      var svg = box.querySelector("svg");
      var info = svg && svg.__inspection;
      if (!info) return;
      var overlay = document.createElement("div");
      overlay.className = "tv-overlay";
      if (drag && drag.box === box && (drag.mode === "range" || drag.mode === "range-ready" || drag.mode === "region")) {
        appendRangeOverlay(overlay, box, plot, drag);
      }
      if (drag && drag.box === box && drag.mode === "arrow") appendArrowOverlay(overlay, drag);
      if (interactionMode === "cursor" && readoutCursor && readoutCursor.plotId === plot.id) {
        appendLine(overlay, info.frame.dataToPixelX(readoutCursor.x), info.plotArea, "");
        appendCursorMarkers(overlay, plot, info, readoutCursor.x, readoutCursor.nearestSeriesId);
      } else if (interactionMode === "cursor" && cursorHover && cursorHover.plotId === plot.id) {
        appendLine(overlay, info.frame.dataToPixelX(cursorHover.x), info.plotArea, "");
        appendCursorMarkers(overlay, plot, info, cursorHover.x, cursorHover.nearestSeriesId);
      }
      (plot.fixedCursors || []).forEach(function (cursor) {
        appendLine(overlay, info.frame.dataToPixelX(cursor.x), info.plotArea, cursor.id);
      });
      if (interactionMode === "pointer" && selectedObject && selectedObject.plotId === plot.id) {
        appendSelectionChrome(overlay, info);
      }
      var handle = box.querySelector(".tv-plot-resize");
      box.insertBefore(overlay, handle);
    }

    function appendCursorMarkers(overlay, plot, info, dataX, nearestSeriesId) {
      core.readPlotAtX(project, plot, dataX, "nearest").forEach(function (row) {
        if (row.y == null || row.x == null) return;
        var marker = document.createElement("div");
        marker.className = "tv-cursor-marker" + (row.seriesId === nearestSeriesId ? " is-nearest" : "");

        marker.style.color = row.color || "#2477b6";

    function nearestSeriesAtX(plot, info, dataX, pixelX, pixelY) {
      var best = null;
      core.readPlotAtX(project, plot, dataX, "nearest").forEach(function (row) {
        if (row.y == null || row.x == null) return;
        var dist = Math.hypot(info.frame.dataToPixelX(row.x) - pixelX, info.frame.dataToPixelY(row.y) - pixelY);
        if (!best || dist < best.dist) best = { dist: dist, seriesId: row.seriesId };
      });
      return best ? best.seriesId : "";
    }

    function appendLine(overlay, x, area, label) {

    function appendRangeOverlay(overlay, box, plot, gesture) {
      var x = Math.min(gesture.startPt.x, gesture.currentPt.x);
      var y = Math.min(gesture.startPt.y, gesture.currentPt.y);
      var width = Math.abs(gesture.currentPt.x - gesture.startPt.x);

      rect.className = "tv-range-rect";

      rect.style.top = y + "px";
      rect.style.width = width + "px";
      rect.style.height = height + "px";
      overlay.appendChild(rect);
      if (gesture.mode !== "range-ready" || !gesture.range) return;
      var bar = document.createElement("div");
      bar.className = "tv-range-actions";
      bar.style.left = Math.max(0, Math.min(x, plot.layout.width - 220)) + "px";
      bar.style.top = Math.max(0, y + height + 4) + "px";
      [["放大到此范围", function () { zoomToRange(plot, gesture.range); }], ["创建局部视图", function () { createLocalFigure(plot, gesture.range); }], ["取消", function () { drag = null; updateOverlay(box, plot); }]].forEach(function (item) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "tv-button tv-button--tiny";
        button.textContent = item[0];
        button.addEventListener("pointerdown", function (event) { event.stopPropagation(); });
        button.addEventListener("pointerup", function (event) { event.stopPropagation(); });
        button.addEventListener("click", item[1]);
        bar.appendChild(button);
      });
      overlay.appendChild(bar);
    }

    function appendArrowOverlay(overlay, gesture) {
      var svg = document.createElementNS(svgNamespace, "svg");
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");
      svg.style.position = "absolute";

      svg.style.overflow = "visible";

    }

    function appendSelectionChrome(overlay, info) {
      if (selectedObject.type === "inset") {
        var inset = (info.insets || []).find(function (item) { return item.id === selectedObject.id; });
        if (!inset) return;
        var box = document.createElement("div");
        box.className = "tv-object-box";
        box.style.left = inset.rect.x + "px";
        box.style.top = inset.rect.y + "px";

        return;
      }
      var ann = (info.annotations || []).find(function (item) { return item.id === selectedObject.id; });
      if (!ann) return;
      var bounds = annotationBounds(ann);
      var mark = document.createElement("div");
      mark.className = "tv-object-box";
      mark.style.left = bounds.x + "px";
      mark.style.top = bounds.y + "px";

    function annotationBounds(hit) {
      if (hit.box) return hit.box;
      if (hit.type === "region" || hit.type === "arrow") {
        var x = Math.min(hit.anchor.x, hit.end.x);
        var y = Math.min(hit.anchor.y, hit.end.y);
        return { x: x, y: y, width: Math.max(8, Math.abs(hit.end.x - hit.anchor.x)), height: Math.max(8, Math.abs(hit.end.y - hit.anchor.y)) };
      }
      return { x: hit.anchor.x - 6, y: hit.anchor.y - 14, width: 72, height: 22 };
    }

    function hitInspection(info, x, y) {
      if (!info) return null;
      var area = info.plotArea;
      var inPlot = x >= area.x && y >= area.y && x <= area.x + area.width && y <= area.y + area.height;
      if (interactionMode !== "pointer") return inPlot ? { kind: "plot" } : null;
      var i;
      for (i = info.insets.length - 1; i >= 0; i -= 1) {
        var rect = info.insets[i].rect;
        if (Math.abs(x - (rect.x + rect.width)) <= 8 && Math.abs(y - (rect.y + rect.height)) <= 8) {
          return { kind: "inset-handle", id: info.insets[i].id };
        }
      }
      for (i = info.annotations.length - 1; i >= 0; i -= 1) {
        if (annotationContains(info.annotations[i], x, y)) return { kind: "annotation", id: info.annotations[i].id, type: info.annotations[i].type };
      }
      for (i = info.insets.length - 1; i >= 0; i -= 1) {
        var body = info.insets[i].rect;
        if (x >= body.x && y >= body.y && x <= body.x + body.width && y <= body.y + body.height) {
          return { kind: "inset", id: info.insets[i].id };
        }
      }
      return inPlot ? { kind: "plot" } : null;
    }

    function annotationContains(hit, x, y) {
      if (hit.type === "region") {
        var left = Math.min(hit.anchor.x, hit.end.x);
        var top = Math.min(hit.anchor.y, hit.end.y);
        return x >= left && y >= top && x <= left + Math.abs(hit.end.x - hit.anchor.x) && y <= top + Math.abs(hit.end.y - hit.anchor.y);
      }
      if (hit.box && x >= hit.box.x && y >= hit.box.y && x <= hit.box.x + hit.box.width && y <= hit.box.y + hit.box.height) return true;
      if (hit.type === "point") return Math.hypot(x - hit.anchor.x, y - hit.anchor.y) <= 8;
      if (hit.type === "arrow") return distanceToSegment(x, y, hit.anchor.x, hit.anchor.y, hit.end.x, hit.end.y) <= 6;
      return Math.hypot(x - hit.anchor.x, y - hit.anchor.y) <= 12;
    }

    function distanceToSegment(px, py, x1, y1, x2, y2) {
      var dx = x2 - x1;
      var dy = y2 - y1;
      var len = dx * dx + dy * dy;
      var t = len ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len)) : 0;
      return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
    }

    function clampToPlotArea(pt, area) {
      return {
        x: Math.min(area.x + area.width, Math.max(area.x, pt.x)),
        y: Math.min(area.y + area.height, Math.max(area.y, pt.y))
      };
    }

    function selectionFromGesture(gesture) {
      var frame = gesture.info.frame;
      var area = gesture.info.plotArea;
      var start = clampToPlotArea(gesture.startPt, area);
      var end = clampToPlotArea(gesture.currentPt, area);
      var dx = Math.abs(end.x - start.x);
      var dy = Math.abs(end.y - start.y);
      var xOnly = dy < 8 && dx >= 12;
      var range = core.normalizeSelectionRange(
        { x: frame.pixelToDataX(start.x), y: frame.pixelToDataY(start.y) },
        { x: frame.pixelToDataX(end.x), y: frame.pixelToDataY(end.y), xOnly: xOnly },
        gesture.plot.id
      );
      if (range && xOnly) {
        range.yMin = gesture.info.extents.y[0];
        range.yMax = gesture.info.extents.y[1];
        range.xOnly = true;
      }
      return range;
    }

    function zoomToRange(plot, range) {

    function createInsetFromRange(plot, range, plotArea) {

      var inset = null;
      commitEdit("Create inset", function () {

          sourcePlotId: plot.id,
          sourceRange: { xMin: range.xMin, xMax: range.xMax, yMin: range.yMin, yMax: range.yMax },
          rect: rect,
          seriesIds: ids,
          xAxis: { auto: false, min: range.xMin, max: range.xMax },
          yAxis: { auto: true },

        }, plot.id);
        plot.insets.push(inset);
      });

    function addAnnotation(plot, raw) {
      var ann = core.normalizeAnnotation(raw, plot.id);
      if (!ann) return null;
      if (ann.type === "text" && plot.textStyles && plot.textStyles.annotation) {

      }

      selectedObject = { type: "annotation", id: ann.id, plotId: plot.id };

    function placeReadout(plot, dataX, nearestSeriesId) {
      readoutCursor = { plotId: plot.id, x: dataX, nearestSeriesId: nearestSeriesId || "" };
      cursorHover = null;
    }

    function focusReadoutSeries(seriesId) {
      if (!readoutCursor) return;
      readoutCursor.nearestSeriesId = seriesId || "";
      var host = document.getElementById("tvInspector");
      var list = host.querySelector(".tv-inspector-list");
      host.querySelectorAll(".tv-inspector-row").forEach(function (row) {
        var on = row.dataset.seriesId === readoutCursor.nearestSeriesId;
        row.classList.toggle("is-nearest", on);
        if (!on || !list) return;
        var edge = row.offsetTop;
        var bottom = edge + row.offsetHeight;
        if (edge < list.scrollTop) list.scrollTop = edge;
        else if (bottom > list.scrollTop + list.clientHeight) list.scrollTop = bottom - list.clientHeight;
      });
      var plot = project.plots.find(function (item) { return item.id === readoutCursor.plotId; });
      var box = plot && paper.querySelector('.tv-plot[data-plot-id="' + plot.id + '"]');
      if (box && plot) updateOverlay(box, plot);
    }

    function moveReadoutSelection(delta) {
      var rows = Array.prototype.filter.call(document.querySelectorAll("#tvInspector .tv-inspector-row"), function (row) {
        return !row.hidden;
      });
      if (!rows.length || !readoutCursor) return;
      var index = 0;
      rows.forEach(function (row, i) {
        if (row.dataset.seriesId === readoutCursor.nearestSeriesId) index = i;
      });
      focusReadoutSeries(rows[Math.max(0, Math.min(rows.length - 1, index + delta))].dataset.seriesId);
    }

    function applyInspectorFilter() {
      var query = inspectorFilter.trim().toLowerCase();
      document.querySelectorAll("#tvInspector .tv-inspector-row").forEach(function (row) {
        var name = (row.dataset.name || "").toLowerCase();
        row.hidden = !!query && name.indexOf(query) < 0;
      });
    }

    function showInspector(plot, dataX, clientX, clientY, nearestSeriesId) {
      if (inspectorLocked) return;
      var host = document.getElementById("tvInspector");
      var column = host.parentElement.getBoundingClientRect();
      var rows = core.readPlotAtX(project, plot, dataX, cursorReadMode);
      var width = 280;
      var estimated = Math.min(360, 72 + Math.min(rows.length, 12) * 24);
      var left = clientX - column.left + 16;
      var top = clientY - column.top + 16;
      if (clientX + 20 + width > window.innerWidth - 8) left = clientX - column.left - width - 12;
      if (clientY + 20 + estimated > window.innerHeight - 12) top = clientY - column.top - estimated - 12;
      left = Math.max(8, Math.min(left, Math.max(8, column.width - width - 8)));

      if (cursorA && cursorB) {

    function bindPlotPointer(box, plot, handle) {

      function selectBox() {

      function openPlotFromCanvas(event) {
