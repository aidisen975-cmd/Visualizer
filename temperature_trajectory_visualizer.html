<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>温度轨迹可视化工具</title>
  <style>
    :root {
      --paper: #fbfbfa;
      --surface: #ffffff;
      --surface-2: #f5f6f5;
      --ink: #1d2024;
      --muted: #5d646b;
      --faint: #8b9299;
      --line: #d7dcde;
      --grid: #e4e7e8;
      --focus: #1e6eaa;
      --shadow: 0 12px 30px rgba(27, 34, 38, .08);
      --blue: #2477b6;
      --green: #25884d;
      --orange: #d36518;
      --purple: #6b52a8;
      --aux-black: #272b2e;
      --aux-red: #d14e3d;
      --aux-teal: #167b91;
      --radius: 5px;
    }
    [data-theme="dark"] {
      --paper: #15191b;
      --surface: #1b2023;
      --surface-2: #242a2e;
      --ink: #f1f3f1;
      --muted: #bcc3c4;
      --faint: #889395;
      --line: #354045;
      --grid: #2b3438;
      --focus: #75b8e7;
      --shadow: 0 12px 32px rgba(0, 0, 0, .22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Aptos", "Helvetica Neue", "Noto Sans SC", "PingFang SC", sans-serif;
      font-size: 15px;
      text-rendering: optimizeLegibility;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .tv-shell {
      min-height: 100vh;
      padding: clamp(16px, 2.4vw, 42px);
      background: var(--paper);
    }
    .tv-header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      max-width: 1800px;
      margin: 0 auto 20px;
    }
    .tv-kicker {
      margin: 0 0 5px;
      color: var(--focus);
      font: 600 11px/1.2 "SFMono-Regular", "Cascadia Mono", "Noto Sans Mono", monospace;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    .tv-header h1 {
      margin-bottom: 7px;
      font-size: clamp(25px, 3vw, 38px);
      line-height: 1;
      font-weight: 720;
      letter-spacing: -.045em;
      text-wrap: pretty;
    }
    .tv-subtitle {
      max-width: 820px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      text-wrap: pretty;
    }
    .tv-status {
      flex: 0 1 370px;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .tv-status[data-tone="error"] { border-color: #c66d61; color: #aa3f34; }
    .tv-status[data-tone="ok"] { border-color: #7ba88d; color: #35694b; }
    .tv-toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1.45fr) repeat(3, minmax(112px, auto)) auto;
      align-items: stretch;
      gap: 9px;
      max-width: 1800px;
      margin: 0 auto 16px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .tv-file-button, .tv-button, .tv-select, .tv-title-input {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
    }
    .tv-file-button {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 7px 11px;
      cursor: pointer;
      border-style: dashed;
      transition: border-color 160ms ease, background 160ms ease;
    }
    .tv-file-button:hover, .tv-file-button:focus-within { border-color: var(--focus); background: var(--surface-2); }
    .tv-file-button input { display: none; }
    .tv-file-stamp {
      display: grid;
      place-items: center;
      flex: 0 0 28px;
      height: 28px;
      border: 1px solid currentColor;
      border-radius: 3px;
      color: var(--focus);
      font: 700 10px/1 "SFMono-Regular", "Cascadia Mono", monospace;
    }
    .tv-file-button strong, .tv-control label {
      display: block;
      font-size: 12px;
      font-weight: 680;
      line-height: 1.25;
    }
    .tv-file-button small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
    }
    .tv-control {
      min-width: 112px;
      padding: 4px 3px 0;
    }
    .tv-control label { margin: 0 0 4px 4px; color: var(--muted); font-size: 10px; font-weight: 620; }
    .tv-select {
      width: 100%;
      padding: 0 8px;
      color: var(--ink);
      cursor: pointer;
    }
    .tv-button {
      padding: 0 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }
    .tv-button:hover { border-color: var(--focus); background: var(--surface-2); }
    .tv-button:active { transform: translateY(1px); }
    .tv-button:focus-visible, .tv-select:focus-visible, .tv-title-input:focus-visible, .tv-legend-button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .tv-button--primary { border-color: var(--focus); background: var(--focus); color: white; }
    .tv-button--primary:hover { background: #155d91; color: white; }
    .tv-controls {
      display: flex;
      gap: 9px;
      align-items: stretch;
    }
    .tv-dataset-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 1800px;
      min-height: 0;
      margin: 0 auto 14px;
    }
    .tv-dataset-chip {
      display: grid;
      grid-template-columns: auto minmax(80px, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 5px 6px 5px 9px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .tv-dataset-chip[data-primary="true"] { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
    .tv-chip-index {
      color: var(--faint);
      font: 600 10px/1 "SFMono-Regular", "Cascadia Mono", monospace;
    }
    .tv-chip-name { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 650; }
    .tv-chip-meta { color: var(--muted); font-size: 10px; }
    .tv-icon-button {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: 600 14px/1 sans-serif;
    }
    .tv-icon-button:hover { border-color: var(--line); color: var(--ink); background: var(--surface-2); }
    .tv-tweaks {
      max-width: 1800px;
      margin: 0 auto 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .tv-tweaks summary {
      padding: 10px 12px;
      color: var(--muted);
      cursor: pointer;
      font: 600 12px/1.1 "SFMono-Regular", "Cascadia Mono", "Noto Sans Mono", monospace;
      letter-spacing: .02em;
      user-select: none;
    }
    .tv-tweak-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
      padding: 0 12px 13px;
    }
    .tv-series-mapping {
      margin: 0 12px 13px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .tv-series-mapping summary {
      padding: 4px 0 9px;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 660;
    }
    .tv-series-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 8px;
      max-height: 310px;
      overflow: auto;
      padding: 1px 3px 3px 0;
    }
    .tv-series-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface-2);
    }
    .tv-series-row small {
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tv-series-row input {
      min-width: 0;
      min-height: 30px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
    }
    .tv-workspace { max-width: 1800px; margin: 0 auto; }
    .tv-empty {
      display: grid;
      place-items: center;
      min-height: min(62vh, 600px);
      padding: 30px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--surface);
      text-align: center;
    }
    .tv-empty-box { max-width: 530px; }
    .tv-empty-mark {
      width: 62px;
      height: 36px;
      margin: 0 auto 20px;
      border-bottom: 2px solid var(--blue);
      background:
        linear-gradient(140deg, transparent 17%, var(--blue) 18% 20%, transparent 21% 35%, var(--green) 36% 38%, transparent 39% 52%, var(--orange) 53% 55%, transparent 56% 71%, var(--purple) 72% 74%, transparent 75%);
    }
    .tv-empty h2 { margin-bottom: 10px; font-size: 22px; letter-spacing: -.025em; }
    .tv-empty p { margin-bottom: 18px; color: var(--muted); line-height: 1.65; text-wrap: pretty; }
    .tv-empty code { padding: 2px 4px; border-radius: 3px; background: var(--surface-2); font-size: .9em; }
    .tv-primary-wrap { margin-bottom: 20px; }
    .tv-figure {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .tv-figure-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px 10px;
    }
    .tv-figure-header h2 { margin: 0 0 3px; font-size: 17px; line-height: 1.2; letter-spacing: -.02em; }
    .tv-figure-header p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .tv-title-input {
      width: min(320px, 38vw);
      padding: 0 9px;
      color: var(--ink);
      font-size: 12px;
    }
    .tv-composite {
      display: grid;
      grid-template-columns: minmax(0, 1.86fr) minmax(420px, 1fr);
      gap: 0;
      align-items: stretch;
    }
    .tv-overview-panel { border-right: 1px solid var(--line); }
    .tv-group-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: start;
    }
    .tv-group-grid .tv-chart-panel:nth-child(odd) { border-right: 1px solid var(--line); }
    .tv-group-grid .tv-chart-panel:nth-child(n+3) { border-top: 1px solid var(--line); }
    .tv-chart-panel { position: relative; min-width: 0; padding: 13px 14px 10px; }
    .tv-chart-panel--overview { padding: 16px 18px 14px; }
    .tv-chart-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      min-height: 30px;
    }
    .tv-chart-heading h3 {
      margin: 0;
      font-size: 13px;
      line-height: 1.25;
      letter-spacing: -.015em;
    }
    .tv-chart-heading p { margin: 3px 0 0; color: var(--muted); font-size: 10px; }
    .tv-panel-letter { color: var(--faint); font: 700 12px/1 "SFMono-Regular", "Cascadia Mono", monospace; }
    .tv-svg-wrap { position: relative; min-width: 0; }
    .tv-chart-svg { display: block; width: 100%; height: auto; overflow: visible; }
    .tv-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      margin: 7px 0 1px;
      min-height: 22px;
    }
    .tv-legend-button {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      padding: 1px 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 10px;
      line-height: 1.25;
      text-align: left;
    }
    .tv-legend-button[aria-pressed="false"] { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1px; }
    .tv-legend-dot { width: 13px; height: 2px; flex: 0 0 auto; background: currentColor; }
    .tv-tooltip {
      position: absolute;
      z-index: 3;
      max-width: 260px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      box-shadow: 0 6px 14px rgba(0, 0, 0, .10);
      color: var(--ink);
      font: 11px/1.42 "SFMono-Regular", "Cascadia Mono", "Noto Sans Mono", monospace;
      pointer-events: none;
      opacity: 0;
      transform: translate(7px, -100%);
      transition: opacity 100ms linear;
    }
    .tv-tooltip[data-active="true"] { opacity: 1; }
    .tv-secondary-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      margin: 24px 0 10px;
    }
    .tv-secondary-heading h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .tv-secondary-heading p { margin: 0; color: var(--muted); font-size: 12px; }
    .tv-secondary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
      gap: 13px;
    }
    .tv-secondary-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      box-shadow: 0 6px 18px rgba(27, 34, 38, .05);
    }
    .tv-secondary-card .tv-chart-panel { padding: 13px; }
    .tv-secondary-card .tv-chart-heading { min-height: 37px; }
    .tv-secondary-card .tv-chart-heading h3 { max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tv-secondary-actions { display: flex; gap: 5px; }
    .tv-secondary-actions .tv-button { min-height: 28px; padding: 0 7px; font-size: 10px; }
    .tv-note { margin: 10px 2px 0; color: var(--faint); font-size: 11px; line-height: 1.5; }
    @media (max-width: 1279px) {
      .tv-toolbar { grid-template-columns: minmax(230px, 1fr) repeat(3, minmax(105px, auto)); }
      .tv-toolbar .tv-controls { grid-column: 1 / -1; }
      .tv-composite { grid-template-columns: 1fr; }
      .tv-overview-panel { border-right: 0; border-bottom: 1px solid var(--line); }
    }
    @media (max-width: 767px) {
      .tv-shell { padding: 14px; }
      .tv-header { display: block; }
      .tv-header h1 { font-size: 28px; }
      .tv-status { margin-top: 13px; }
      .tv-toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tv-file-button, .tv-toolbar .tv-controls { grid-column: 1 / -1; }
      .tv-controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tv-controls .tv-button { width: 100%; }
      .tv-tweak-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tv-figure-header { display: block; }
      .tv-title-input { width: 100%; margin-top: 10px; }
      .tv-group-grid { grid-template-columns: 1fr; }
      .tv-group-grid .tv-chart-panel:nth-child(odd) { border-right: 0; }
      .tv-group-grid .tv-chart-panel:not(:first-child) { border-top: 1px solid var(--line); }
      .tv-chart-panel--overview { padding: 14px 10px 12px; }
      .tv-chart-panel { padding: 12px 10px; }
      .tv-dataset-chip { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main id="temperatureTool" data-temperature-visualizer aria-label="温度轨迹可视化工具"></main>
  <script>
  (function () {
    "use strict";

    var DEFAULT_GROUPS = [
      { id: "group-1", label: "T1–T7", start: 1, end: 7, color: "#2477b6" },
      { id: "group-2", label: "T8–T22", start: 8, end: 22, color: "#25884d" },
      { id: "group-3", label: "T23–T37", start: 23, end: 37, color: "#d36518" },
      { id: "group-4", label: "T38–T52", start: 38, end: 52, color: "#6b52a8" }
    ];
    var AUXILIARY_COLORS = ["#272b2e", "#d14e3d", "#167b91", "#8b5a9d"];
    var METRIC_COLORS = ["#b7473b", "#2477b6", "#25884d", "#6b52a8"];
    var TIME_IN_SECONDS = { s: 1, min: 60, h: 3600 };
    var TIME_LABELS = { s: "s", min: "min", h: "h" };
    var svgNamespace = "http://www.w3.org/2000/svg";

    function makeId(prefix) {
      return prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }

    function clamp(value, low, high) {
      return Math.max(low, Math.min(high, value));
    }

    function finiteNumber(value, message) {
      var number = Number(value);
      if (!Number.isFinite(number)) throw new Error(message);
      return number;
    }

    function normalizeHeader(value) {
      return String(value || "").replace(/^\uFEFF/, "").trim().toLowerCase().replace(/[\s_:\-]/g, "");
    }

    function isTimeHeader(header) {
      var normalized = normalizeHeader(header);
      return normalized === "time" || normalized === "times" || normalized === "times" || normalized === "time(s)" || normalized === "times" || normalized === "时间";
    }

    function sensorIdFromHeader(header) {
      var match = String(header || "").match(/(?:^|[^a-z0-9])t\s*(\d+)(?!\d)/i);
      return match ? Number(match[1]) : null;
    }

    function readableAuxiliaryLabel(header) {
      var label = String(header).replace(/^\uFEFF/, "").trim();
      label = label.split(/\s+Monitor\b/i)[0].trim();
      label = label.replace(/\s*\([^)]*\)\s*$/, "").trim();
      return label || "Auxiliary temperature";
    }

    function parseCsv(text) {
      var rows = [];
      var row = [];
      var field = "";
      var quoted = false;
      var source = String(text || "");
      for (var index = 0; index < source.length; index += 1) {
        var character = source[index];
        if (quoted) {
          if (character === '"' && source[index + 1] === '"') {
            field += '"';
            index += 1;
          } else if (character === '"') {
            quoted = false;
          } else {
            field += character;
          }
        } else if (character === '"') {
          quoted = true;
        } else if (character === ",") {
          row.push(field);
          field = "";
        } else if (character === "\n" || character === "\r") {
          if (character === "\r" && source[index + 1] === "\n") index += 1;
          row.push(field);
          if (row.some(function (item) { return item.trim() !== ""; })) rows.push(row);
          row = [];
          field = "";
        } else {
          field += character;
        }
      }
      if (quoted) throw new Error("CSV 引号未闭合。");
      row.push(field);
      if (row.some(function (item) { return item.trim() !== ""; })) rows.push(row);
      if (rows.length < 2) throw new Error("CSV 至少需要一行表头和一行数值数据。");
      return rows;
    }

    function groupForSensor(sensorId, groups) {
      return groups.find(function (group) {
        return sensorId >= Number(group.start) && sensorId <= Number(group.end);
      }) || null;
    }

    function sensorColor(sensorId, group) {
      var base = group ? group.color : "#5d646b";
      var lightness = 46 + (sensorId % 7) * 5;
      var hueMap = {
        "#2477b6": "hsl(205, 68%, " + lightness + "%)",
        "#25884d": "hsl(140, 57%, " + lightness + "%)",
        "#d36518": "hsl(26, 74%, " + lightness + "%)",
        "#6b52a8": "hsl(257, 41%, " + lightness + "%)"
      };
      return hueMap[base] || base;
    }

    function parseDatasetFromCsv(text, options) {
      var rows = parseCsv(text);
      var headers = rows[0].map(function (header) { return String(header).replace(/^\uFEFF/, "").trim(); });
      var timeIndex = headers.findIndex(isTimeHeader);
      var name = options && options.name ? options.name : "导入数据";
      var groups = (options && options.groups) || DEFAULT_GROUPS;
      if (timeIndex < 0) throw new Error(name + " 缺少 time、time_s 或 时间列。");
      var sensorColumns = [];
      var auxiliaryColumns = [];
      var seenSensors = new Set();
      headers.forEach(function (header, columnIndex) {
        if (columnIndex === timeIndex) return;
        var sensorId = sensorIdFromHeader(header);
        if (sensorId !== null) {
          if (seenSensors.has(sensorId)) throw new Error(name + " 包含重复传感器列 T" + sensorId + "。");
          seenSensors.add(sensorId);
          sensorColumns.push({ columnIndex: columnIndex, sensorId: sensorId });
          return;
        }
        var lower = header.toLowerCase();
        if (header.indexOf("温度") >= 0 || header.indexOf("温差") >= 0 || lower.indexOf("temperature") >= 0 || lower.indexOf("delta") >= 0 || lower.indexOf("deltat") >= 0 || lower.indexOf("°c") >= 0 || lower.indexOf("(c)") >= 0) {
          auxiliaryColumns.push({
            columnIndex: columnIndex,
            label: readableAuxiliaryLabel(header)
          });
        }
      });
      if (!sensorColumns.length && !auxiliaryColumns.length) {
        throw new Error(name + " 没有识别到 T1…TN 传感器列，也没有识别到温度、温差或 delta 数值列。");
      }
      auxiliaryColumns.forEach(function (column) {
        column.kind = sensorColumns.length ? "auxiliary" : "metric";
      });
      sensorColumns.sort(function (left, right) { return left.sensorId - right.sensorId; });
      var times = [];
      var bySensor = new Map();
      var byAuxiliary = new Map();
      sensorColumns.forEach(function (column) { bySensor.set(column.sensorId, []); });
      auxiliaryColumns.forEach(function (column, index) { byAuxiliary.set(index, []); });
      for (var rowIndex = 1; rowIndex < rows.length; rowIndex += 1) {
        var row = rows[rowIndex];
        var time = finiteNumber(row[timeIndex], name + " 第 " + (rowIndex + 1) + " 行时间无效。");
        if (times.length && time <= times[times.length - 1]) {
          throw new Error(name + " 第 " + (rowIndex + 1) + " 行时间必须严格递增，且不能重复。");
        }
        times.push(time);
        sensorColumns.forEach(function (column) {
          bySensor.get(column.sensorId).push(finiteNumber(
            row[column.columnIndex],
            name + " 第 " + (rowIndex + 1) + " 行 T" + column.sensorId + " 无效。"
          ));
        });
        auxiliaryColumns.forEach(function (column, auxIndex) {
          byAuxiliary.get(auxIndex).push(finiteNumber(
            row[column.columnIndex],
            name + " 第 " + (rowIndex + 1) + " 行 " + column.label + " 无效。"
          ));
        });
      }
      var auxiliaryLabels = new Set();
      var series = sensorColumns.map(function (column) {
        var group = groupForSensor(column.sensorId, groups);
        return {
          id: "T" + column.sensorId,
          label: "T" + column.sensorId,
          values: bySensor.get(column.sensorId),
          kind: "sensor",
          groupId: group ? group.id : "ungrouped",
          color: sensorColor(column.sensorId, group)
        };
      });
      auxiliaryColumns.forEach(function (column, auxIndex) {
        var label = column.label;
        var suffix = 2;
        while (auxiliaryLabels.has(label)) {
          label = column.label + " " + suffix;
          suffix += 1;
        }
        auxiliaryLabels.add(label);
        series.push({
          id: "aux-" + (auxIndex + 1),
          label: label,
          sourceLabel: label,
          values: byAuxiliary.get(auxIndex),
          kind: column.kind,
          color: column.kind === "metric" ? METRIC_COLORS[auxIndex % METRIC_COLORS.length] : AUXILIARY_COLORS[auxIndex % AUXILIARY_COLORS.length]
        });
      });
      return normalizeDataset({
        id: options && options.id ? options.id : makeId("dataset"),
        name: name.replace(/\.[^.]+$/, ""),
        time: times,
        timeUnit: (options && options.timeUnit) || "s",
        series: series
      }, groups);
    }

    function normalizeDataset(dataset, groups) {
      if (!dataset || typeof dataset !== "object") throw new Error("数据组必须是对象。");
      var time = Array.isArray(dataset.time) ? dataset.time : (dataset.time && dataset.time.values);
      if (!Array.isArray(time) || time.length < 2) throw new Error("数据组必须提供至少两个时间点。");
      var normalizedTime = time.map(function (item, index) {
        return finiteNumber(item, "时间索引 " + index + " 无效。");
      });
      for (var index = 1; index < normalizedTime.length; index += 1) {
        if (normalizedTime[index] <= normalizedTime[index - 1]) throw new Error("时间必须严格递增，且不能重复。");
      }
      if (!Array.isArray(dataset.series) || !dataset.series.length) throw new Error("数据组至少需要一条曲线。");
      var ids = new Set();
      var sensorCount = 0;
      var normalizedSeries = dataset.series.map(function (rawSeries, seriesIndex) {
        var id = String(rawSeries.id || rawSeries.label || "series-" + seriesIndex);
        if (ids.has(id)) throw new Error("曲线 ID 重复：" + id + "。");
        ids.add(id);
        var kind = rawSeries.kind === "auxiliary" ? "auxiliary" : rawSeries.kind === "metric" ? "metric" : "sensor";
        var values = rawSeries.values;
        if (!Array.isArray(values) || values.length !== normalizedTime.length) {
          throw new Error("曲线 " + id + " 的长度必须与时间轴一致。");
        }
        var label = String(rawSeries.label || id);
        var sensorId = sensorIdFromHeader(id) || sensorIdFromHeader(label);
        var group = kind === "sensor" && sensorId !== null ? groupForSensor(sensorId, groups) : null;
        if (kind === "sensor") sensorCount += 1;
        return {
          id: id,
          label: label,
          sourceLabel: String(rawSeries.sourceLabel || label),
          values: values.map(function (value, valueIndex) {
            return finiteNumber(value, "曲线 " + label + " 在索引 " + valueIndex + " 处无效。");
          }),
          kind: kind,
          groupId: rawSeries.groupId || (group ? group.id : kind === "sensor" ? "ungrouped" : null),
          color: rawSeries.color || (kind === "sensor" ? sensorColor(sensorId || seriesIndex + 1, group) : kind === "metric" ? METRIC_COLORS[seriesIndex % METRIC_COLORS.length] : AUXILIARY_COLORS[seriesIndex % AUXILIARY_COLORS.length])
        };
      });
      return {
        id: String(dataset.id || makeId("dataset")),
        name: String(dataset.name || "未命名数据组"),
        time: normalizedTime,
        timeUnit: dataset.timeUnit || (dataset.time && dataset.time.unit) || "s",
        series: normalizedSeries
      };
    }

    function convertTimes(dataset, displayUnit) {
      var sourceFactor = TIME_IN_SECONDS[dataset.timeUnit] || 1;
      var targetFactor = TIME_IN_SECONDS[displayUnit] || 1;
      return dataset.time.map(function (time) { return time * sourceFactor / targetFactor; });
    }

    function createSvg(name, attributes) {
      var element = document.createElementNS(svgNamespace, name);
      Object.keys(attributes || {}).forEach(function (key) { element.setAttribute(key, String(attributes[key])); });
      return element;
    }

    function appendSvg(parent, name, attributes, content) {
      var element = createSvg(name, attributes);

      parent.appendChild(element);
      return element;
    }

    function cssValue(root, property) {
      return getComputedStyle(root).getPropertyValue(property).trim();
    }

    function chartTheme(root) {
      return {
        surface: cssValue(root, "--surface"),
        ink: cssValue(root, "--ink"),
        muted: cssValue(root, "--muted"),
        line: cssValue(root, "--line"),
        grid: cssValue(root, "--grid")
      };
    }

    function extent(series) {
      var low = Infinity;
      var high = -Infinity;
      series.forEach(function (item) {
        item.values.forEach(function (value) {
          if (value < low) low = value;
          if (value > high) high = value;
        });
      });
      if (!Number.isFinite(low) || !Number.isFinite(high)) return [0, 1];
      if (low === high) {
        var fallback = Math.max(Math.abs(low) * .04, 1);
        return [low - fallback, high + fallback];
      }
      var padding = (high - low) * .045;
      return [low - padding, high + padding];
    }

    function niceStep(rawStep) {
      var power = Math.pow(10, Math.floor(Math.log10(rawStep)));
      var fraction = rawStep / power;
      var nice = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10;
      return nice * power;
    }

    function ticks(low, high, count) {
      var step = niceStep((high - low) / Math.max(1, count - 1));
      var first = Math.ceil(low / step) * step;
      var results = [];
      for (var value = first; value <= high + step * .2; value += step) results.push(value);
      return results.length ? results : [low, high];
    }

    function compactNumber(value) {
      var abs = Math.abs(value);
      if (abs >= 100 || abs === 0) return value.toFixed(0);
      if (abs >= 10) return value.toFixed(1);
      return value.toFixed(2);
    }

    function seriesSubset(dataset, predicate) {
      return dataset.series.filter(predicate);
    }

    function visibleSeries(context, dataset, series) {
      var hidden = context.hidden.get(dataset.id) || new Set();
      return series.filter(function (item) { return !hidden.has(item.id); });
    }

    function downsampleIndexes(length, maximum) {
      if (length <= maximum) return null;
      var indexes = [0];
      var step = (length - 1) / (maximum - 1);
      for (var index = 1; index < maximum - 1; index += 1) indexes.push(Math.round(index * step));
      indexes.push(length - 1);
      return Array.from(new Set(indexes));
    }

    function linePath(times, values, xScale, yScale, maximum) {
      var indexes = downsampleIndexes(times.length, maximum);
      var path = "";
      var previous = -1;
      var count = indexes || Array.from({ length: times.length }, function (_, index) { return index; });
      count.forEach(function (index) {
        if (index === previous) return;
        previous = index;
        path += (path ? "L" : "M") + xScale(times[index]).toFixed(2) + "," + yScale(values[index]).toFixed(2);
      });
      return path;
    }

    function nearestIndex(values, target) {
      var low = 0;
      var high = values.length - 1;
      while (low < high) {
        var middle = Math.floor((low + high) / 2);
        if (values[middle] < target) low = middle + 1;
        else high = middle;
      }
      if (low > 0 && Math.abs(values[low - 1] - target) < Math.abs(values[low] - target)) return low - 1;
      return low;
    }

    function buildChartSvg(root, context, dataset, chartOptions) {
      var compact = chartOptions.compact;
      var width = compact ? 620 : chartOptions.isGroup ? 480 : 920;
      var height = compact ? 255 : chartOptions.isGroup ? 265 : (context.options.density === "compact" ? 360 : 470);
      var margin = compact ? { top: 14, right: 13, bottom: 37, left: 46 } : { top: 18, right: 18, bottom: 46, left: 56 };
      var plotWidth = width - margin.left - margin.right;
      var plotHeight = height - margin.top - margin.bottom;
      var theme = chartTheme(root);
      var allSeries = chartOptions.series;
      var displayTimes = convertTimes(dataset, context.options.displayTimeUnit);
      var xExtent = [displayTimes[0], displayTimes[displayTimes.length - 1]];
      var yExtent = chartOptions.yExtent || extent(allSeries);
      var xScale = function (value) { return margin.left + (value - xExtent[0]) / (xExtent[1] - xExtent[0] || 1) * plotWidth; };
      var yScale = function (value) { return margin.top + (yExtent[1] - value) / (yExtent[1] - yExtent[0] || 1) * plotHeight; };
      var svg = createSvg("svg", {
        class: "tv-chart-svg",
        viewBox: "0 0 " + width + " " + height,
        role: "img",
        "aria-label": chartOptions.title + " 温度折线图",
        xmlns: svgNamespace
      });
      appendSvg(svg, "rect", { x: 0, y: 0, width: width, height: height, fill: theme.surface });
      var yTicks = ticks(yExtent[0], yExtent[1], compact ? 4 : 5);
      yTicks.forEach(function (tick) {
        var y = yScale(tick);
        appendSvg(svg, "line", { x1: margin.left, y1: y, x2: width - margin.right, y2: y, stroke: theme.grid, "stroke-width": 1 });
        appendSvg(svg, "text", {
          x: margin.left - 8, y: y + 3.5, fill: theme.muted, "font-size": compact ? 9 : 10,
          "text-anchor": "end", "font-family": "Aptos, Helvetica Neue, Noto Sans SC, sans-serif"
        }, compactNumber(tick));
      });
      var xTicks = ticks(xExtent[0], xExtent[1], compact ? 4 : 5);
      xTicks.forEach(function (tick) {
        var x = xScale(tick);
        appendSvg(svg, "line", { x1: x, y1: height - margin.bottom, x2: x, y2: height - margin.bottom + 4, stroke: theme.line, "stroke-width": 1 });
        appendSvg(svg, "text", {
          x: x, y: height - margin.bottom + 16, fill: theme.muted, "font-size": compact ? 9 : 10,
          "text-anchor": "middle", "font-family": "Aptos, Helvetica Neue, Noto Sans SC, sans-serif"
        }, compactNumber(tick));
      });
      appendSvg(svg, "line", { x1: margin.left, y1: margin.top, x2: margin.left, y2: height - margin.bottom, stroke: theme.ink, "stroke-width": 1.1 });
      appendSvg(svg, "line", { x1: margin.left, y1: height - margin.bottom, x2: width - margin.right, y2: height - margin.bottom, stroke: theme.ink, "stroke-width": 1.1 });
      appendSvg(svg, "text", {
        x: margin.left + plotWidth / 2, y: height - 5, fill: theme.ink, "font-size": compact ? 9 : 10,
        "text-anchor": "middle", "font-family": "Aptos, Helvetica Neue, Noto Sans SC, sans-serif"
      }, "Time (" + TIME_LABELS[context.options.displayTimeUnit] + ")");
      if (!compact || chartOptions.isGroup) {
        var yLabel = appendSvg(svg, "text", {
          x: 12, y: margin.top + plotHeight / 2, fill: theme.ink, "font-size": compact ? 9 : 10,
          "text-anchor": "middle", transform: "rotate(-90 12 " + (margin.top + plotHeight / 2) + ")",
          "font-family": "Aptos, Helvetica Neue, Noto Sans SC, sans-serif"
        }, chartOptions.yAxisLabel || (allSeries.every(function (series) { return series.kind === "metric"; }) ? "Temperature difference (°C)" : "Temperature (°C)"));
        yLabel.setAttribute("letter-spacing", ".01em");
      }
      var visible = visibleSeries(context, dataset, allSeries);
      visible.forEach(function (series) {
        appendSvg(svg, "path", {
          d: linePath(displayTimes, series.values, xScale, yScale, compact ? 650 : 1450),
          fill: "none",
          stroke: series.color,
          "stroke-width": series.kind === "auxiliary" || series.kind === "metric" ? (compact ? 1.4 : 1.8) : (compact ? 1.15 : 1.5),
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
          opacity: series.kind === "auxiliary" || series.kind === "metric" ? .98 : .84
        });
      });
      if (!chartOptions.interactive) return svg;
      var crosshair = appendSvg(svg, "line", {
        x1: margin.left, y1: margin.top, x2: margin.left, y2: height - margin.bottom,
        stroke: theme.ink, "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0, "pointer-events": "none"
      });
      var hitArea = appendSvg(svg, "rect", {
        x: margin.left, y: margin.top, width: plotWidth, height: plotHeight,
        fill: "transparent", "pointer-events": "all"
      });
      hitArea.addEventListener("pointermove", function (event) {
        var rect = svg.getBoundingClientRect();
        var pointerX = (event.clientX - rect.left) / rect.width * width;
        var timeValue = xExtent[0] + (pointerX - margin.left) / plotWidth * (xExtent[1] - xExtent[0]);
        var index = nearestIndex(displayTimes, timeValue);
        var x = xScale(displayTimes[index]);
        crosshair.setAttribute("x1", x);
        crosshair.setAttribute("x2", x);
        crosshair.setAttribute("opacity", "1");
        chartOptions.onTooltip({
          index: index,
          x: clamp((x / width) * 100, 8, 92),
          y: clamp((yScale(visible.length ? visible[0].values[index] : yExtent[0]) / height) * 100, 10, 90),
          time: displayTimes[index],
          series: visible
        });
      });
      hitArea.addEventListener("pointerleave", function () {
        crosshair.setAttribute("opacity", "0");
        chartOptions.onTooltip(null);
      });
      return svg;
    }

    function makeLegend(root, context, dataset, allSeries, grouped) {
      var legend = document.createElement("div");
      legend.className = "tv-legend";
      var entries = grouped ? context.options.groups.filter(function (group) {
        return allSeries.some(function (series) { return series.groupId === group.id; });
      }).map(function (group) {
        return {
          id: group.id,
          label: group.label,
          color: group.color,
          series: allSeries.filter(function (series) { return series.groupId === group.id; })
        };
      }) : allSeries.map(function (series) {
        return { id: series.id, label: series.label, color: series.color, series: [series] };
      });
      var auxiliaries = grouped ? allSeries.filter(function (series) { return series.kind !== "sensor"; }) : [];
      auxiliaries.forEach(function (series) { entries.push({ id: series.id, label: series.label, color: series.color, series: [series] }); });
      entries.forEach(function (entry) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "tv-legend-button";
        var hidden = context.hidden.get(dataset.id) || new Set();
        var isVisible = entry.series.some(function (series) { return !hidden.has(series.id); });
        button.setAttribute("aria-pressed", String(isVisible));
        var dot = document.createElement("span");
        dot.className = "tv-legend-dot";
        dot.style.color = entry.color;
        var text = document.createElement("span");
        text.textContent = entry.label;
        button.append(dot, text);
        button.addEventListener("click", function () {
          var current = context.hidden.get(dataset.id) || new Set();
          var show = entry.series.every(function (series) { return current.has(series.id); });
          entry.series.forEach(function (series) {
            if (show) current.delete(series.id);
            else current.add(series.id);
          });
          context.hidden.set(dataset.id, current);
          context.rerender();
        });
        legend.appendChild(button);
      });
      return legend;
    }

    function makeChartPanel(root, context, dataset, panelOptions) {
      var panel = document.createElement("section");
      panel.className = "tv-chart-panel" + (panelOptions.overview ? " tv-chart-panel--overview" : "");
      var heading = document.createElement("div");
      heading.className = "tv-chart-heading";
      var titleBlock = document.createElement("div");
      var title = document.createElement("h3");
      title.textContent = panelOptions.title;
      var meta = document.createElement("p");
      meta.textContent = panelOptions.meta;
      titleBlock.append(title, meta);
      heading.appendChild(titleBlock);
      if (panelOptions.letter) {
        var letter = document.createElement("span");
        letter.className = "tv-panel-letter";
        letter.textContent = panelOptions.letter;
        heading.appendChild(letter);
      }
      panel.appendChild(heading);
      var wrap = document.createElement("div");
      wrap.className = "tv-svg-wrap";
      var tooltip = document.createElement("div");
      tooltip.className = "tv-tooltip";
      tooltip.setAttribute("data-active", "false");
      var svg = buildChartSvg(root, context, dataset, {
        title: panelOptions.title,
        series: panelOptions.series,
        yExtent: panelOptions.yExtent,
        yAxisLabel: panelOptions.yAxisLabel,
        isGroup: panelOptions.isGroup,
        compact: panelOptions.compact,
        interactive: true,
        onTooltip: function (payload) {

            tooltip.setAttribute("data-active", "false");
            return;
          }
          var lines = payload.series.slice(0, 6).map(function (series) {
            return series.label + " " + compactNumber(series.values[payload.index]) + " °C";
          });
          if (payload.series.length > 6) lines.push("… " + (payload.series.length - 6) + " additional curves");
          tooltip.innerHTML = "t = " + compactNumber(payload.time) + " " + TIME_LABELS[context.options.displayTimeUnit] + "<br>" + lines.join("<br>");
          tooltip.style.left = payload.x + "%";
          tooltip.style.top = payload.y + "%";

      panel.appendChild(wrap);

    function sensorExtent(dataset) {
      return extent(seriesSubset(dataset, function (series) { return series.kind === "sensor"; }));
    }

    function renderComposite(root, context, dataset) {
      var figure = document.createElement("article");
      figure.className = "tv-figure";
      var header = document.createElement("div");
      header.className = "tv-figure-header";
      var headerText = document.createElement("div");
      var title = document.createElement("h2");
      title.textContent = dataset.name;
      var sensorCount = dataset.series.filter(function (series) { return series.kind === "sensor"; }).length;
      var auxiliaryCount = dataset.series.filter(function (series) { return series.kind === "auxiliary"; }).length;
      var metricCount = dataset.series.filter(function (series) { return series.kind === "metric"; }).length;
      var subtitle = document.createElement("p");
      var displayedTimes = convertTimes(dataset, context.options.displayTimeUnit);
      subtitle.textContent = sensorCount ?
        sensorCount + " 个温度传感器" + (auxiliaryCount ? " + " + auxiliaryCount + " 个辅助温度通道" : "") + " · " + compactNumber(displayedTimes[0]) + "–" + compactNumber(displayedTimes[displayedTimes.length - 1]) + " " + TIME_LABELS[context.options.displayTimeUnit] :
        metricCount + " 条温差/数值曲线 · " + compactNumber(displayedTimes[0]) + "–" + compactNumber(displayedTimes[displayedTimes.length - 1]) + " " + TIME_LABELS[context.options.displayTimeUnit];
      headerText.append(title, subtitle);
      var titleInput = document.createElement("input");

        context.rerender();
      });
      header.append(headerText, titleInput);
      figure.appendChild(header);
      if (!sensorCount) {
        figure.appendChild(makeChartPanel(root, context, dataset, {
          title: metricCount === 1 ? dataset.series[0].label : "温差/数值曲线",
          meta: "已从 CSV 表头识别；可在 Tweaks 中修改显示名称。",
          letter: "Δ",
          series: dataset.series,
          overview: true,
          groupedLegend: false,
          yExtent: extent(dataset.series),
          yAxisLabel: "Temperature difference (°C)"
        }));
        return figure;
      }
      var composite = document.createElement("div");
      composite.className = "tv-composite";
      var overviewSeries = dataset.series;
      var overview = makeChartPanel(root, context, dataset, {
        title: "全部温度传感器" + (auxiliaryCount ? " + 辅助温度" : ""),
        meta: "颜色在总览图与其对应分组图中保持一致。",
        letter: "a",
        series: overviewSeries,
        overview: true,
        groupedLegend: true,
        yExtent: extent(overviewSeries)
      });
      overview.classList.add("tv-overview-panel");
      composite.appendChild(overview);
      var groupGrid = document.createElement("div");
      groupGrid.className = "tv-group-grid";
      var sharedExtent = sensorExtent(dataset);
      var letters = ["b", "c", "d", "e"];
      context.options.groups.forEach(function (group, index) {
        var groupSeries = dataset.series.filter(function (series) { return series.kind === "sensor" && series.groupId === group.id; });
        if (!groupSeries.length) return;
        groupGrid.appendChild(makeChartPanel(root, context, dataset, {
          title: group.label,
          meta: groupSeries.length + " 个传感器",
          letter: letters[index] || String(index + 2),
          series: groupSeries,
          isGroup: true,
          groupedLegend: false,
          yExtent: context.options.axisMode === "shared" ? sharedExtent : extent(groupSeries)
        }));
      });
      var ungrouped = dataset.series.filter(function (series) { return series.kind === "sensor" && series.groupId === "ungrouped"; });
      if (ungrouped.length) {
        groupGrid.appendChild(makeChartPanel(root, context, dataset, {
          title: "未分组测点",
          meta: ungrouped.length + " 个传感器",
          letter: "u",
          series: ungrouped,
          isGroup: true,
          groupedLegend: false,
          yExtent: context.options.axisMode === "shared" ? sharedExtent : extent(ungrouped)
        }));
      }
      composite.appendChild(groupGrid);
      figure.appendChild(composite);
      return figure;
    }

    function renderSecondary(root, context, dataset) {
      var card = document.createElement("article");
      card.className = "tv-secondary-card";
      var secondarySensorCount = dataset.series.filter(function (series) { return series.kind === "sensor"; }).length;
      var secondaryMetricCount = dataset.series.filter(function (series) { return series.kind === "metric"; }).length;
      var panel = makeChartPanel(root, context, dataset, {
        title: dataset.name,
        meta: secondarySensorCount ? secondarySensorCount + " 个传感器 · 总览摘要" : secondaryMetricCount + " 条温差/数值曲线 · 总览摘要",
        series: dataset.series,

      });
      var heading = panel.querySelector(".tv-chart-heading");
      var actions = document.createElement("div");
      actions.className = "tv-secondary-actions";
      var promote = document.createElement("button");
      promote.type = "button";
      promote.className = "tv-button tv-button--primary";
      promote.textContent = "设为主图";
      promote.addEventListener("click", function () {
        context.state.primaryId = dataset.id;

        var primaryWrap = root.querySelector(".tv-primary-wrap");
        if (primaryWrap) {
          window.scrollTo({
            top: Math.max(0, primaryWrap.getBoundingClientRect().top + window.scrollY - 16),
            behavior: "smooth"
          });
        }
      });
      var remove = document.createElement("button");
      remove.type = "button";
      remove.className = "tv-button";
      remove.textContent = "移除";
      remove.addEventListener("click", function () {
        context.removeDataset(dataset.id);
      });
      actions.append(promote, remove);
      heading.appendChild(actions);
      card.appendChild(panel);
      return card;
    }

    function exportSvgText(root, context, dataset) {
      var theme = chartTheme(root);
      var width = 1600;
      var height = 1050;
      var overview = buildChartSvg(root, context, dataset, {
        title: "All temperature sensors",
        series: dataset.series,
        yExtent: extent(dataset.series),
        compact: false,
        interactive: false
      });
      var groups = context.options.groups.map(function (group) {
        var series = dataset.series.filter(function (item) { return item.kind === "sensor" && item.groupId === group.id; });
        return { group: group, series: series };
      }).filter(function (item) { return item.series.length; });
      var panelPositions = [
        [1050, 85], [1325, 85], [1050, 530], [1325, 530]
      ];
      var nested = "<svg x=\"48\" y=\"104\" width=\"960\" height=\"900\" viewBox=\"" + overview.getAttribute("viewBox") + "\">" + overview.innerHTML + "</svg>";
      groups.slice(0, 4).forEach(function (item, index) {
        var svg = buildChartSvg(root, context, dataset, {
          title: item.group.label,
          series: item.series,
          yExtent: context.options.axisMode === "shared" ? sensorExtent(dataset) : extent(item.series),
          isGroup: true,
          compact: false,
          interactive: false
        });
        var point = panelPositions[index];
        nested += "<text x=\"" + point[0] + "\" y=\"" + (point[1] - 10) + "\" font-family=\"Aptos, Helvetica Neue, Noto Sans SC, sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"" + theme.ink + "\">" + item.group.label + "</text>";
        nested += "<svg x=\"" + point[0] + "\" y=\"" + point[1] + "\" width=\"240\" height=\"390\" viewBox=\"" + svg.getAttribute("viewBox") + "\">" + svg.innerHTML + "</svg>";
      });
      return "<?xml version=\"1.0\" encoding=\"UTF-8\"?>" +
        "<svg xmlns=\"" + svgNamespace + "\" width=\"" + width + "\" height=\"" + height + "\" viewBox=\"0 0 " + width + " " + height + "\">" +
        "<rect width=\"100%\" height=\"100%\" fill=\"" + theme.surface + "\"/>" +
        "<text x=\"48\" y=\"47\" font-family=\"Aptos, Helvetica Neue, Noto Sans SC, sans-serif\" font-size=\"30\" font-weight=\"700\" fill=\"" + theme.ink + "\">" + escapeXml(dataset.name) + ": temperature trajectories</text>" +
        "<text x=\"48\" y=\"75\" font-family=\"Aptos, Helvetica Neue, Noto Sans SC, sans-serif\" font-size=\"15\" fill=\"" + theme.muted + "\">Colours are identical in the overview and corresponding subgroup panels.</text>" +
        nested + "</svg>";
    }

    function escapeXml(value) {
      return String(value).replace(/[<>&'"]/g, function (character) {
        return { "<": "&lt;", ">": "&gt;", "&": "&amp;", "'": "&apos;", '"': "&quot;" }[character];
      });
    }

    function downloadBlob(blob, filename) {
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    function createContext(root, state, rerender) {
      return {
        state: state,
        options: state.options,
        hidden: state.hidden,
        rerender: rerender,
        removeDataset: function (id) {
          state.datasets = state.datasets.filter(function (dataset) { return dataset.id !== id; });
          state.hidden.delete(id);
          if (state.primaryId === id) state.primaryId = state.datasets.length ? state.datasets[0].id : null;
          rerender();
        }
      };
    }

    function mount(container, suppliedOptions) {
      var root = typeof container === "string" ? document.querySelector(container) : container;
      if (!root) throw new Error("TemperatureViz.mount 找不到容器。");
      var options = Object.assign({
        groups: DEFAULT_GROUPS.map(function (group) { return Object.assign({}, group); }),
        displayTimeUnit: "min",
        sourceTimeUnit: "s",
        axisMode: "shared",
        density: "roomy",
        theme: "light"
      }, suppliedOptions || {});
      options.groups = (suppliedOptions && suppliedOptions.groups ? suppliedOptions.groups : options.groups).map(function (group) {
        return Object.assign({}, group);
      });
      var state = { datasets: [], primaryId: null, options: options, hidden: new Map(), status: { text: "等待导入 CSV 数据。", tone: "" } };

      function setStatus(text, tone) {
        state.status = { text: text, tone: tone || "" };
        var status = root.querySelector(".tv-status");
        if (status) {
          status.textContent = text;
          status.setAttribute("data-tone", tone || "");
        }
      }

      function upsertDataset(rawDataset) {
        var dataset = normalizeDataset(rawDataset, state.options.groups);
        var existing = state.datasets.findIndex(function (item) { return item.id === dataset.id; });
        if (existing >= 0) state.datasets[existing] = dataset;
        else state.datasets.push(dataset);
        if (!state.primaryId || !state.datasets.some(function (item) { return item.id === state.primaryId; })) state.primaryId = dataset.id;
        state.hidden.set(dataset.id, new Set());
        setStatus("已载入 " + dataset.name + "： " + dataset.time.length + " 个时间点、" + dataset.series.length + " 条曲线。", "ok");
        render();
        return dataset;
      }

      function loadCsv(fileOrText, loadOptions) {
        var optionsForLoad = Object.assign({ timeUnit: state.options.sourceTimeUnit }, loadOptions || {});
        if (typeof fileOrText === "string") {
          return Promise.resolve(upsertDataset(parseDatasetFromCsv(fileOrText, {
            id: optionsForLoad.id,
            name: optionsForLoad.name || "导入数据",
            timeUnit: optionsForLoad.timeUnit,
            groups: state.options.groups
          })));
        }
        if (!fileOrText || typeof fileOrText.text !== "function") return Promise.reject(new Error("loadCsv 需要 CSV 字符串或浏览器 File。"));
        return fileOrText.text().then(function (text) {
          return upsertDataset(parseDatasetFromCsv(text, {
            id: optionsForLoad.id,
            name: optionsForLoad.name || fileOrText.name,
            timeUnit: optionsForLoad.timeUnit,
            groups: state.options.groups
          }));
        });
      }

      function resetCurves() {
        state.datasets.forEach(function (dataset) { state.hidden.set(dataset.id, new Set()); });
        setStatus("已恢复所有曲线。", "ok");
        render();
      }

      function exportCurrentSvg() {
        var dataset = state.datasets.find(function (item) { return item.id === state.primaryId; });
        if (!dataset) return setStatus("请先导入一组数据。", "error");
        var text = exportSvgText(root, createContext(root, state, render), dataset);
        downloadBlob(new Blob([text], { type: "image/svg+xml;charset=utf-8" }), sanitizeFilename(dataset.name) + "_temperature_trajectories.svg");
        setStatus("已导出当前主图 SVG。", "ok");
      }

      function exportCurrentPng() {
        var dataset = state.datasets.find(function (item) { return item.id === state.primaryId; });
        if (!dataset) return setStatus("请先导入一组数据。", "error");
        var text = exportSvgText(root, createContext(root, state, render), dataset);
        var image = new Image();
        var url = URL.createObjectURL(new Blob([text], { type: "image/svg+xml;charset=utf-8" }));
        image.onload = function () {
          var canvas = document.createElement("canvas");
          canvas.width = 2400;
          canvas.height = 1575;
          var drawing = canvas.getContext("2d");
          drawing.fillStyle = chartTheme(root).surface;
          drawing.fillRect(0, 0, canvas.width, canvas.height);
          drawing.drawImage(image, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(function (blob) {
            if (blob) downloadBlob(blob, sanitizeFilename(dataset.name) + "_temperature_trajectories.png");
            URL.revokeObjectURL(url);
            setStatus(blob ? "已导出当前主图 PNG。" : "PNG 导出失败。", blob ? "ok" : "error");
          }, "image/png");
        };
        image.onerror = function () {
          URL.revokeObjectURL(url);
          setStatus("PNG 导出失败。", "error");
        };
        image.src = url;
      }

      function sanitizeFilename(value) {
        return String(value || "temperature").replace(/[\\/:*?"<>|]/g, "_");
      }

      function renderDatasetStrip(context) {
        var strip = root.querySelector(".tv-dataset-strip");
        strip.replaceChildren();
        state.datasets.forEach(function (dataset, index) {
          var chip = document.createElement("article");
          chip.className = "tv-dataset-chip";
          chip.setAttribute("data-primary", String(dataset.id === state.primaryId));
          var chipIndex = document.createElement("span");
          chipIndex.className = "tv-chip-index";
          chipIndex.textContent = String(index + 1).padStart(2, "0");
          var copy = document.createElement("div");
          var name = document.createElement("div");
          name.className = "tv-chip-name";
          name.textContent = dataset.name;
          var meta = document.createElement("div");
          meta.className = "tv-chip-meta";
          var chipSensorCount = dataset.series.filter(function (series) { return series.kind === "sensor"; }).length;
          var chipMetricCount = dataset.series.filter(function (series) { return series.kind === "metric"; }).length;
          meta.textContent = dataset.time.length + " points · " + (chipSensorCount ? chipSensorCount + " sensors" : chipMetricCount + " ΔT series");
          copy.append(name, meta);
          var primary = document.createElement("button");
          primary.type = "button";
          primary.className = "tv-icon-button";
          primary.title = dataset.id === state.primaryId ? "当前主图" : "设为主图";
          primary.setAttribute("aria-label", primary.title);
          primary.textContent = dataset.id === state.primaryId ? "●" : "○";
          primary.addEventListener("click", function () {
            state.primaryId = dataset.id;
            setStatus("已将 " + dataset.name + " 设为主图。", "ok");
            render();
          });
          var remove = document.createElement("button");
          remove.type = "button";
          remove.className = "tv-icon-button";
          remove.title = "移除数据组";
          remove.setAttribute("aria-label", "移除 " + dataset.name);
          remove.textContent = "×";
          remove.addEventListener("click", function () { context.removeDataset(dataset.id); });
          chip.append(chipIndex, copy, primary, remove);
          strip.appendChild(chip);
        });
      }

      function renderSeriesMapping(context, dataset) {
        if (!dataset) return;
        var tweaks = root.querySelector(".tv-tweaks");
        var details = document.createElement("details");
        details.className = "tv-series-mapping";
        details.open = dataset.series.length <= 4;
        var summary = document.createElement("summary");
        summary.textContent = "曲线名称映射 · 可编辑显示名称";
        details.appendChild(summary);
        var list = document.createElement("div");
        list.className = "tv-series-list";
        dataset.series.forEach(function (series) {
          var row = document.createElement("label");
          row.className = "tv-series-row";
          var original = document.createElement("small");
          original.title = series.sourceLabel || series.label;
          original.textContent = "原始表头： " + (series.sourceLabel || series.label);
          var input = document.createElement("input");
          input.value = series.label;
          input.setAttribute("aria-label", "曲线显示名称：" + (series.sourceLabel || series.label));
          input.addEventListener("change", function () {
            series.label = input.value.trim() || series.sourceLabel || "未命名曲线";
            context.rerender();
          });
          row.append(original, input);
          list.appendChild(row);
        });
        details.appendChild(list);
        tweaks.appendChild(details);
      }

      function render() {
        root.innerHTML = "";
        root.setAttribute("data-theme", state.options.theme);
        var shell = document.createElement("div");
        shell.className = "tv-shell";
        shell.innerHTML =
          "<header class=\"tv-header\"><div><p class=\"tv-kicker\">temperature trajectory workbench</p><h1>温度轨迹可视化工具</h1><p class=\"tv-subtitle\">导入一组或多组宽表 CSV。主数据组以完整论文式布局呈现；其余数据组保持紧凑总览，可随时提升为主图。</p></div><div class=\"tv-status\" data-tone=\"" + state.status.tone + "\" role=\"status\"></div></header>" +
          "<section class=\"tv-toolbar\" aria-label=\"数据导入和导出\"><label class=\"tv-file-button\"><span class=\"tv-file-stamp\">CSV</span><span><strong>拖放 CSV 或选择文件</strong><small>每个 CSV 是一组独立工况；支持多选</small></span><input id=\"tvFileInput\" type=\"file\" accept=\".csv,text/csv\" multiple></label><div class=\"tv-control\"><label for=\"tvSourceUnit\">导入时间单位</label><select id=\"tvSourceUnit\" class=\"tv-select\"><option value=\"s\">秒 s</option><option value=\"min\">分钟 min</option><option value=\"h\">小时 h</option></select></div><div class=\"tv-control\"><label for=\"tvDisplayUnit\">显示时间单位</label><select id=\"tvDisplayUnit\" class=\"tv-select\"><option value=\"min\">分钟 min</option><option value=\"s\">秒 s</option><option value=\"h\">小时 h</option></select></div><div class=\"tv-control\"><label for=\"tvTheme\">查看主题</label><select id=\"tvTheme\" class=\"tv-select\"><option value=\"light\">浅色论文图</option><option value=\"dark\">深色查看</option></select></div><div class=\"tv-controls\"><button id=\"tvExportSvg\" class=\"tv-button\" type=\"button\">导出 SVG</button><button id=\"tvExportPng\" class=\"tv-button\" type=\"button\">导出 PNG</button><button id=\"tvResetCurves\" class=\"tv-button\" type=\"button\">恢复曲线</button></div></section>" +
          "<section class=\"tv-dataset-strip\" aria-label=\"已加载的数据组\"></section>" +
          "<details class=\"tv-tweaks\"><summary>Tweaks · 图表查看参数</summary><div class=\"tv-tweak-grid\"><div class=\"tv-control\"><label for=\"tvAxisMode\">分组纵轴</label><select id=\"tvAxisMode\" class=\"tv-select\"><option value=\"shared\">共享传感器范围</option><option value=\"independent\">各组独立范围</option></select></div><div class=\"tv-control\"><label for=\"tvDensity\">图表密度</label><select id=\"tvDensity\" class=\"tv-select\"><option value=\"roomy\">舒展</option><option value=\"compact\">紧凑</option></select></div><div class=\"tv-control\"><label>默认分组</label><div style=\"padding:10px 4px 0;color:var(--muted);font-size:11px;line-height:1.3\">T1–T7 · T8–T22 · T23–T37 · T38–T52</div></div><div class=\"tv-control\"><label>曲线交互</label><div style=\"padding:10px 4px 0;color:var(--muted);font-size:11px;line-height:1.3\">图例点击显隐；悬停读取时刻值</div></div></div></details>" +
          "<section class=\"tv-workspace\" aria-live=\"polite\"></section>";
        root.appendChild(shell);
        var status = root.querySelector(".tv-status");
        status.textContent = state.status.text;
        root.querySelector("#tvSourceUnit").value = state.options.sourceTimeUnit;
        root.querySelector("#tvDisplayUnit").value = state.options.displayTimeUnit;
        root.querySelector("#tvTheme").value = state.options.theme;
        root.querySelector("#tvAxisMode").value = state.options.axisMode;
        root.querySelector("#tvDensity").value = state.options.density;
        var context = createContext(root, state, render);
        renderDatasetStrip(context);
        var mappingDataset = state.datasets.find(function (dataset) { return dataset.id === state.primaryId; }) || state.datasets[0];
        renderSeriesMapping(context, mappingDataset);
        var workspace = root.querySelector(".tv-workspace");
        if (!state.datasets.length) {
          workspace.innerHTML = "<section class=\"tv-empty\"><div class=\"tv-empty-box\"><div class=\"tv-empty-mark\" aria-hidden=\"true\"></div><h2>等待温度数据</h2><p>导入宽表 CSV：首列为 <code>time</code>、<code>time_s</code> 或 <code>时间</code>。后续列可为 <code>T1</code>…<code>Tn</code>，也可为含“温度”“温差”或 “delta” 的单通道曲线；导入后可手动改显示名称。</p><button type=\"button\" class=\"tv-button tv-button--primary\" id=\"tvEmptyImport\">选择 CSV</button></div></section>";
          root.querySelector("#tvEmptyImport").addEventListener("click", function () { root.querySelector("#tvFileInput").click(); });
        } else {
          var primary = state.datasets.find(function (dataset) { return dataset.id === state.primaryId; }) || state.datasets[0];
          var primaryWrap = document.createElement("div");
          primaryWrap.className = "tv-primary-wrap";
          primaryWrap.appendChild(renderComposite(root, context, primary));
          workspace.appendChild(primaryWrap);
          var secondary = state.datasets.filter(function (dataset) { return dataset.id !== primary.id; });
          if (secondary.length) {
            var heading = document.createElement("div");
            heading.className = "tv-secondary-heading";
            heading.innerHTML = "<h2>辅助数据组</h2><p>选择“设为主图”可切换为完整五面板视图。</p>";
            var grid = document.createElement("div");
            grid.className = "tv-secondary-grid";
            secondary.forEach(function (dataset) { grid.appendChild(renderSecondary(root, context, dataset)); });
            workspace.append(heading, grid);
          }
          var note = document.createElement("p");
          note.className = "tv-note";
          note.textContent = primary.series.some(function (series) { return series.kind === "sensor"; }) ?
            "提示：总览图的纵轴包含辅助温度；分组图默认共享所有传感器的纵轴范围，便于横向比较。" :
            "提示：这是温差/数值曲线模式。打开 Tweaks 可查看原始表头并修改任意显示名称。";
          workspace.appendChild(note);
        }
        bindControls();
      }

      function importFiles(files) {
        var list = Array.from(files || []);
        if (!list.length) return;
        setStatus("正在读取 " + list.length + " 个 CSV 文件…", "");
        Promise.allSettled(list.map(function (file) {
          return loadCsv(file, { timeUnit: state.options.sourceTimeUnit });
        })).then(function (results) {
          var failures = results.filter(function (result) { return result.status === "rejected"; });
          if (failures.length) {
            setStatus("已导入 " + (results.length - failures.length) + " 个文件；" + failures.length + " 个失败：" + failures[0].reason.message, "error");
          } else {
            setStatus("已导入 " + results.length + " 个 CSV 数据组。", "ok");
          }
          render();
        });
      }

      function bindControls() {
        var fileInput = root.querySelector("#tvFileInput");
        fileInput.addEventListener("change", function (event) {
          importFiles(event.target.files);
          event.target.value = "";
        });
        root.querySelector(".tv-toolbar").addEventListener("dragover", function (event) {
          event.preventDefault();
          root.querySelector(".tv-file-button").style.borderColor = cssValue(root, "--focus");
        });
        root.querySelector(".tv-toolbar").addEventListener("dragleave", function () {
          root.querySelector(".tv-file-button").style.borderColor = "";
        });
        root.querySelector(".tv-toolbar").addEventListener("drop", function (event) {
          event.preventDefault();
          root.querySelector(".tv-file-button").style.borderColor = "";
          importFiles(Array.from(event.dataTransfer.files).filter(function (file) { return file.name.toLowerCase().endsWith(".csv"); }));
        });
        root.querySelector("#tvSourceUnit").addEventListener("change", function (event) { state.options.sourceTimeUnit = event.target.value; });
        root.querySelector("#tvDisplayUnit").addEventListener("change", function (event) {
          state.options.displayTimeUnit = event.target.value;
          render();
        });
        root.querySelector("#tvTheme").addEventListener("change", function (event) {
          state.options.theme = event.target.value;
          render();
        });
        root.querySelector("#tvAxisMode").addEventListener("change", function (event) {
          state.options.axisMode = event.target.value;
          render();
        });
        root.querySelector("#tvDensity").addEventListener("change", function (event) {
          state.options.density = event.target.value;
          render();
        });
        root.querySelector("#tvResetCurves").addEventListener("click", resetCurves);
        root.querySelector("#tvExportSvg").addEventListener("click", exportCurrentSvg);
        root.querySelector("#tvExportPng").addEventListener("click", exportCurrentPng);
      }

      render();
      return {
        loadCsv: loadCsv,
        upsertDataset: upsertDataset,
        removeDataset: function (id) { createContext(root, state, render).removeDataset(id); },
        setPrimary: function (id) {
          if (!state.datasets.some(function (dataset) { return dataset.id === id; })) throw new Error("未找到数据组：" + id);
          state.primaryId = id;
          render();
        },
        updateOptions: function (partial) {
          Object.assign(state.options, partial || {});
          if (partial && partial.groups) {
            state.options.groups = partial.groups.map(function (group) { return Object.assign({}, group); });
            state.datasets.forEach(function (dataset) {
              dataset.series.forEach(function (series) {
                if (series.kind !== "sensor") return;
                var sensorId = sensorIdFromHeader(series.id) || sensorIdFromHeader(series.label);
                var group = sensorId === null ? null : groupForSensor(sensorId, state.options.groups);
                series.groupId = group ? group.id : "ungrouped";
                if (sensorId !== null) series.color = sensorColor(sensorId, group);
              });
            });
          }
          render();
        },
        destroy: function () { root.replaceChildren(); },
        getState: function () {
          return {
            primaryId: state.primaryId,
            datasets: state.datasets.map(function (dataset) { return Object.assign({}, dataset); }),
            options: Object.assign({}, state.options)
          };
        }
      };
    }

    function standaloneContext(dataset, rerender, state) {
      if (!state.hidden.has(dataset.id)) state.hidden.set(dataset.id, new Set());
      return {
        state: state,
        options: state.options,
        hidden: state.hidden,
        rerender: rerender,
        removeDataset: function () {}
      };
    }

    function renderOverview(container, rawDataset, options) {
      var target = typeof container === "string" ? document.querySelector(container) : container;
      if (!target) throw new Error("renderOverview 找不到容器。");
      var groups = (options && options.groups) || DEFAULT_GROUPS;
      var dataset = normalizeDataset(rawDataset, groups);
      var state = {
        options: Object.assign({
          groups: groups.map(function (group) { return Object.assign({}, group); }),
          displayTimeUnit: "min",
          axisMode: "shared",
          density: "roomy"
        }, options || {}),
        hidden: new Map()
      };
      function draw() {
        var context = standaloneContext(dataset, draw, state);
        target.replaceChildren(makeChartPanel(target, context, dataset, {
          title: options && options.title || dataset.name,
          meta: "总览图",
          series: dataset.series,
          overview: true,
          groupedLegend: true,
          yExtent: extent(dataset.series)
        }));
      }
      draw();
      return { update: function (nextDataset) { dataset = normalizeDataset(nextDataset, groups); draw(); }, destroy: function () { target.replaceChildren(); } };
    }

    function renderGroup(container, rawDataset, group, options) {
      var target = typeof container === "string" ? document.querySelector(container) : container;
      if (!target) throw new Error("renderGroup 找不到容器。");
      var groups = (options && options.groups) || DEFAULT_GROUPS;
      var dataset = normalizeDataset(rawDataset, groups);
      var selected = typeof group === "string" ? groups.find(function (item) { return item.id === group; }) : group;
      if (!selected) throw new Error("renderGroup 找不到指定的传感器分组。");
      var state = {
        options: Object.assign({
          groups: groups.map(function (item) { return Object.assign({}, item); }),
          displayTimeUnit: "min",
          axisMode: "shared",
          density: "roomy"
        }, options || {}),
        hidden: new Map()
      };
      function draw() {
        var series = dataset.series.filter(function (item) { return item.kind === "sensor" && item.groupId === selected.id; });
        if (!series.length) throw new Error(dataset.name + " 没有 " + selected.label + " 的传感器数据。");
        var context = standaloneContext(dataset, draw, state);
        target.replaceChildren(makeChartPanel(target, context, dataset, {
          title: selected.label,
          meta: series.length + " 个传感器",
          series: series,
          isGroup: true,
          groupedLegend: false,
          yExtent: context.options.axisMode === "shared" ? sensorExtent(dataset) : extent(series)
        }));
      }
      draw();
      return { update: function (nextDataset) { dataset = normalizeDataset(nextDataset, groups); draw(); }, destroy: function () { target.replaceChildren(); } };
    }

    window.TemperatureViz = {
      mount: mount,
      renderOverview: renderOverview,
      renderGroup: renderGroup,
      parseCsv: parseCsv,
      parseDatasetFromCsv: parseDatasetFromCsv,
      DEFAULT_GROUPS: DEFAULT_GROUPS.map(function (group) { return Object.assign({}, group); })
    };

    var defaultContainer = document.querySelector("[data-temperature-visualizer]");
    if (defaultContainer) window.temperatureTrajectoryVisualizer = mount(defaultContainer);
  }());
  </script>
</body>
</html>
