          drag = null;
          renderProps();
          return;
        }
        var hit = hitInspection(info, point.x, point.y);
        selectBox();
        if (hit && hit.kind === "inset-handle") return startInsetGesture(box, plot, hit.id, "inset-resize", point, event);
        if (hit && hit.kind === "inset") return startInsetGesture(box, plot, hit.id, "inset-move", point, event);
        if (hit && hit.kind === "annotation") {
          var ann = (plot.annotations || []).find(function (item) { return item.id === hit.id; });
          setSelectedObject({ type: "annotation", figureId: plot.id, objectId: hit.id });
          updateOverlay(box, plot);
          renderProps();
          if (event.detail === 2 && ann && (ann.type === "text" || ann.type === "point" || ann.type === "free")) {
            beginTextEdit(box, plot, ann);
            return;
          }
          if (plot.locked) return;
          return startAnnotationGesture(box, plot, ann, point, info, event);
        }
        var sourceHit = event.target.closest && event.target.closest("[data-object='source-box']");
        if (sourceHit && interactionMode === "pointer") {
          var detailId = sourceHit.getAttribute("data-object-id");
          setSelectedObject({ type: "source-box", figureId: detailId, objectId: detailId });
          renderProps();
          paintSelectionOverlay();
          renderLayers();
          return;
        }
        if (hit && hit.kind === "plot" && interactionMode !== "pointer") {
          return startToolGesture(box, plot, point, info, event);
        }
        if (interactionMode !== "pointer") return;
        setSelectedObject({ type: plot.type === "detail" ? "detail" : "plot", figureId: plot.id, objectId: plot.id });
        var view = viewBox(plot);
        if (view.instance && workspaceMode() === "canvas" && plot.type !== "detail") {
          if (event.shiftKey) {
            var nextIds = selectedInstanceIds.slice();
            var at = nextIds.indexOf(view.instance.id);
            if (at >= 0) nextIds.splice(at, 1);
            else nextIds.push(view.instance.id);
            selectInstances(nextIds);
            return;
          }
          selectedInstanceIds = [view.instance.id];
          workspaceFocus = { type: "instance", id: view.instance.id, plotId: plot.id };
        } else if (workspaceMode() === "canvas") {
          workspaceFocus = { type: "plot", plotId: plot.id };
        }
        if ((view.instance && view.instance.locked) || plot.locked) {
          renderProps();
          paintSelectionOverlay();
          renderLayers();
          return;
        }
        drag = {
          mode: "move",
          plot: plot,
          box: box,
          instance: workspaceMode() === "canvas" ? view.instance : null,
          before: core.captureEditorState(project),
          startX: event.clientX,
          startY: event.clientY,
          origX: view.x,
          origY: view.y
        };
        box.setPointerCapture(event.pointerId);
        paintSelectionOverlay();
        renderProps();
      });
      if (handle) handle.addEventListener("pointerdown", function (event) {
        event.stopPropagation();
        selectBox();
        setSelectedObject({ type: plot.type === "detail" ? "detail" : "plot", figureId: plot.id, objectId: plot.id });
        if (plot.locked) {
          renderProps();
          return;
        }
        var resizeView = viewBox(plot);
        if ((resizeView.instance && resizeView.instance.locked) || plot.locked) {
          renderProps();
          return;
        }
        drag = {
          mode: "resize",
          plot: plot,
          box: box,
          instance: workspaceMode() === "canvas" ? resizeView.instance : null,
          before: core.captureEditorState(project),
          startX: event.clientX,
          startY: event.clientY,
          origW: resizeView.width,
          origH: resizeView.height
        };
        box.setPointerCapture(event.pointerId);
      });
      box.addEventListener("pointermove", function (event) {
        var point = figurePoint(box, event);
        if (interactionMode === "cursor" && (!drag || drag.box !== box) && !inspectorLocked) {
          var svg = box.querySelector("svg");
          var info = svg && svg.__inspection;
          if (info && point.x >= info.plotArea.x && point.y >= info.plotArea.y && point.x <= info.plotArea.x + info.plotArea.width && point.y <= info.plotArea.y + info.plotArea.height) {
            if (readoutCursor && readoutCursor.plotId === plot.id) {
              readoutCursor.nearestSeriesId = nearestSeriesAtX(plot, info, readoutCursor.x, point.x, point.y);
              updateOverlay(box, plot);
              showInspector(plot, readoutCursor.x, event.clientX, event.clientY, readoutCursor.nearestSeriesId);
            } else {
              var hover = core.snapReadout(project, plot, info.frame, point.x, point.y);
              cursorHover = { plotId: plot.id, x: hover.x, nearestSeriesId: hover.nearestSeriesId };
              updateOverlay(box, plot);
              showInspector(plot, hover.x, event.clientX, event.clientY, hover.nearestSeriesId);
            }
          }
        }
        if (!drag || drag.box !== box) return;
        if (drag.mode === "range" || drag.mode === "arrow" || drag.mode === "region") {
          drag.currentPt = point;
          updateOverlay(box, plot);
          return;
        }
        if (drag.mode === "inset-move" || drag.mode === "inset-resize") return moveInset(plot, point);
        if (drag.mode === "ann-move") return moveAnnotation(point);
        var delta = core.screenToWorld(event.clientX - drag.startX, event.clientY - drag.startY, canvasZoom());
        if (drag.instance && (drag.mode === "move" || drag.mode === "resize")) {
          var proxy = {
            id: plot.id,
            layout: {
              x: Math.round(drag.origX + (drag.mode === "move" ? delta.x : 0)),
              y: Math.round(drag.origY + (drag.mode === "move" ? delta.y : 0)),
              width: drag.mode === "resize" ? Math.max(80, Math.round(drag.origW + delta.x)) : drag.instance.width,
              height: drag.mode === "resize" ? Math.max(60, Math.round(drag.origH + delta.y)) : drag.instance.height
            }
          };
          if (drag.mode === "move") proxy.layout.x = Math.round(drag.origX + delta.x);
          if (drag.mode === "move") proxy.layout.y = Math.round(drag.origY + delta.y);
          var mates = (activeCanvas().instances || []).filter(function (item) { return item.id !== drag.instance.id; }).map(function (item) {
            return { id: item.plotId, layout: { x: item.x, y: item.y, width: item.width, height: item.height } };
          });
          if (drag.mode === "move") {
            var snapped = core.snapPlotMove(proxy, mates, activeCanvas() || project.canvas, canvasZoom());
            drag.instance.x = proxy.layout.x;
            drag.instance.y = proxy.layout.y;
            showGuides(snapped.guides);
          } else {
            drag.instance.width = proxy.layout.width;
            drag.instance.height = proxy.layout.height;
          }
          applyPlotFrame(box, plot);
          var svg = box.querySelector("svg");
          if (svg) svg.style.transform = "scale(" + (box.dataset.scaleX || 1) + "," + (box.dataset.scaleY || 1) + ")";
        } else if (drag.mode === "move") {
          plot.layout.x = Math.round(drag.origX + delta.x);
          plot.layout.y = Math.round(drag.origY + delta.y);
          var moved = core.snapPlotMove(plot, others(), project.canvas, canvasZoom());
          showGuides(moved.guides);
          box.style.left = plot.layout.x + "px";
          box.style.top = plot.layout.y + "px";
        } else if (drag.mode === "resize") {
          core.setPlotSize(plot, drag.origW + delta.x, drag.origH + delta.y, "width");
          var resized = core.snapPlotResize(plot, others(), project.canvas, canvasZoom());
          showGuides(resized.guides);
          box.style.width = plot.layout.width + "px";
          box.style.height = plot.layout.height + "px";
          showSizeTip(plot);
        }
        syncSelectionOverlay();
        paintDetailLinks();
        syncSizeFields(plot);
      });
      box.addEventListener("pointerup", function (event) {
        if (event.target.closest && event.target.closest(".tv-range-actions")) return;
        if (!drag || drag.box !== box) return;
        if ((drag.mode === "move" || drag.mode === "resize") && drag.startX != null) {
          var dist = Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY);
          if (dist < 3) {
            drag = null;
            return;
          }
        }
        finishPlotGesture(box, plot);
      });
    }

    function startInsetGesture(box, plot, id, mode, point, event) {
      var inset = (plot.insets || []).find(function (item) { return item.id === id; });
      if (!inset) return;
      selectedObject = { type: "inset", id: id, plotId: plot.id };
      drag = {
        mode: mode,
        plot: plot,
        box: box,
        inset: inset,
        before: core.captureEditorState(project),
        label: mode === "inset-resize" ? "Resize inset" : "Move inset",
        startPt: point,
        orig: core.cloneJson(inset.rect)
      };
      box.setPointerCapture(event.pointerId);
      renderProps();
      updateOverlay(box, plot);
    }

    function moveInset(plot, point) {
      var dx = point.x - drag.startPt.x;
      var dy = point.y - drag.startPt.y;
      var next = {
        x: drag.orig.x + (drag.mode === "inset-move" ? dx : 0),
        y: drag.orig.y + (drag.mode === "inset-move" ? dy : 0),
        width: drag.mode === "inset-resize" ? Math.max(80, drag.orig.width + dx) : drag.orig.width,
        height: drag.mode === "inset-resize" ? Math.max(60, drag.orig.height + dy) : drag.orig.height
      };
      drag.inset.rect = core.clampInsetRect(next, plot.layout.width, plot.layout.height);
      paintPlot(drag.box, plot);
    }

    function startAnnotationGesture(box, plot, ann, point, info, event) {
      if (!ann) return;
      drag = {
        mode: "ann-move",
        plot: plot,
        box: box,
        ann: ann,
        before: core.captureEditorState(project),
        label: "Move annotation",
        startPt: point,
        frame: info.frame,
        area: info.plotArea,
        orig: { anchor: core.cloneJson(ann.anchor), end: core.cloneJson(ann.end) }
      };
      box.setPointerCapture(event.pointerId);
    }

    function moveAnnotation(point) {
      var dx = point.x - drag.startPt.x;
      var dy = point.y - drag.startPt.y;
      var ann = drag.ann;
      if (ann.type === "point") {
        ann.end = {
          x: drag.frame.pixelToDataX(drag.frame.dataToPixelX(drag.orig.end.x) + dx),
          y: drag.frame.pixelToDataY(drag.frame.dataToPixelY(drag.orig.end.y) + dy)
        };
      } else if (ann.coordinateMode === "plot" && drag.area) {
        ann.anchor = {
          x: drag.orig.anchor.x + dx / Math.max(1, drag.area.width),
          y: drag.orig.anchor.y + dy / Math.max(1, drag.area.height)
        };
        ann.end = { x: ann.anchor.x, y: ann.anchor.y };
      } else if (ann.coordinateMode === "canvas") {
        ann.anchor = { x: drag.orig.anchor.x + dx, y: drag.orig.anchor.y + dy };
        ann.end = { x: drag.orig.end.x + dx, y: drag.orig.end.y + dy };
      } else {
        ann.anchor = {
          x: drag.frame.pixelToDataX(drag.frame.dataToPixelX(drag.orig.anchor.x) + dx),
          y: drag.frame.pixelToDataY(drag.frame.dataToPixelY(drag.orig.anchor.y) + dy)
        };
        ann.end = {
          x: drag.frame.pixelToDataX(drag.frame.dataToPixelX(drag.orig.end.x) + dx),
          y: drag.frame.pixelToDataY(drag.frame.dataToPixelY(drag.orig.end.y) + dy)
        };
      }
      paintPlot(drag.box, drag.plot);
    }

    function startToolGesture(box, plot, point, info, event) {
      if (interactionMode === "cursor") {
        var snap = core.snapReadout(project, plot, info.frame, point.x, point.y);
        placeReadout(plot, snap.x, snap.nearestSeriesId);
        showInspector(plot, snap.x, event.clientX, event.clientY, snap.nearestSeriesId);
        updateOverlay(box, plot);
        return;
      }
      if (interactionMode === "annotation-point") {
        var hit = core.findNearestDataPoint(project, plot, info.frame, point.x, point.y);
        if (!hit) {
          setStatus("附近没有可标注的数据点。", "error");
          return;
        }
        var labelX = info.frame.pixelToDataX(Math.min(info.plotArea.x + info.plotArea.width - 8, info.frame.dataToPixelX(hit.x) + 28));
        var labelY = info.frame.pixelToDataY(Math.max(info.plotArea.y + 8, info.frame.dataToPixelY(hit.y) - 28));
        var yUnit = hit.unit ? " " + hit.unit : "";
        addAnnotation(plot, {
          type: "point",
          seriesId: hit.seriesId,
          coordinateMode: "data",
          anchor: { x: hit.x, y: hit.y },
          end: { x: labelX, y: labelY },
          text: hit.name + "\nx = " + formatReading(hit.x) + "\ny = " + formatReading(hit.y) + yUnit,
          style: { color: hit.color || "#1d2024" }
        });
        setInteractionMode("pointer", true);
        renderCanvas();
        renderProps();
        return;
      }
      if (interactionMode === "annotation-free") {
        var area = info.plotArea;
        var nx = (point.x - area.x) / Math.max(1, area.width);
        var ny = (point.y - area.y) / Math.max(1, area.height);
        addAnnotation(plot, {
          type: "free",
          coordinateMode: "plot",
          anchor: { x: nx, y: ny },
          end: { x: nx, y: ny },
          text: "文本"
        });
        setInteractionMode("pointer", true);
        renderCanvas();
        renderProps();
        return;
      }
      if (interactionMode === "annotation-text") {
        var created = addAnnotation(plot, {
          type: "text",
          coordinateMode: "data",
          anchor: { x: info.frame.pixelToDataX(point.x), y: info.frame.pixelToDataY(point.y) },
          text: "文字"
        });
        pendingText = created ? { plotId: plot.id, id: created.id } : null;
        renderCanvas();
        renderProps();
        return;
      }
      if (interactionMode === "annotation-marker") {
        var dataX = info.frame.pixelToDataX(point.x);
        var rows = core.readPlotAtX(project, plot, dataX, "nearest");
        var anchor = { x: dataX, y: info.frame.pixelToDataY(point.y) };
        var best = null;
        rows.forEach(function (row) {
          if (row.y == null || row.x == null) return;
          var distance = Math.abs(info.frame.dataToPixelY(row.y) - point.y);
          if (!best || distance < best.distance) best = { distance: distance, x: row.x, y: row.y };
        });
        if (best) anchor = { x: best.x, y: best.y };
        addAnnotation(plot, { type: "marker", coordinateMode: "data", anchor: anchor, marker: "circle" });
        renderCanvas();
        renderProps();
        return;
      }
      drag = {
        mode: interactionMode === "annotation-arrow" ? "arrow" : (interactionMode === "annotation-region" ? "region" : "range"),
        plot: plot,
        box: box,
        info: info,
        startPt: point,
        currentPt: point
      };
      box.setPointerCapture(event.pointerId);
      updateOverlay(box, plot);
    }

    function finishPlotGesture(box, plot) {
      showGuides([]);
      var tip = paper.querySelector(".tv-size-tip");
      if (tip) tip.remove();
      if (drag.mode === "range-ready") return;
      if (drag.mode === "range") {
        var dx = Math.abs(drag.currentPt.x - drag.startPt.x);
        var dy = Math.abs(drag.currentPt.y - drag.startPt.y);
        if (dx < 4 && dy < 4) drag = null;
        else {
          drag.mode = "range-ready";
          drag.range = selectionFromGesture(drag);
        }
        updateOverlay(box, plot);
        return;
      }
      if (drag.mode === "arrow" || drag.mode === "region") {
        var span = Math.hypot(drag.currentPt.x - drag.startPt.x, drag.currentPt.y - drag.startPt.y);
        if (span >= 4) {
          var frame = drag.info.frame;
          addAnnotation(plot, {
            type: drag.mode === "arrow" ? "arrow" : "region",
            coordinateMode: "data",
            anchor: { x: frame.pixelToDataX(drag.startPt.x), y: frame.pixelToDataY(drag.startPt.y) },
            end: { x: frame.pixelToDataX(drag.currentPt.x), y: frame.pixelToDataY(drag.currentPt.y) }
          });
        }
        drag = null;
        renderCanvas();
        renderProps();
        return;
      }
      if (drag.before) {
        if (drag.mode === "resize") {
          (plot.insets || []).forEach(function (inset) {
            inset.rect = core.clampInsetRect(inset.rect, plot.layout.width, plot.layout.height);
          });
        }
        pushHistory(drag.label || (drag.mode === "resize" ? "Resize plot" : drag.mode === "move" ? "Move plot" : "Edit"), drag.before, core.captureEditorState(project));
      }
      drag = null;
      core.syncCanvasToPlots(project);
      applyCanvasZoom();
      setDirty(true);
      paintPlot(box, plot);
    }

    function attachLegendHit(box, plot, svg) {
      var legendBox = svg.__legendBox;
      var plotArea = svg.__plotArea;
      if (!legendBox || !legendBox.height || !plot.legend || plot.legend.visible === false) return;
      var position = core.resolveLegendPosition(plot.legend);
      var pad = legendBox.pad || 0;
      var hit = document.createElement("div");
      var legendSelected = selectedObject && selectedObject.type === "legend" && selectedObject.figureId === plot.id;
      hit.className = "tv-legend-hit" + (position === "free" ? " is-free" : "") + (legendSelected ? " is-selected" : "");
      hit.dataset.object = "legend";
      hit.style.left = legendBox.x + "px";
      hit.style.top = legendBox.y + "px";
      hit.style.width = Math.max(24, legendBox.width + pad * 2) + "px";
      hit.style.height = Math.max(16, legendBox.height + pad * 2) + "px";
      hit.title = position === "free" && !plot.locked ? "拖动图例" : "图例";
      if (position !== "free") hit.style.cursor = "pointer";
      hit.addEventListener("pointerdown", function (event) {
        event.stopPropagation();
        event.preventDefault();
        var switched = activatePlot(plot.id);
        if (switched) renderData();
        setSelectedObject({ type: "legend", figureId: plot.id, objectId: "legend" });
        if (event.detail === 2) {
          var rect = hit.getBoundingClientRect();
          var scaleX = rect.width ? hit.offsetWidth / rect.width : 1;
          var scaleY = rect.height ? hit.offsetHeight / rect.height : 1;
          var localX = (event.clientX - rect.left) * scaleX;
          var localY = (event.clientY - rect.top) * scaleY;
          var entries = svg.__legendEntries || [];
          var found = null;
          entries.forEach(function (entry) {
            if (found || !entry.seriesId) return;
            if (localX >= entry.x && localY >= entry.y && localX <= entry.x + entry.width && localY <= entry.y + entry.height) found = entry;
          });
          if (found) {
            pendingEditFocus = "series:" + found.seriesId;
            setSelectedObject({ type: plot.type === "detail" ? "detail" : "plot", figureId: plot.id, objectId: plot.id });
            renderProps();
            paintSelectionOverlay();
            renderLayers();
            return;
          }
        }
        renderProps();
        paintSelectionOverlay();
        renderLayers();
        if (plot.locked || position !== "free") return;
        drag = {
          mode: "legend",
          plot: plot,
          box: box,
          before: core.captureEditorState(project),
          startX: event.clientX,
          startY: event.clientY,
          origX: legendBox.x,
          origY: legendBox.y,
          plotArea: plotArea,
          boxW: legendBox.width + pad * 2,
          boxH: legendBox.height + pad * 2
        };
        hit.setPointerCapture(event.pointerId);
      });
      hit.addEventListener("pointermove", function (event) {
        if (!drag || drag.mode !== "legend" || drag.plot !== plot) return;
        var delta = core.screenToWorld(event.clientX - drag.startX, event.clientY - drag.startY, canvasZoom());
        var area = drag.plotArea || { x: 0, y: 0, width: plot.layout.width, height: plot.layout.height };
        var nextX = core.clamp(drag.origX + delta.x, area.x, area.x + area.width - drag.boxW);
        var nextY = core.clamp(drag.origY + delta.y, area.y, area.y + area.height - drag.boxH);
        var spanX = Math.max(1, area.width - drag.boxW);
        var spanY = Math.max(1, area.height - drag.boxH);
        plot.legend.position = "free";
        plot.legend.x = core.clamp((nextX - area.x) / spanX, 0, 1);
        plot.legend.y = core.clamp((nextY - area.y) / spanY, 0, 1);
        plot.legend.floatingX = plot.legend.x;
        plot.legend.floatingY = plot.legend.y;
        hit.style.left = nextX + "px";
        hit.style.top = nextY + "px";
      });
      hit.addEventListener("pointerup", function () {
        if (!drag || drag.mode !== "legend") return;
        pushHistory("Move legend", drag.before, core.captureEditorState(project));
        drag = null;
        setDirty(true);
        renderCanvas();
        renderProps();
      });
      box.appendChild(hit);
    }

    function paintPlot(box, plot) {
      var handle = box.querySelector(".tv-plot-resize");
      var view = viewBox(plot);
      var svg = buildPlotSvg(plot, plot.layout.width, plot.layout.height, true);
      svg.style.transformOrigin = "0 0";
      svg.style.transform = "scale(" + view.scaleX + "," + view.scaleY + ")";
      Array.from(box.children).forEach(function (child) {
        if (child !== handle && !child.classList.contains("tv-plot-tools")) child.remove();
      });
      box.insertBefore(svg, handle);
      applyPlotFrame(box, plot);
      attachLegendHit(box, plot, svg);
      updateOverlay(box, plot);
      if (pendingText && pendingText.plotId === plot.id) {
        var ann = (plot.annotations || []).find(function (item) { return item.id === pendingText.id; });
        pendingText = null;
        if (ann) beginTextEdit(box, plot, ann);
      }
    }

    function makePlotBox(plot) {
      var box = document.createElement("div");
      var placed = workspaceMode() === "canvas" && plot.type !== "detail" ? core.findInstance(activeCanvas(), plot.id) : null;
      var on = placed ? selectedInstanceIds.indexOf(placed.id) >= 0 : plot.id === selectedPlotId;
      box.className = "tv-plot" + (on ? " is-selected" : "");
      box.dataset.plotId = plot.id;
      applyPlotFrame(box, plot);
      bindPlotPointer(box, plot, null);
      paintPlot(box, plot);
      return box;
    }

    function seriesBrowserColor(series) {
      var plot = selectedPlot();
      if (plot) {
        var hit = core.resolvePlotSeries(project, plot).find(function (item) { return item.series.id === series.id; });
        if (hit && hit.color) return hit.color;
      }
      var style = core.normalizeSeriesStyle(series.style, series.color);
      return style.color || series.color || "#2477b6";
    }

    function paintDetailLinks() {
      paper.querySelectorAll(".tv-detail-links").forEach(function (node) { node.remove(); });
      core.plotsInLayerOrder(project).forEach(function (detail) {
        if (detail.type !== "detail" || detail.visible === false) return;
        if (!detail.detailSource || detail.detailSource.showConnectorLines === false) return;
        var box = paper.querySelector('.tv-plot[data-plot-id="' + detail.id + '"]');
        if (!box) return;
        var linkSize = stageMetrics();
        var layer = createSvg("svg", { width: linkSize.width, height: linkSize.height });
        layer.setAttribute("class", "tv-detail-links");
        layer.style.position = "absolute";
        layer.style.left = "0";
        layer.style.top = "0";
        layer.style.overflow = "visible";
        layer.style.pointerEvents = "none";
        layer.style.zIndex = String(detail.zOrder || 1);
        appendDetailConnectors(layer, function (plot) {
          var host = paper.querySelector('.tv-plot[data-plot-id="' + plot.id + '"]');
          return host ? host.querySelector("svg") : null;
        }, detail, true);
        layer.addEventListener("pointerdown", function (event) {
          var node = event.target && event.target.closest ? event.target.closest("[data-object='connector']") : null;
          if (!node) return;
          event.stopPropagation();
          event.preventDefault();
          var detailId = node.getAttribute("data-object-id");
          activatePlot(detailId);
          setSelectedObject({ type: "connector", figureId: detailId, objectId: detailId });
          renderProps();
          paintSelectionOverlay();
          renderLayers();
        });
        paper.insertBefore(layer, box);
      });
    }

    function syncSelectionOverlay() {
      var overlay = paper.querySelector(".tv-selection-overlay");
      var plot = selectedPlot();

    function resizeHandle(plot, instance) {

    function workspaceMode() {

    function rememberWorkspace() {
      if (!project.ui) project.ui = core.normalizeUi(null);

    }

    function viewBox(plot) {
      var layout = (plot && plot.layout) || { x: 0, y: 0, width: 240, height: 180 };
      if (!plot || intrinsicLayout) {
        return { x: layout.x, y: layout.y, width: layout.width, height: layout.height, scaleX: 1, scaleY: 1, instance: null };
      }
      if (workspaceMode() === "canvas" && plot.type !== "detail") {
        var inst = core.findInstance(activeCanvas(), plot.id);
        if (inst) {
          return {
            x: inst.x,
            y: inst.y,
            width: inst.width,
            height: inst.height,
            scaleX: layout.width ? inst.width / layout.width : 1,
            scaleY: layout.height ? inst.height / layout.height : 1,
            instance: inst
          };
        }
      }
      if (workspaceMode() === "canvas" && plot.type === "detail") {
        var parent = core.sourcePlotOf(project, plot);
        var parentInst = parent ? core.findInstance(activeCanvas(), parent.id) : null;
        if (parent && parentInst) {
          var scaleX = parent.layout.width ? parentInst.width / parent.layout.width : 1;
          var scaleY = parent.layout.height ? parentInst.height / parent.layout.height : 1;
          return {
            x: parentInst.x + (layout.x - parent.layout.x) * scaleX,
            y: parentInst.y + (layout.y - parent.layout.y) * scaleY,
            width: layout.width * scaleX,
            height: layout.height * scaleY,
            scaleX: scaleX,
            scaleY: scaleY,
            instance: null
          };
        }
      }
      if (workspaceMode() === "plot") {
        var stage = plotStageBox();
        return {
          x: layout.x - stage.x,
          y: layout.y - stage.y,
          width: layout.width,
          height: layout.height,
          scaleX: 1,
          scaleY: 1,
          instance: null
        };
      }
      return { x: layout.x, y: layout.y, width: layout.width, height: layout.height, scaleX: 1, scaleY: 1, instance: null };
    }

    function plotStageBox() {
      var plot = selectedPlot();
      if (plot && plot.type === "detail") plot = core.sourcePlotOf(project, plot) || plot;
      var members = plot ? [plot].concat(core.detailChildren(project, plot.id).filter(function (item) { return item.visible !== false; })) : [];
      if (!members.length) return { x: 0, y: 0, width: project.canvas.width, height: project.canvas.height };
      var minX = Infinity;
      var minY = Infinity;
      var maxX = -Infinity;
      var maxY = -Infinity;
      members.forEach(function (item) {
        minX = Math.min(minX, item.layout.x);
        minY = Math.min(minY, item.layout.y);
        maxX = Math.max(maxX, item.layout.x + item.layout.width);
        maxY = Math.max(maxY, item.layout.y + item.layout.height);
      });
      return {
        x: minX,
        y: minY,
        width: Math.max(1, Math.ceil(maxX - minX)),
        height: Math.max(1, Math.ceil(maxY - minY))
      };
    }

    function stageMetrics() {
      if (workspaceMode() === "plot") {
        var stage = plotStageBox();
        return { width: stage.width, height: stage.height };
      }
      return { width: project.canvas.width, height: project.canvas.height };
    }

    function selectedInstances() {
      var canvas = activeCanvas();
      if (!canvas) return [];
      return selectedInstanceIds.map(function (id) {
        return (canvas.instances || []).find(function (item) { return item.id === id; });
      }).filter(Boolean);
    }

    function selectInstances(ids) {
      var canvas = activeCanvas();
      var valid = (ids || []).filter(function (id) {
        return canvas && (canvas.instances || []).some(function (item) { return item.id === id; });
      });
      selectedInstanceIds = valid;
      if (valid.length === 1) {

        selectedPlotId = inst.plotId;
        workspaceFocus = { type: "instance", id: inst.id, plotId: inst.plotId };
        setSelectedObject({ type: "plot", figureId: inst.plotId, objectId: inst.plotId });
      } else if (valid.length > 1) {
        workspaceFocus = { type: "instances", ids: valid.slice() };
        setSelectedObject(null);
      } else if (canvas) {
        workspaceFocus = { type: "canvas", id: canvas.id };

      renderCanvas();

      renderLayers();
    }

    function alignSelectedInstances(command) {
      var items = selectedInstances();
      if (items.length < 2) return;
      if ((command === "hspace" || command === "vspace") && items.length < 3) {
        setStatus("等间距至少需要三个图窗。", "");
        return;
      }
      commitEdit("Align instances", function () {
        var minX = Math.min.apply(null, items.map(function (item) { return item.x; }));
        var minY = Math.min.apply(null, items.map(function (item) { return item.y; }));
        var maxR = Math.max.apply(null, items.map(function (item) { return item.x + item.width; }));
        var maxB = Math.max.apply(null, items.map(function (item) { return item.y + item.height; }));
        if (command === "left") items.forEach(function (item) { item.x = minX; });
        if (command === "right") items.forEach(function (item) { item.x = Math.round(maxR - item.width); });
        if (command === "hcenter") items.forEach(function (item) { item.x = Math.round((minX + maxR) / 2 - item.width / 2); });
        if (command === "top") items.forEach(function (item) { item.y = minY; });
        if (command === "bottom") items.forEach(function (item) { item.y = Math.round(maxB - item.height); });
        if (command === "vcenter") items.forEach(function (item) { item.y = Math.round((minY + maxB) / 2 - item.height / 2); });
        if (command === "hspace" || command === "vspace") {
          var horizontal = command === "hspace";
          var sorted = items.slice().sort(function (a, b) { return horizontal ? a.x - b.x : a.y - b.y; });
          var start = horizontal ? sorted[0].x : sorted[0].y;
          var end = horizontal ? sorted[sorted.length - 1].x + sorted[sorted.length - 1].width : sorted[sorted.length - 1].y + sorted[sorted.length - 1].height;
          var span = sorted.reduce(function (sum, item) { return sum + (horizontal ? item.width : item.height); }, 0);
          var gap = (end - start - span) / (sorted.length - 1);
          var cursor = start;
          sorted.forEach(function (item) {
            if (horizontal) item.x = Math.round(cursor);
            else item.y = Math.round(cursor);
            cursor += (horizontal ? item.width : item.height) + gap;
          });
        }
      });
      renderCanvas();
      renderProps();
    }

    function paintMarquee(x, y, w, h) {
      var node = paper.querySelector(".tv-marquee");
      if (!node) {
        node = document.createElement("div");
        node.className = "tv-marquee";
        paper.appendChild(node);
      }
      node.style.left = x + "px";
      node.style.top = y + "px";
      node.style.width = w + "px";
      node.style.height = h + "px";
    }

    function finishInstanceMarquee(event) {
      if (!instanceMarquee || instanceMarquee.pointerId !== event.pointerId) return;
      var rect = paper.getBoundingClientRect();
      var zoom = canvasZoom() || 1;
      var x = (event.clientX - rect.left) / zoom;
      var y = (event.clientY - rect.top) / zoom;
      var box = {
        x: Math.min(instanceMarquee.x, x),
        y: Math.min(instanceMarquee.y, y),
        w: Math.abs(x - instanceMarquee.x),
        h: Math.abs(y - instanceMarquee.y)
      };
      var shift = instanceMarquee.shift;
      instanceMarquee = null;
      var drawn = paper.querySelector(".tv-marquee");
      if (drawn) drawn.remove();
      var canvas = activeCanvas();
      var items = canvas ? (canvas.instances || []).filter(function (item) { return item.visible !== false; }) : [];
      var picked = [];
      if (box.w < 4 && box.h < 4) {
        var hits = items.filter(function (item) {
          return x >= item.x && x <= item.x + item.width && y >= item.y && y <= item.y + item.height;
        }).sort(function (a, b) { return (b.zOrder || 0) - (a.zOrder || 0); });
        if (hits[0]) picked = [hits[0].id];
      } else {
        picked = items.filter(function (item) {
          return item.x < box.x + box.w && item.x + item.width > box.x && item.y < box.y + box.h && item.y + item.height > box.y;
        }).map(function (item) { return item.id; });
      }
      var next = shift ? selectedInstanceIds.slice() : [];
      if (shift && box.w < 4 && box.h < 4 && picked.length) {
        var at = next.indexOf(picked[0]);
        if (at >= 0) next.splice(at, 1);
        else next.push(picked[0]);
      } else {
        picked.forEach(function (id) { if (next.indexOf(id) < 0) next.push(id); });
      }
      selectInstances(next);
    }

    function stagePlots() {
      if (workspaceMode() === "plot") {
        var plot = selectedPlot();
        if (plot && plot.type === "detail") plot = core.sourcePlotOf(project, plot) || plot;
        if (!plot) return [];
        var ids = {};
        ids[plot.id] = true;

        return core.plotsInLayerOrder(project).filter(function (item) { return ids[item.id] && item.visible !== false; });
      }
      var canvas = activeCanvas();

      return core.plotsInLayerOrder(project).filter(function (plot) {
        if (plot.visible === false) return false;

    function exportPlotTarget() {

    function buildPlotFamilySvg(plot) {
      var host = plot && plot.type === "detail" ? (core.sourcePlotOf(project, plot) || plot) : plot;
      if (!host) return null;
      var members = [host].concat(core.detailChildren(project, host.id).filter(function (item) { return item.visible !== false; }));
      var minX = Infinity;
      var minY = Infinity;
      var maxX = -Infinity;
      var maxY = -Infinity;
      members.forEach(function (item) {
        minX = Math.min(minX, item.layout.x);
        minY = Math.min(minY, item.layout.y);
        maxX = Math.max(maxX, item.layout.x + item.layout.width);
        maxY = Math.max(maxY, item.layout.y + item.layout.height);
      });
      var width = Math.max(1, Math.ceil(maxX - minX));
      var height = Math.max(1, Math.ceil(maxY - minY));
      var svg = createSvg("svg", {
        xmlns: svgNamespace,
        width: width,
        height: height,
        viewBox: "0 0 " + width + " " + height
      });
      appendSvg(svg, "rect", { width: width, height: height, fill: theme().surface });
      var group = createSvg("g", { transform: "translate(" + (-minX) + " " + (-minY) + ")" });
      intrinsicLayout = true;
      var nodes = {};
      members.forEach(function (item) {
        var nested = buildPlotSvg(item, item.layout.width, item.layout.height, false);
        nested.setAttribute("x", item.layout.x);
        nested.setAttribute("y", item.layout.y);
        nodes[item.id] = nested;
      });
      members.forEach(function (item) {
        if (item.type === "detail") appendDetailConnectors(group, function (entry) { return nodes[entry.id]; }, item);
        if (nodes[item.id]) group.appendChild(nodes[item.id]);
      });
      intrinsicLayout = false;
      svg.appendChild(group);
      return svg;
    }

    function saveSvgElement(svg, filename, okText) {
      var blob = new Blob([svgFileText(svg)], { type: "image/svg+xml;charset=utf-8" });
      saveBlobWithPicker(blob, filename, [{
        description: "SVG Image",
        accept: { "image/svg+xml": [".svg"] }
      }]).then(function (handle) {
        if (handle === null) return;
        setStatus(okText, "ok");
      }).catch(function (error) {
        setStatus("SVG 导出失败：" + (error && error.message ? error.message : String(error)), "error");
      });
    }

    function savePngElement(svg, filename, okText) {
      var text = svgFileText(svg);
      var width = Number(svg.getAttribute("width")) || project.canvas.width;
      var height = Number(svg.getAttribute("height")) || project.canvas.height;
      var image = new Image();
      var url = URL.createObjectURL(new Blob([text], { type: "image/svg+xml;charset=utf-8" }));
      image.onload = function () {
        var canvas = document.createElement("canvas");
        canvas.width = width * 2;
        canvas.height = height * 2;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = theme().surface;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          if (!blob) return setStatus("PNG 导出失败。", "error");
          saveBlobWithPicker(blob, filename, [{
            description: "PNG Image",
            accept: { "image/png": [".png"] }
          }]).then(function (handle) {
            if (handle === null) return;
            setStatus(okText, "ok");
          }).catch(function (error) {
            setStatus("PNG 导出失败：" + (error && error.message ? error.message : String(error)), "error");
          });
        }, "image/png");
      };
      image.onerror = function () {
        URL.revokeObjectURL(url);
        setStatus("PNG 导出失败。", "error");
      };
      image.src = url;
    }

    function exportCurrentPlot(kind) {

      if (kind === "png") savePngElement(svg, name, "已导出图窗 PNG，不含整张画布。");
      else saveSvgElement(svg, name, "已导出图窗 SVG，不含整张画布。");
    }

    function dockCard(label, color, selected, thumb) {

    function plotThumb(plot) {
      var series = core.resolvePlotSeries(project, plot).filter(function (item) {
        return item.visible !== false && item.series && item.series.x && item.series.x.length > 1;
      });
      var key = [plot.id, plot.accentColor, series.map(thumbSignature).join(",")].join("|");
      if (thumbCache[plot.id] && thumbCache[plot.id].key === key) return thumbCache[plot.id].node.cloneNode(true);
      var svg = series.length ? curveThumb(series) : null;
      if (!svg) {
        svg = buildPlotSvg(plot, plot.layout.width, plot.layout.height, false);
        var bg = svg.querySelector("rect");
        if (bg) bg.setAttribute("fill", "transparent");
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        svg.removeAttribute("aria-label");
      }
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");
      svg.setAttribute("aria-hidden", "true");
      svg.style.pointerEvents = "none";
      thumbCache[plot.id] = { key: key, node: svg };
      return svg.cloneNode(true);
    }

    function thumbSignature(item) {
      var y = item.series.y || [];
      var step = Math.max(1, Math.floor(y.length / 16));
      var acc = 0;
      for (var i = 0; i < y.length; i += step) acc += Number(y[i]) || 0;
      return [item.series.id, item.color, y.length, y[0], y[y.length - 1], Math.round(acc)].join(":");
    }

    function curveThumb(series) {
      var minX = Infinity;
      var maxX = -Infinity;
      var minY = Infinity;
      var maxY = -Infinity;
      series.forEach(function (item) {
        var xs = item.series.x;
        var ys = item.series.y;
        var step = Math.max(1, Math.floor(xs.length / 64));
        for (var i = 0; i < xs.length; i += step) noteThumbPoint(xs[i], ys[i]);
        noteThumbPoint(xs[xs.length - 1], ys[ys.length - 1]);
      });
      function noteThumbPoint(rawX, rawY) {
        var x = Number(rawX);
        var y = Number(rawY);
        if (!Number.isFinite(x) || !Number.isFinite(y)) return;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
      if (!Number.isFinite(minX)) return null;
      var dx = (maxX - minX) || 1;

    function buildAxisSection(plot, axis, axisName) {
      var key = axisName === "X" ? "xAxis" : "yAxis";
      var sec = section(axisName === "X" ? "X Axis" : "Y Axis", false, key);
      var parts = axisFields(plot, axis, axisName);
      var line = section("轴线与刻度", false, key + ".line");
      appendNodes(line.body, parts.line);
      var title = section("轴标题", false, key + ".title");
      appendNodes(title.body, parts.title);
      sec.body.append(line.wrap, title.wrap);
      if (parts.range) {
        var range = section("范围与缩放", false, key + ".range");
        appendNodes(range.body, parts.range);
        if (axisName === "X") {
          var resetView = document.createElement("button");
          resetView.type = "button";
          resetView.className = "tv-button";
          resetView.textContent = "重置视图";
          resetView.addEventListener("pointerdown", function (event) { event.stopPropagation(); });

            renderCanvas();
            renderProps();
          });
          range.body.appendChild(resetView);
        }
        sec.body.appendChild(range.wrap);

      if (parts.time && parts.time.length) {
        var time = section("时间单位", false, key + ".time");
        appendNodes(time.body, parts.time);

      }
      if (axisName === "X") {

      function rangeEditor(label, axis) {
        var cap = document.createElement("span");
        cap.className = "tv-prop-label";
        cap.textContent = label;

        var box = document.createElement("input");
        box.type = "checkbox";

        from.input.type = "number";
        to.input.type = "number";
        from.input.disabled = box.checked;
        to.input.disabled = box.checked;
        function commitRange() {
          if (!box.checked) {
            var low = Number(from.input.value);
            var high = Number(to.input.value);
            if (!Number.isFinite(low) || !Number.isFinite(high) || low === high) {
              setStatus("范围需要两个不同的有效数字。", "error");
              return;
            }
          }
          commitEdit("Inset range", function () {
            axis.auto = box.checked;
            if (!box.checked) {
              var low = Number(from.input.value);
              var high = Number(to.input.value);
              axis.min = Math.min(low, high);
              axis.max = Math.max(low, high);
            }
          });
          from.input.value = axis.min == null ? "" : axis.min;
          to.input.value = axis.max == null ? "" : axis.max;
          from.input.disabled = axis.auto !== false;
          to.input.disabled = axis.auto !== false;
          renderCanvas();
        }
        box.addEventListener("change", commitRange);
        from.input.addEventListener("change", commitRange);
        to.input.addEventListener("change", commitRange);

    function plotSvg(plot) {

    function figureGroups(plot) {
      var groups = [];
      var byId = {};
      (plot.seriesRefs || []).forEach(function (ref) {
        var series = core.findSeries(project, ref.seriesId);
        var datasetId = series ? series.datasetId : "";
        if (!byId[datasetId]) {
          byId[datasetId] = {
            datasetId: datasetId,
            dataset: series ? core.findDataset(project, datasetId) : null,
            refs: []
          };
          groups.push(byId[datasetId]);
        }
        byId[datasetId].refs.push(ref);
      });
      return groups;
    }

    function appendFigureGroups(plot, body) {
      if (!plot.seriesRefs || !plot.seriesRefs.length) return;
      var resolved = {};
      core.resolvePlotSeries(project, plot).forEach(function (item) { resolved[item.series.id] = item; });
      figureGroups(plot).forEach(function (group) {
        var key = plot.id + "\0" + group.datasetId;
        var expanded = !!expandedFigureGroups[key];
        if (pendingEditFocus.indexOf("series:") === 0 && group.refs.some(function (ref) { return pendingEditFocus === "series:" + ref.seriesId; })) {
          expanded = true;
          expandedFigureGroups[key] = true;
          var wantedSeries = pendingEditFocus.slice("series:".length);
          plot.seriesRefs.forEach(function (ref) { ref.selected = ref.seriesId === wantedSeries; });
          selectedRefIndex = Math.max(0, plot.seriesRefs.findIndex(function (ref) { return ref.seriesId === wantedSeries; }));
        }
        var dataset = group.dataset;
        var total = dataset ? dataset.series.length : group.refs.length;
        var wrap = document.createElement("div");
        wrap.className = "tv-fig-group";
        var head = document.createElement("div");
        head.className = "tv-fig-group-head";
        var toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "tv-dataset-toggle";
        toggle.textContent = expanded ? "▼" : "▶";
        toggle.setAttribute("aria-expanded", expanded ? "true" : "false");

        toggle.setAttribute("aria-label", (expanded ? "收起 " : "展开 ") + label);
        var name = document.createElement("span");
        name.className = "tv-fig-group-name";
        name.textContent = label;
        var count = document.createElement("span");
        count.className = "tv-fig-group-count";
        count.textContent = "已加入 " + group.refs.length + "/" + total;
        var styleBtn = document.createElement("button");
        styleBtn.type = "button";
        styleBtn.className = "tv-button tv-button--tiny";
        styleBtn.textContent = "样式";
        styleBtn.disabled = !dataset;
        styleBtn.addEventListener("click", function (event) {
          event.stopPropagation();
          openGroupStyleKey = openGroupStyleKey === key ? null : key;
          expandedFigureGroups[key] = true;
          renderProps();
        });
        var remove = document.createElement("button");
        remove.type = "button";
        remove.className = "tv-icon-button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "从当前图移除 " + label);
        remove.addEventListener("click", function (event) {
          event.stopPropagation();

        if (expanded) {
          group.refs.forEach(function (ref) {

            var originalName = series ? core.seriesOriginalName(series) : ref.seriesId;

    function formatMagnification(plot) {

    function deletePlot(id) {
      var plot = project.plots.find(function (item) { return item.id === id; });
      if (plot && plot.type !== "detail") {
        var usage = core.plotWindowUsage(project, id);
        var children = core.detailChildren(project, id);
        var message = "删除图窗「" + core.plotEditorName(plot) + "」？";
        if (usage.length) message += "它还被这些画布使用：" + usage.join("、") + "。相关实例会一起去掉。";
        if (children.length) message += "包含 " + children.length + " 个局部视图。";
        if (!window.confirm(message)) return;
        commitEdit("Delete plot", function () { core.deletePlotWindow(project, id, true); });
      } else {
        commitEdit("Delete plot", function () { core.removePlot(project, id); });
      }
      if (!project.plots.some(function (item) { return item.id === selectedPlotId; })) {
        selectedPlotId = project.plots[0] ? project.plots[0].id : null;
      }
      delete thumbCache[id];
      delete previewCache[id];
      if (dockPreviewId === id) hideDockPreview();
      setDirty(true);
      setStatus("已删除图。", "ok");
      renderAll();
    }

    function importFiles(files) {
      var list = Array.from(files || []).filter(function (file) { return /\.csv$/i.test(file.name); });
      if (!list.length) return setStatus("请选择 CSV 文件。", "error");
      var names = [];
      var errors = [];
      var chain = Promise.resolve();
      list.forEach(function (file) {
        chain = chain.then(function () {
          return file.text().then(function (text) {
            var timeUnit = "s";
            var plot = selectedPlot();
            if (plot && plot.xAxis && plot.xAxis.time && plot.xAxis.time.sourceUnit) {
              timeUnit = plot.xAxis.time.sourceUnit;
            }
            var dataset = core.parseDatasetFromCsv(text, {
              name: file.name,
              sourceFilename: file.name,
              timeUnit: timeUnit
            });
            core.addDataset(project, dataset);
            names.push(dataset.name);
            if (dataset.warnings && dataset.warnings.length) {
              errors.push(file.name + "：" + dataset.warnings[0]);
            }
          }).catch(function (error) {
            errors.push(file.name + "：" + (error.message || String(error)));
          });
        });
      });
      chain.then(function () {
        if (names.length) {
          clearDataSelection();
          setDirty(true);
        }
        if (errors.length && names.length) setStatus("已导入 " + names.length + " 个；失败 " + errors.length + " 个。" + errors[0], "error");
        else if (errors.length) setStatus(errors[0], "error");
        else setStatus("已导入 " + names.length + " 个数据源：" + names.join("、") + "。", "ok");
        renderAll();
      });
    }

      selectedPlotId = (next.ui && next.ui.activePlotId && next.plots.some(function (item) { return item.id === next.ui.activePlotId; }))
        ? next.ui.activePlotId
        : (next.plots[0] ? next.plots[0].id : null);
      if (!next.canvases || !next.canvases.length) core.migrateLegacyWorkspace(next, null);
      var openedCanvas = core.findCanvas(next, next.ui && next.ui.activeCanvasId) || (next.canvases || [])[0];
      if (openedCanvas) core.mirrorCanvas(next, openedCanvas.id);
      selectedInstanceIds = [];

      inspectorFilter = "";

    function rememberSavedName(handle, filename) {
      var name = core.projectNameFromFilename((handle && handle.name) || filename || "");
      if (name) project.projectName = name;
      projectFileHandle = handle || projectFileHandle;
      setDirty(false);
      setStatus("已保存到 " + ((handle && handle.name) || filename) + "。", "ok");
    }

    function writeTextToHandle(handle, text) {
      return handle.createWritable().then(function (writable) {
        return writable.write(text).then(function () { return writable.close(); });
      });
    }

    function saveProjectAs() {
      var filename = projectFilename(project.projectName);
      pickSaveFile(filename, [{
        description: "Trajectory Visualizer Project",
        accept: { "application/json": [".json"] }
      }]).then(function (handle) {
        if (!handle) return;
        if (handle !== "download") {
          var name = core.projectNameFromFilename(handle.name || filename);
          if (name) project.projectName = name;
        } else {
          var fallbackName = core.projectNameFromFilename(filename);
          if (fallbackName) project.projectName = fallbackName;
        }
        var blob = new Blob([core.serializeProject(project)], { type: "application/json;charset=utf-8" });
        if (handle === "download") {
          downloadBlob(blob, filename);
          rememberSavedName(null, filename);
          return;
        }
        return writeBlobToHandle(handle, blob).then(function () {
          rememberSavedName(handle, filename);
        });
      }).catch(function (error) {
        setStatus("保存失败：" + (error && error.message ? error.message : String(error)), "error");
      });
    }

    function saveProject() {
      if (projectFileHandle) {
        writeTextToHandle(projectFileHandle, core.serializeProject(project)).then(function () {
          rememberSavedName(projectFileHandle, projectFileHandle.name);
        }).catch(function (error) {
          setStatus("保存失败：" + (error && error.message ? error.message : String(error)), "error");
        });
        return;
      }
      saveProjectAs();
    }

    function openProjectFromDisk() {
      if (canUseOpenPicker()) {
        window.showOpenFilePicker({
          multiple: false,
          types: [{
            description: "Trajectory Visualizer Project",
            accept: { "application/json": [".json"] }
          }]
        }).then(function (handles) {
          var handle = handles && handles[0];

          return handle.getFile().then(function (file) {

        }).catch(function (error) {
          if (error && error.name === "AbortError") return;
          document.getElementById("tvProjectInput").click();
        });
        return;
      }
      document.getElementById("tvProjectInput").click();

    function exportSvg() {

      saveBlobWithPicker(blob, name, [{

      }]).then(function (handle) {

    function exportPng() {
      var svg = buildCanvasSvg();
      var text = svgFileText(svg);
      var image = new Image();
      var url = URL.createObjectURL(new Blob([text], { type: "image/svg+xml;charset=utf-8" }));
      image.onload = function () {
        var canvas = document.createElement("canvas");
        canvas.width = project.canvas.width * 2;
        canvas.height = project.canvas.height * 2;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = theme().surface;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          if (!blob) return setStatus("PNG 导出失败。", "error");
          var name = exportSuggestedName("png");
          saveBlobWithPicker(blob, name, [{
            description: "PNG Image",
            accept: { "image/png": [".png"] }
          }]).then(function (handle) {
            if (handle === null) return;
            setStatus(handle === "download" ? "已导出当前画布 PNG。" : "已保存 PNG：" + (handle.name || name) + "。", "ok");
          }).catch(function (error) {
            setStatus("PNG 导出失败：" + (error && error.message ? error.message : String(error)), "error");
          });
        }, "image/png");
      };
      image.onerror = function () {
        URL.revokeObjectURL(url);
        setStatus("PNG 导出失败。", "error");
      };
      image.src = url;
    }

    function bindSplitter(el, side) {
      el.addEventListener("pointerdown", function (event) {
        splitterDrag = { side: side, startX: event.clientX, startLeft: uiState().leftPanelWidth, startRight: uiState().rightPanelWidth };
        el.classList.add("is-active");
        el.setPointerCapture(event.pointerId);
      });
      el.addEventListener("pointermove", function (event) {
        if (!splitterDrag || splitterDrag.side !== side) return;
        var dx = event.clientX - splitterDrag.startX;
        var ui = uiState();
        if (side === "left") ui.leftPanelWidth = core.clamp(splitterDrag.startLeft + dx, 220, 600);
        else ui.rightPanelWidth = core.clamp(splitterDrag.startRight - dx, 260, 650);
        applyPanelLayout();
      });
      el.addEventListener("pointerup", function () {
        if (!splitterDrag) return;
        splitterDrag = null;
        el.classList.remove("is-active");
        setDirty(true);
      });
      el.addEventListener("dblclick", function () {
        var ui = uiState();
        if (side === "left") ui.leftPanelWidth = 268;
        else ui.rightPanelWidth = 300;
        applyPanelLayout();
        setDirty(true);
      });
    }

        var box = el("div", "tv-update-status");
        box.setAttribute("data-status", status);
        box.setAttribute("role", "status");
        if (status === "checking") {
          var line = el("p", "tv-update-heading");
          line.appendChild(el("span", "tv-about-spin"));
          line.appendChild(document.createTextNode("正在检查更新…"));
          box.appendChild(line);
        } else if (status === "up-to-date") {
          box.appendChild(el("p", "tv-update-heading", "当前版本不低于最新正式版本"));
          box.appendChild(el("p", "", "当前版本"));
          box.appendChild(el("p", "tv-update-version", "v" + updateState.currentVersion));
          box.appendChild(el("p", "", "最新版本"));
          box.appendChild(el("p", "tv-update-version", "v" + (updateState.latestVersion || updateState.currentVersion)));
        } else if (status === "available") {
          box.appendChild(el("p", "tv-update-heading", "发现新版本"));
          box.appendChild(el("p", "", "当前版本"));
          box.appendChild(el("p", "tv-update-version", "v" + updateState.currentVersion));
          box.appendChild(el("p", "", "最新版本"));
          box.appendChild(el("p", "tv-update-version", "v" + updateState.latestVersion));
          if (updateState.releaseName) box.appendChild(el("p", "", updateState.releaseName));
          var published = formatReleaseDate(updateState.publishedAt);
          if (published) box.appendChild(el("p", "", "发布日期：" + published));
          box.appendChild(el("p", "tv-update-heading", "更新内容"));
          box.appendChild(el("pre", "tv-update-notes", updateState.releaseNotes || "此版本没有文字说明。"));
          if (updateState.errorCode === "ASSET_NOT_FOUND" && updateState.errorMessage) {
            box.appendChild(el("p", "", updateState.errorMessage));
          }
        } else {
          box.appendChild(el("p", "tv-update-heading", "无法检查更新"));
          box.appendChild(el("p", "", updateState.errorMessage || "无法连接到 GitHub，请检查网络后重试。"));
        }
        aboutBody.appendChild(box);
      }

      var actions = el("div", "tv-update-actions");
      if (status === "available") {
        actions.appendChild(actionButton("查看更新", "open-release", false));
        actions.appendChild(actionButton("获取最新版", "download-update", true));
      } else if (status === "error") {
        var retry = actionButton("稍后重试", "check-update", false);
        actions.appendChild(retry);
        actions.appendChild(actionButton("打开 Releases 页面", "open-release", false));
      } else {
        var check = actionButton("检查更新", "check-update", false);
        check.disabled = status === "checking";
        actions.appendChild(check);
      }
      aboutBody.appendChild(actions);
      var releases = actionButton("GitHub Releases", "open-releases", false);
      releases.className = "tv-about-releases";
      aboutBody.appendChild(releases);
    }

    function handleCheckUpdate() {
      if (updateState.status === "checking") return;
      updateState = core.createUpdateState();
      updateState.status = "checking";
      renderAbout();
      var ticket = ++checkTicket;
      core.checkForUpdates().then(function (next) {
        if (ticket !== checkTicket) return;
        updateState = next;
        rememberUpdateCheck();
        if (next.status === "error") console.error("Visualizer update check failed:", next.errorCode);
        if (aboutDialog.open) renderAbout();
      });
    }

    function handleOpenReleasePage() {
      openExternal(updateState.releaseUrl || core.githubReleasesPageUrl());
    }

    function handleDownloadUpdate() {
      if (!updateState.downloadUrl) {
        handleOpenReleasePage();
        return;
      }
      openExternal(updateState.downloadUrl);
    }

    function closeAbout() {
      if (updateState.status !== "checking") updateState = core.createUpdateState();
      if (aboutDialog.open && typeof aboutDialog.close === "function") aboutDialog.close();
      else aboutDialog.removeAttribute("open");
    }

    aboutDialog.addEventListener("click", function (event) {
      var node = event.target && event.target.closest ? event.target.closest("[data-role]") : null;
      var role = node && node.getAttribute("data-role");
      if (role === "check-update") handleCheckUpdate();
      else if (role === "download-update") handleDownloadUpdate();
      else if (role === "open-release") handleOpenReleasePage();
      else if (role === "open-releases") openExternal(core.githubReleasesPageUrl());
      else if (role === "dismiss-update") closeAbout();
    });
    document.getElementById("tvAboutOpen").addEventListener("click", function () {
      renderAbout();
      if (aboutDialog.open) return;
      if (typeof aboutDialog.showModal === "function") aboutDialog.showModal();
      else aboutDialog.setAttribute("open", "");
    });
    aboutDialog.addEventListener("cancel", function (event) {
      event.preventDefault();
      closeAbout();
    });
    document.getElementById("tvAboutClose").addEventListener("click", closeAbout);
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && aboutDialog.open) closeAbout();
    });
  }());
  </script>
</body>
</html>
