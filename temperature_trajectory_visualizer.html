      }
      var main = source ? span(source) : {};
      var inset = span(plot);
      var mainArea = areaOf(source);
      var insetArea = areaOf(plot);
      main.plotWidth = mainArea && mainArea.width;
      main.plotHeight = mainArea && mainArea.height;
      inset.plotWidth = insetArea && insetArea.width;
      inset.plotHeight = insetArea && insetArea.height;
      var mag = core.effectiveMagnification(main, inset);

    function importFiles(files) {
      var list = Array.from(files || []).filter(function (file) { return /\.csv$/i.test(file.name); });
      if (!list.length) return setStatus("请选择 CSV 文件。", "error");
      var names = [];
      var errors = [];
      var chain = Promise.resolve();
      list.forEach(function (file) {
        chain = chain.then(function () {
          return file.text().then(function (text) {
            var timeUnit = "s";
            var plot = selectedPlot();
            if (plot && plot.xAxis && plot.xAxis.time && plot.xAxis.time.sourceUnit) {
              timeUnit = plot.xAxis.time.sourceUnit;
            }
            var dataset = core.parseDatasetFromCsv(text, {
              name: file.name,
              sourceFilename: file.name,
              timeUnit: timeUnit
            });
            core.addDataset(project, dataset);
            names.push(dataset.name);
            if (dataset.warnings && dataset.warnings.length) {
              errors.push(file.name + "：" + dataset.warnings[0]);
            }
          }).catch(function (error) {
            errors.push(file.name + "：" + (error.message || String(error)));
          });
        });
      });
      chain.then(function () {
        if (names.length) {
          clearDataSelection();
          setDirty(true);
        }
        if (errors.length && names.length) setStatus("已导入 " + names.length + " 个；失败 " + errors.length + " 个。" + errors[0], "error");
        else if (errors.length) setStatus(errors[0], "error");
        else setStatus("已导入 " + names.length + " 个数据源：" + names.join("、") + "。", "ok");
        renderAll();
      });
    }

    function rememberSavedName(handle, filename) {
      var name = core.projectNameFromFilename((handle && handle.name) || filename || "");
      if (name) project.projectName = name;
      projectFileHandle = handle || projectFileHandle;
      setDirty(false);
      setStatus("已保存到 " + ((handle && handle.name) || filename) + "。", "ok");

    function writeTextToHandle(handle, text) {
      return handle.createWritable().then(function (writable) {
        return writable.write(text).then(function () { return writable.close(); });
      });
    }

    function saveProjectAs() {
      var filename = projectFilename(project.projectName);
      pickSaveFile(filename, [{
        description: "Trajectory Visualizer Project",
        accept: { "application/json": [".json"] }
      }]).then(function (handle) {
        if (!handle) return;
        if (handle !== "download") {
          var name = core.projectNameFromFilename(handle.name || filename);
          if (name) project.projectName = name;
        } else {
          var fallbackName = core.projectNameFromFilename(filename);
          if (fallbackName) project.projectName = fallbackName;
        }
        var blob = new Blob([core.serializeProject(project)], { type: "application/json;charset=utf-8" });
        if (handle === "download") {
          downloadBlob(blob, filename);
          rememberSavedName(null, filename);
          return;
        }
        return writeBlobToHandle(handle, blob).then(function () {
          rememberSavedName(handle, filename);
        });
      }).catch(function (error) {
        setStatus("保存失败：" + (error && error.message ? error.message : String(error)), "error");
      });
    }

    function saveProject() {
      if (projectFileHandle) {
        writeTextToHandle(projectFileHandle, core.serializeProject(project)).then(function () {
          rememberSavedName(projectFileHandle, projectFileHandle.name);
        }).catch(function (error) {
          setStatus("保存失败：" + (error && error.message ? error.message : String(error)), "error");
        });
        return;
      }
      saveProjectAs();
    }

    function exportPng() {
      var svg = buildCanvasSvg();
      var text = svgFileText(svg);
      var image = new Image();
      var url = URL.createObjectURL(new Blob([text], { type: "image/svg+xml;charset=utf-8" }));
      image.onload = function () {
        var canvas = document.createElement("canvas");
        canvas.width = project.canvas.width * 2;
        canvas.height = project.canvas.height * 2;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = theme().surface;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          if (!blob) return setStatus("PNG 导出失败。", "error");
          var name = exportSuggestedName("png");
          saveBlobWithPicker(blob, name, [{
            description: "PNG Image",
            accept: { "image/png": [".png"] }
          }]).then(function (handle) {
            if (handle === null) return;
            setStatus(handle === "download" ? "已导出当前画布 PNG。" : "已保存 PNG：" + (handle.name || name) + "。", "ok");
          }).catch(function (error) {
            setStatus("PNG 导出失败：" + (error && error.message ? error.message : String(error)), "error");
          });
        }, "image/png");
      };
      image.onerror = function () {
        URL.revokeObjectURL(url);
        setStatus("PNG 导出失败。", "error");
      };
      image.src = url;
    }

          var series = core.findSeries(project, id);
          return core.seriesDisplayName(series);
        });
        var rows = core.previewBatchRename(names, spec());
        var table = document.createElement("table");
        table.className = "tv-preview-table";
        table.innerHTML = "<thead><tr><th>原名称</th><th>新名称</th></tr></thead>";
        var body = document.createElement("tbody");
        var shown = rows.slice(0, 10);
        shown.forEach(function (row) {
          var tr = document.createElement("tr");
          var a = document.createElement("td");
          var b = document.createElement("td");
          a.textContent = row.before;
          b.textContent = "→  " + row.after;
          tr.append(a, b);
          body.appendChild(tr);
        });
        table.appendChild(body);
        tableWrap.replaceChildren(table);
        if (rows.length > 10) {
          var more = document.createElement("p");
          more.className = "tv-hint";
          more.textContent = "……以及另外 " + (rows.length - 10) + " 条";
          tableWrap.appendChild(more);
        }
        tableWrap.__rows = rows;
        tableWrap.__ids = ids;
        apply.textContent = "应用到 " + ids.length + " 条 Series";
        apply.disabled = !ids.length;
      }
      [scope, mode, find.input, replace.input, prefix.input, suffix.input, template.input, start.input].forEach(function (el) {
        el.addEventListener("input", refreshPreview);
        el.addEventListener("change", refreshPreview);
      });
      apply.addEventListener("click", function () {
        var ids = tableWrap.__ids || [];
        if (!ids.length) return;
        core.applyRenameToSeriesIds(project, ids, tableWrap.__rows || []);
        setDirty(true);
        if (typeof renameDialog.close === "function") renameDialog.close();
        else renameDialog.removeAttribute("open");
        renderAll();
        setStatus("已更新 " + ids.length + " 条显示名称。原始名称未改动。", "ok");
      });
      var hint = document.createElement("p");
      hint.className = "tv-hint";
      hint.textContent = "范围使用当前图的 Series 选择，与左侧数据源勾选无关。模板可用 {n} 与 {original}。";
      stage.append(scope, mode, find.wrap, replace.wrap, prefix.wrap, suffix.wrap, template.wrap, start.wrap, hint, tableWrap, apply);
      refreshPreview();
      if (typeof renameDialog.showModal === "function") renameDialog.showModal();
      else renameDialog.setAttribute("open", "open");
    }

    function closeLayoutMenu() {

    function bindSnapButton(plot, button) {

    function applyChosenLayout(templateId, primaryPlotId) {
      var plots = project.plots.slice();

      setStatus(templateId === "onePlusTwo" && primaryPlot

        : "已应用布局模板。", "ok");

    function showLayoutMenu() {
      closeLayoutMenu();

        var spec = core.LAYOUT_TEMPLATES[id];

        project.plots.forEach(function (plot) {
          var option = document.createElement("option");
          option.value = plot.id;
          option.textContent = core.plotEditorName(plot);
          primarySelect.appendChild(option);

      var active = selectedPlot();

      layoutMenu.appendChild(snapCap);
      if (active) {
        ["splitH", "splitV", "grid2x2", "onePlusTwo", "twoPlusOne"].forEach(function (id) {
          var spec = core.LAYOUT_TEMPLATES[id];
          var choice = document.createElement("div");
          choice.className = "tv-snap-choice";
          var icon = document.createElement("div");
          icon.className = "tv-snap-icon";
          icon.style.gridTemplateColumns = "repeat(" + spec.cols + ", 1fr)";
          icon.style.gridTemplateRows = "repeat(" + spec.rows + ", 1fr)";
          spec.spans.forEach(function (span, index) {
            var cell = document.createElement("button");
            cell.type = "button";
            cell.className = "tv-snap-slot";
            cell.style.gridColumn = (span[0] + 1) + " / span " + span[2];
            cell.style.gridRow = (span[1] + 1) + " / span " + span[3];
            cell.setAttribute("aria-label", spec.label + " 分区 " + (index + 1));
            cell.addEventListener("click", function (event) {
              event.stopPropagation();
              var plot = selectedPlot();
              if (!plot) return setStatus("请先选中一张图。", "error");
              commitEdit("Snap layout", function () {
                core.placePlotInSlot(plot, id, index, project.canvas);
              });
              closeLayoutMenu();
              renderAll();
              setStatus("已将「" + core.plotEditorName(plot) + "」放到「" + spec.label + "」。", "ok");
            });
            icon.appendChild(cell);
          });
          var cap = document.createElement("span");
          cap.textContent = spec.label;
          choice.append(icon, cap);
          layoutMenu.appendChild(choice);
        });
      }
      document.body.appendChild(layoutMenu);
    }

    function bindSplitter(el, side) {
      el.addEventListener("pointerdown", function (event) {
        splitterDrag = { side: side, startX: event.clientX, startLeft: uiState().leftPanelWidth, startRight: uiState().rightPanelWidth };
        el.classList.add("is-active");
        el.setPointerCapture(event.pointerId);
      });
      el.addEventListener("pointermove", function (event) {
        if (!splitterDrag || splitterDrag.side !== side) return;
        var dx = event.clientX - splitterDrag.startX;
        var ui = uiState();
        if (side === "left") ui.leftPanelWidth = core.clamp(splitterDrag.startLeft + dx, 220, 600);
        else ui.rightPanelWidth = core.clamp(splitterDrag.startRight - dx, 260, 650);
        applyPanelLayout();
      });
      el.addEventListener("pointerup", function () {
        if (!splitterDrag) return;
        splitterDrag = null;
        el.classList.remove("is-active");
        setDirty(true);
      });
      el.addEventListener("dblclick", function () {
        var ui = uiState();
        if (side === "left") ui.leftPanelWidth = 268;
        else ui.rightPanelWidth = 300;
        applyPanelLayout();
        setDirty(true);
      });
    }

    document.getElementById("tvCsvInput").addEventListener("change", function (event) {
      importFiles(event.target.files);
      event.target.value = "";
    });
    document.getElementById("tvNewProject").addEventListener("click", newProject);
    document.getElementById("tvOpenProject").addEventListener("click", openProjectFromDisk);
    document.getElementById("tvProjectInput").addEventListener("change", function (event) {

      event.target.value = "";

    document.getElementById("tvSaveProject").addEventListener("click", saveProject);
    document.getElementById("tvSaveProjectAs").addEventListener("click", saveProjectAs);
    document.querySelectorAll(".tv-menu").forEach(function (menu) {

    document.addEventListener("pointerdown", function (event) {
      document.querySelectorAll(".tv-menu[open]").forEach(function (menu) {
        if (!menu.contains(event.target)) menu.open = false;
      });
    });
    document.getElementById("tvNewPlot").addEventListener("click", function () {
      var plot = core.createPlot(project, { title: "Figure " + (project.plots.length + 1) });
      activatePlot(plot.id);
      core.syncCanvasToPlots(project);
      setDirty(true);

      renderAll();
    });
    document.getElementById("tvLayout").addEventListener("click", function (event) {
      event.stopPropagation();
      if (layoutMenu) closeLayoutMenu();
      else showLayoutMenu();
    });
    document.addEventListener("click", function (event) {
      if (layoutMenu && !layoutMenu.contains(event.target) && event.target.id !== "tvLayout") closeLayoutMenu();
      if (snapMenu && !snapMenu.contains(event.target) && !(event.target.closest && event.target.closest(".tv-plot-tools"))) closeSnapMenu();
    });
    document.getElementById("tvZoomIn").addEventListener("click", function () { setCanvasZoom(canvasZoom() + core.ZOOM_STEP); });
    document.getElementById("tvZoomOut").addEventListener("click", function () { setCanvasZoom(canvasZoom() - core.ZOOM_STEP); });
    document.getElementById("tvZoom100").addEventListener("click", function () { setCanvasZoom(1); });
    document.getElementById("tvZoomFit").addEventListener("click", fitCanvasView);
    document.getElementById("tvCollapseLeft").addEventListener("click", function () {
      uiState().leftPanelCollapsed = !uiState().leftPanelCollapsed;
      applyPanelLayout();
      setDirty(true);
    });
    function setRightTab(tab) {
      rightTab = tab === "layers" ? "layers" : "props";
      propsPanel.hidden = rightTab !== "props";
      layerPanel.hidden = rightTab !== "layers";
      document.getElementById("tvTabProps").setAttribute("aria-selected", rightTab === "props" ? "true" : "false");
      document.getElementById("tvTabLayers").setAttribute("aria-selected", rightTab === "layers" ? "true" : "false");
    }
    document.getElementById("tvTabProps").addEventListener("click", function () { setRightTab("props"); });
    document.getElementById("tvTabLayers").addEventListener("click", function () { setRightTab("layers"); renderLayers(); });
    document.getElementById("tvCollapseRight").addEventListener("click", function () {
      uiState().rightPanelCollapsed = !uiState().rightPanelCollapsed;
      applyPanelLayout();
      setDirty(true);
    });
    document.getElementById("tvRenameClose").addEventListener("click", function () {
      if (typeof renameDialog.close === "function") renameDialog.close();
      else renameDialog.removeAttribute("open");
    });
    bindSplitter(document.getElementById("tvSplitLeft"), "left");
    bindSplitter(document.getElementById("tvSplitRight"), "right");
    canvasScroll.addEventListener("pointerdown", function () { canvasActive = true; });
    canvasScroll.addEventListener("wheel", function (event) {
      if (!(event.ctrlKey || event.metaKey)) return;
      event.preventDefault();
      var delta = event.deltaY > 0 ? -core.ZOOM_STEP : core.ZOOM_STEP;
      setCanvasZoom(canvasZoom() + delta, event);
    }, { passive: false });
    document.getElementById("tvPreview").addEventListener("click", showPreview);
    document.getElementById("tvPreviewClose").addEventListener("click", function () {
      if (typeof previewDialog.close === "function") previewDialog.close();
      else previewDialog.removeAttribute("open");
    });
    document.getElementById("tvExportPng").addEventListener("click", exportPng);
    document.getElementById("tvExportSvg").addEventListener("click", exportSvg);
    document.addEventListener("mousedown", function (event) {
      dataPanelActive = !!(dataPanel.contains(event.target));
      propsPanelActive = !!(propsPanel.contains(event.target));
      canvasActive = !!(canvasScroll.contains(event.target));
      if (dataPanelActive) {
        var box = event.target.closest ? event.target.closest(".tv-dataset") : null;
        if (box && box.dataset.datasetId) activeDatasetId = box.dataset.datasetId;
      }
    }, true);
    dataPanel.addEventListener("focusin", function (event) {
      dataPanelActive = true;
      propsPanelActive = false;
      var box = event.target.closest ? event.target.closest(".tv-dataset") : null;
      if (box && box.dataset.datasetId) activeDatasetId = box.dataset.datasetId;
    });
    propsPanel.addEventListener("focusin", function () {
      propsPanelActive = true;
      dataPanelActive = false;
    });
    document.addEventListener("keydown", function (event) {
      if ((event.ctrlKey || event.metaKey) && !isTextEntry(document.activeElement) && event.key.toLowerCase() === "z") {
        event.preventDefault();
        applyHistory(event.shiftKey ? "redo" : "undo");
        return;
      }
      if (event.ctrlKey && !event.metaKey && !isTextEntry(document.activeElement) && event.key.toLowerCase() === "y") {
        event.preventDefault();
        applyHistory("redo");
        return;
      }
      if (event.key === "Escape" && !isTextEntry(document.activeElement)) {
        if (drag && drag.before) core.restoreEditorState(project, drag.before);
        drag = null;
        cursorHover = null;
        readoutCursor = null;
        pendingText = null;
        if (interactionMode !== "pointer") setInteractionMode("pointer");
        else {
          selectedObject = null;
          renderCanvas();
          renderProps();
        }
        return;
      }
      if ((event.key === "a" || event.key === "A") && (event.ctrlKey || event.metaKey)) {
        if (isTextEntry(document.activeElement)) return;
        if (propsPanelActive) {
          var plotForSelect = selectedPlot();
          if (!plotForSelect || !(plotForSelect.seriesRefs || []).length) return;
          event.preventDefault();
          applyFigureSelection(plotForSelect, { type: "selectAll" });
          renderProps();
          return;
        }
        if (!dataPanelActive) return;
        var dataset = activeDatasetId ? core.findDataset(project, activeDatasetId) : null;
        if (!dataset && project.datasets.length === 1) dataset = project.datasets[0];
        if (!dataset) return;
        event.preventDefault();
        activeDatasetId = dataset.id;
        applyDatasetSelection(dataset, { type: "selectAll" });
        renderData();
        return;
      }
      if ((event.ctrlKey || event.metaKey) && (canvasActive || canvasScroll.contains(document.activeElement))) {
        if (event.key === "=" || event.key === "+") {
          event.preventDefault();
          setCanvasZoom(canvasZoom() + core.ZOOM_STEP);
          return;
        }
        if (event.key === "-" || event.key === "_") {
          event.preventDefault();
          setCanvasZoom(canvasZoom() - core.ZOOM_STEP);
          return;
        }
        if (event.key === "0") {
          event.preventDefault();
          setCanvasZoom(1);
          return;
        }
      }
      if (event.key !== "Delete" && event.key !== "Backspace") return;
      if (isTextEntry(document.activeElement)) return;
      if (deleteSelectedObject()) return;
      if (!selectedPlotId) return;
      event.preventDefault();
      deletePlot(selectedPlotId);
    });
    window.addEventListener("beforeunload", function (event) {
      if (!dirty) return;
      event.preventDefault();
      event.returnValue = "";
    });
    app.addEventListener("dragover", function (event) { event.preventDefault(); });
    app.addEventListener("drop", function (event) {
      event.preventDefault();
      var files = Array.from(event.dataTransfer.files || []);
      var projectFile = files.find(function (file) { return /\.(tvproj\.json|tvproj|json)$/i.test(file.name); });
      if (projectFile) {
        projectFile.text().then(function (text) { openProjectText(text, projectFile.name); });
        return;
      }
      importFiles(files);
    });

    window.VisualizerApp = {
      getProject: function () { return project; },
      isDirty: function () { return dirty; },
      importCsvText: function (text, options) {
        var dataset = core.parseDatasetFromCsv(text, options || {});
        core.addDataset(project, dataset);
        clearDataSelection();
        setDirty(true);
        renderAll();
        return dataset.id;
      },
      addSeriesToPlot: function (plotId, seriesIds) {
        var plot = project.plots.find(function (item) { return item.id === plotId; });
        if (!plot) throw new Error("找不到图。");
        core.addSeriesToPlot(project, plot, seriesIds);
        selectedPlotId = plot.id;
        setDirty(true);
        renderAll();
      },
      selectPlot: function (plotId) {
        selectedPlotId = plotId;
        renderAll();
      },
      openProjectText: openProjectText,
      canvasSvgText: function () { return svgFileText(buildCanvasSvg()); },
      getLastCanvasSvg: function () { return lastCanvasSvg; },
      buildCanvasSvg: buildCanvasSvg
    };
    document.querySelectorAll(".tv-tools [data-tool]").forEach(function (button) {
      if (button.tagName === "SUMMARY") return;
      button.addEventListener("click", function () { setInteractionMode(button.getAttribute("data-tool")); });
    });
    document.querySelectorAll("[data-ann]").forEach(function (button) {
      button.addEventListener("click", function () {
        setInteractionMode(button.getAttribute("data-ann"));
        document.getElementById("tvAnnotate").open = false;
      });
    });
    document.getElementById("tvCursorMode").addEventListener("change", function (event) {
      cursorReadMode = event.target.value === "interpolate" ? "interpolate" : "nearest";
    });
    document.getElementById("tvClearCursors").addEventListener("click", function () {
      var plot = selectedPlot();
      readoutCursor = null;
      cursorHover = null;
      document.getElementById("tvInspector").hidden = true;
      if (plot && plot.fixedCursors && plot.fixedCursors.length) {
        plot.fixedCursors = [];
        setDirty(true);
      }
      renderCanvas();
    });
    setInteractionMode("pointer", true);
    renderAll();
  }());

  <script>
  (function () {
    "use strict";
    var core = window.VisualizerCore;
    if (!core || !core.APP_INFO || typeof core.checkForUpdates !== "function") return;
    var aboutDialog = document.getElementById("tvAboutDialog");
    var aboutBody = document.getElementById("tvAboutBody");
    var kicker = document.getElementById("tvKicker");
    if (kicker) kicker.textContent = "VISUALIZER v" + core.APP_INFO.version;
    var updateState = core.createUpdateState();
    var checkTicket = 0;

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function actionButton(label, role, primary) {
      var node = el("button", primary ? "tv-button tv-button--primary" : "tv-button", label);
      node.type = "button";
      node.setAttribute("data-role", role);
      return node;
    }

    function formatReleaseDate(iso) {
      var match = /^(\d{4}-\d{2}-\d{2})/.exec(String(iso || ""));
      return match ? match[1] : "";
    }

    function openExternal(url) {
      if (!url) return;
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function rememberUpdateCheck() {
      try {
        localStorage.setItem("visualizer.update.lastCheck", new Date().toISOString());
      } catch (error) {
        /* ponytail: storage can be blocked; the check result still shows */
      }
    }

    function renderAbout() {
      aboutBody.replaceChildren();
      aboutBody.appendChild(el("h2", "tv-about-name", core.APP_INFO.name));
      aboutBody.appendChild(el("p", "tv-about-tagline", "实验数据可视化工作台"));
      var meta = el("dl", "tv-about-meta");
      meta.appendChild(el("dt", "", "当前版本"));
      meta.appendChild(el("dd", "", "v" + core.APP_INFO.version));
      meta.appendChild(el("dt", "", "工程格式"));
      meta.appendChild(el("dd", "", core.PROJECT_FORMAT_VERSION));
      aboutBody.appendChild(meta);

      var status = updateState.status;
      if (status !== "idle") {
        var box = el("div", "tv-update-status");
        box.setAttribute("data-status", status);
        box.setAttribute("role", "status");
        if (status === "checking") {
          var line = el("p", "tv-update-heading");
          line.appendChild(el("span", "tv-about-spin"));
          line.appendChild(document.createTextNode("正在检查更新…"));
          box.appendChild(line);
        } else if (status === "up-to-date") {
          box.appendChild(el("p", "tv-update-heading", "当前版本不低于最新正式版本"));
          box.appendChild(el("p", "", "当前版本"));
          box.appendChild(el("p", "tv-update-version", "v" + updateState.currentVersion));
          box.appendChild(el("p", "", "最新版本"));
          box.appendChild(el("p", "tv-update-version", "v" + (updateState.latestVersion || updateState.currentVersion)));
        } else if (status === "available") {
          box.appendChild(el("p", "tv-update-heading", "发现新版本"));
          box.appendChild(el("p", "", "当前版本"));
          box.appendChild(el("p", "tv-update-version", "v" + updateState.currentVersion));
          box.appendChild(el("p", "", "最新版本"));
          box.appendChild(el("p", "tv-update-version", "v" + updateState.latestVersion));
          if (updateState.releaseName) box.appendChild(el("p", "", updateState.releaseName));
          var published = formatReleaseDate(updateState.publishedAt);
          if (published) box.appendChild(el("p", "", "发布日期：" + published));
          box.appendChild(el("p", "tv-update-heading", "更新内容"));
          box.appendChild(el("pre", "tv-update-notes", updateState.releaseNotes || "此版本没有文字说明。"));
          if (updateState.errorCode === "ASSET_NOT_FOUND" && updateState.errorMessage) {
            box.appendChild(el("p", "", updateState.errorMessage));
          }
        } else {
          box.appendChild(el("p", "tv-update-heading", "无法检查更新"));
          box.appendChild(el("p", "", updateState.errorMessage || "无法连接到 GitHub，请检查网络后重试。"));
        }
        aboutBody.appendChild(box);
      }

      var actions = el("div", "tv-update-actions");
      if (status === "available") {
        actions.appendChild(actionButton("查看更新", "open-release", false));
        actions.appendChild(actionButton("获取最新版", "download-update", true));
      } else if (status === "error") {
        var retry = actionButton("稍后重试", "check-update", false);
        actions.appendChild(retry);
        actions.appendChild(actionButton("打开 Releases 页面", "open-release", false));
      } else {
        var check = actionButton("检查更新", "check-update", false);
        check.disabled = status === "checking";
        actions.appendChild(check);
      }
      aboutBody.appendChild(actions);
      var releases = actionButton("GitHub Releases", "open-releases", false);
      releases.className = "tv-about-releases";
      aboutBody.appendChild(releases);
    }

    function handleCheckUpdate() {
      if (updateState.status === "checking") return;
      updateState = core.createUpdateState();
      updateState.status = "checking";
      renderAbout();
      var ticket = ++checkTicket;
      core.checkForUpdates().then(function (next) {
        if (ticket !== checkTicket) return;
        updateState = next;
        rememberUpdateCheck();
        if (next.status === "error") console.error("Visualizer update check failed:", next.errorCode);
        if (aboutDialog.open) renderAbout();
      });
    }

    function handleOpenReleasePage() {
      openExternal(updateState.releaseUrl || core.githubReleasesPageUrl());
    }

    function handleDownloadUpdate() {
      if (!updateState.downloadUrl) {
        handleOpenReleasePage();
        return;
      }
      openExternal(updateState.downloadUrl);
    }

    function closeAbout() {
      if (updateState.status !== "checking") updateState = core.createUpdateState();
      if (aboutDialog.open && typeof aboutDialog.close === "function") aboutDialog.close();
      else aboutDialog.removeAttribute("open");
    }

    aboutDialog.addEventListener("click", function (event) {
      var node = event.target && event.target.closest ? event.target.closest("[data-role]") : null;
      var role = node && node.getAttribute("data-role");
      if (role === "check-update") handleCheckUpdate();
      else if (role === "download-update") handleDownloadUpdate();
      else if (role === "open-release") handleOpenReleasePage();
      else if (role === "open-releases") openExternal(core.githubReleasesPageUrl());
      else if (role === "dismiss-update") closeAbout();
    });
    document.getElementById("tvAboutOpen").addEventListener("click", function () {
      renderAbout();
      if (aboutDialog.open) return;
      if (typeof aboutDialog.showModal === "function") aboutDialog.showModal();
      else aboutDialog.setAttribute("open", "");
    });
    aboutDialog.addEventListener("cancel", function (event) {
      event.preventDefault();
      closeAbout();
    });
    document.getElementById("tvAboutClose").addEventListener("click", closeAbout);
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && aboutDialog.open) closeAbout();
    });
  }());
  </script>
</body>
</html>
